name: Build · Switch Yönetim Paneli

# Switch Yönetim Paneli'nin paketleri ve Release'i.
#   • workflow_dispatch      -> yalnızca Artifact
#   • syp-v* etiketi push'u  -> Artifact + GitHub Release
#   • v* etiketi push'u      -> aynısı (eski biçim; depoda tek uygulama
#                               varken kullanılan adlandırma korunuyor)
#
# Devreye Alma Paneli ayrı derlenir: build-devreye.yml (dap-v* etiketi).
# Ortak adımlar build-app.yml içinde.

on:
  workflow_dispatch:
  push:
    tags:
      - "syp-v*"
      - "v*"

concurrency:
  group: build-switch-${{ github.ref }}
  cancel-in-progress: false      # yarım kalan release build'i iptal etme

permissions:
  contents: read

jobs:
  paket:
    uses: ./.github/workflows/build-app.yml
    permissions:
      contents: write            # Release adımı için
    with:
      uygulama_dizini: Interface/Switch Yönetim Paneli
      ad: SwitchYonetimPaneli
      gorunen_ad: Switch Yönetim Paneli
      spec: SwitchYonetimPaneli.spec
      iss: packaging/windows/SwitchYonetimPaneli.iss
