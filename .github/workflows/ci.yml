name: CI

# Devreye Alma Paneli için üç platformda kurulum + self-test + birim
# testler. Gerçek cihaza ya da yerel ağa hiç dokunmaz: self-test yalnızca
# 127.0.0.1'de kendi servisini sınar, testler sahte cihaz sunucuları
# kullanır.
#
# Switch Yönetim Paneli bu branch'te değil — o uygulamanın CI'ı `syp`
# branch'indeki kendi ci.yml dosyasındadır.
#
# Maliyet için her commit'te ÇALIŞMAZ. Yalnızca:
#   • etiket push'unda (yayın öncesi son kontrol)
#   • elle başlatınca (Actions → CI → Run workflow)
# Günlük geliştirmede yerelde çalıştır:
#   python3 app.py --self-test
#   python3 -m unittest discover -s tests -t .

on:
  push:
    tags:
      - "dap-v*"
  workflow_dispatch:

permissions:
  contents: read          # CI'nın yazma iznine ihtiyacı yok

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_SURUMU: "3.12"

jobs:
  self-test:
    name: Devreye Alma Paneli · ${{ matrix.ad }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Matris bilerek tek tek yazıldı: `include` ile platform başına satır
      # üretmek GitHub'ın birleştirme kuralları yüzünden eksik ya da fazla
      # iş çıkarıyor. Üç satır açıkça görünsün.
      matrix:
        include:
          - { ad: Windows, os: windows-2025, req: requirements-windows.txt }
          - { ad: Ubuntu,  os: ubuntu-22.04, req: requirements-linux.txt }
          - { ad: macOS,   os: macos-15,     req: requirements-macos.txt }

    steps:
      - name: Depoyu al
        uses: actions/checkout@v6

      - name: Python ${{ env.PYTHON_SURUMU }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_SURUMU }}
          cache: pip
          cache-dependency-path: docs/requirements*.txt

      - name: Qt sistem kütüphaneleri (yalnız Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxkbcommon-x11-0 libegl1 libgl1 libnss3

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "docs/${{ matrix.req }}"

      - name: Söz dizimi / derleme kontrolü
        run: python -m compileall -q app.py panel_api.py core betikler

      - name: Birim testler
        run: python -m unittest discover -s tests -t .

      - name: Self-test (kaynak koddan)
        run: python app.py --self-test

      - name: Sürüm okunabiliyor mu
        run: python app.py --version

  surum-kontrol:
    name: Etiket ↔ sürüm kontrolü
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6

      - name: Etiket doğru uygulamayı ve sürümü gösteriyor mu
        shell: bash
        run: |
          set -euo pipefail
          ETIKET="$GITHUB_REF_NAME"
          case "$ETIKET" in
            dap-v*) : ;;
            *) echo "::error::Bu branch'e ait olmayan etiket biçimi: $ETIKET"
               exit 1 ;;
          esac
          SURUM="${ETIKET#*-v}"; SURUM="${SURUM#v}"
          # Sürüm kaynağı: uygulamanın kendi sabiti (grep ile — bağımlılık
          # kurmadan okunuyor).
          KAYNAK_DOSYA="core/ayar.py"
          KAYNAK=$(sed -n 's/^APP_VERSION[[:space:]]*=[[:space:]]*["'"'"']\([^"'"'"']*\)["'"'"'].*/\1/p' \
                   "$KAYNAK_DOSYA" | head -n1)
          echo "Etiket : $ETIKET"
          echo "Etiketteki sürüm: $SURUM"
          echo "Kaynaktaki sürüm: $KAYNAK  ($KAYNAK_DOSYA)"
          if [ "$SURUM" != "$KAYNAK" ]; then
            echo "::error::Etiket ile APP_VERSION uyuşmuyor."
            exit 1
          fi
          echo "Uyuşuyor."

  repo-kontrol:
    name: Depo kontrolleri
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6

      - name: İzlenen hassas dosya var mı
        run: |
          set -euo pipefail
          # Yalnızca dosya adlarına bakar, içeriklerini yazdırmaz.
          BULUNAN=$(git ls-files \
            | grep -Ei '(^|/)\.env$|\.pem$|\.key$|\.p12$|\.pfx$|id_rsa' || true)
          if [ -n "$BULUNAN" ]; then
            echo "::warning::Depoda izlenen hassas olabilecek dosyalar var:"
            echo "$BULUNAN" | sed 's/^/  /'
          else
            echo "İzlenen hassas dosya yok."
          fi

      - name: Çalışma ağacı temiz mi (üretilen dosya izleniyor mu)
        run: |
          set -euo pipefail
          git status --porcelain > /tmp/durum
          if [ -s /tmp/durum ]; then
            echo "::error::Checkout sonrası çalışma ağacı kirli:"
            cat /tmp/durum
            exit 1
          fi
          echo "Çalışma ağacı temiz."
