name: CI

# Install + self-test + unit tests for the Commissioning and Maintenance
# Panel on three platforms. It never touches a real device or the local
# network: the self-test exercises the production socketless Python–JavaScript
# bridge, and the tests use fake device servers.
#
# The Switch Management Panel is not on this branch — that application's CI
# lives in its own ci.yml on the `syp` branch.
#
# It does NOT run on every commit, for cost. Only:
#   • on a tag push (last check before a release)
#   • when started by hand (Actions → CI → Run workflow)
# For day-to-day development, run locally:
#   python3 app.py --self-test
#   python3 -m unittest discover -s tests -t .

on:
  push:
    tags:
      - "dap-v*"
  workflow_dispatch:

permissions:
  contents: read          # CI needs no write access

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  self-test:
    name: Commissioning Panel · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # The matrix is written out deliberately: producing one row per
      # platform with `include` yields too few or too many jobs because of
      # GitHub's merge rules. Keep the three rows explicit.
      matrix:
        include:
          - { name: Windows, os: windows-2025, req: requirements-windows.txt }
          - { name: Ubuntu,  os: ubuntu-22.04, req: requirements-linux.txt }
          - { name: macOS,   os: macos-15,     req: requirements-macos.txt }

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: docs/requirements*.txt

      - name: Deno 2.9.4
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Qt system libraries (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxkbcommon-x11-0 libegl1 libgl1 libnss3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "docs/${{ matrix.req }}"

      - name: Syntax / compile check
        shell: bash
        run: |
          set -euo pipefail
          # compileall silently succeeds on a path that does not exist, which
          # is how a renamed package went unnoticed. Check first, then compile.
          TARGETS=(app.py panel field_scripts tools tests)
          MISSING=0
          for t in "${TARGETS[@]}"; do
            if [ ! -e "$t" ]; then
              echo "::error::compile target missing: $t"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1
          python -m compileall -q "${TARGETS[@]}"

      - name: Is the socketless desktop UI up to date
        run: python tools/build_desktop_bundle.py --check

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Self-test (from source)
        run: python app.py --self-test

      - name: Can the version be read
        run: python app.py --version

  version-check:
    name: Tag ↔ version check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Does the tag point at the right application and version
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          case "$TAG" in
            dap-v*) : ;;
            *) echo "::error::tag format does not belong to this branch: $TAG"
               exit 1 ;;
          esac
          TAG_VERSION="${TAG#*-v}"; TAG_VERSION="${TAG_VERSION#v}"
          # Version source: the application's own constant (read with grep,
          # so no dependencies need installing).
          SOURCE_FILE="panel/settings.py"
          test -f "$SOURCE_FILE" || {
            echo "::error::version source not found: $SOURCE_FILE"; exit 1; }
          SOURCE_VERSION=$(sed -n 's/^APP_VERSION[[:space:]]*=[[:space:]]*["'"'"']\([^"'"'"']*\)["'"'"'].*/\1/p' \
                   "$SOURCE_FILE" | head -n1)
          echo "Tag             : $TAG"
          echo "Version in tag  : $TAG_VERSION"
          echo "Version in source: $SOURCE_VERSION  ($SOURCE_FILE)"
          if [ "$TAG_VERSION" != "$SOURCE_VERSION" ]; then
            echo "::error::tag and APP_VERSION do not match."
            exit 1
          fi
          echo "They match."

  repo-checks:
    name: Repository checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Any tracked sensitive files
        run: |
          set -euo pipefail
          # Looks at file names only; never prints their contents.
          FOUND=$(git ls-files \
            | grep -Ei '(^|/)\.env$|\.pem$|\.key$|\.p12$|\.pfx$|id_rsa' || true)
          if [ -n "$FOUND" ]; then
            echo "::warning::the repository tracks possibly sensitive files:"
            echo "$FOUND" | sed 's/^/  /'
          else
            echo "No tracked sensitive files."
          fi

      - name: Any credentials in the inventory
        run: |
          set -euo pipefail
          # The file NAME check (the step above) could not catch this: the
          # credentials sat inside an ordinary JSON file. The panel does not
          # use those fields (credentials come from the user, see
          # panel/inventory/device_map.py) and the SIP password is derived
          # from the extension, so all of them must be EMPTY.
          #
          # Values are never printed: finding a secret and echoing it into
          # the run log multiplies the leak instead of fixing it.
          FILES=$(git ls-files '*DeviceMap*.json' || true)
          [ -n "$FILES" ] || { echo "No DeviceMap file."; exit 0; }
          BAD=0
          for f in $FILES; do
            COUNT=$(grep -Eoc '"(Password|Username|PBXPassword)"[[:space:]]*:[[:space:]]*"[^"]+"' "$f" || true)
            if [ "${COUNT:-0}" -gt 0 ]; then
              echo "::error::$f holds $COUNT populated credential field(s)"
              BAD=1
            fi
          done
          [ "$BAD" -eq 0 ] || exit 1
          echo "No populated credential fields in the inventory."

      - name: Is the working tree clean (is a generated file tracked)
        run: |
          set -euo pipefail
          git status --porcelain > /tmp/worktree-status
          if [ -s /tmp/worktree-status ]; then
            echo "::error::the working tree is dirty after checkout:"
            cat /tmp/worktree-status
            exit 1
          fi
          echo "The working tree is clean."
