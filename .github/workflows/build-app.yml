name: Paket üret (ortak)

# Bir uygulamayı dört platform için paketler ve etiket push'unda Release
# yayınlar. Kendi başına çalışmaz: çağıran workflow'lar hangi uygulamanın
# derleneceğini söyler.
#
#   .github/workflows/build-switch.yml    Switch Yönetim Paneli
#   .github/workflows/build-devreye.yml   Devreye Alma Paneli
#
# Depoda iki uygulama var ve ikisi AYRI AYRI derlenip ayrı Release alıyor.
# Ortak adımlar (build, self-test, paketleme, Release doğrulaması) burada tek
# yerde durur; iki kopya yan yana yaşarsa biri düzeltilip diğeri unutuluyor.
#
# Çıktılar İMZASIZDIR (kod imzalama kapsam dışı).

on:
  workflow_call:
    inputs:
      uygulama_dizini:
        description: Uygulama kökü (depo köküne göre)
        required: true
        type: string
      ad:
        description: Çıktı adı — exe/dist klasörü ve dosya adları (ASCII)
        required: true
        type: string
      gorunen_ad:
        description: macOS .app paketinin görünen adı
        required: true
        type: string
      spec:
        description: PyInstaller spec dosyası (uygulama köküne göre)
        required: true
        type: string
      iss:
        description: Inno Setup betiği (uygulama köküne göre)
        required: true
        type: string
      testler:
        description: Birim test komutu — boşsa test adımı atlanır
        required: false
        type: string
        default: ""
      python_surumu:
        required: false
        type: string
        default: "3.12"

permissions:
  contents: read          # build job'ları için okuma yeterli

env:
  UYGULAMA_DIZINI: ${{ inputs.uygulama_dizini }}
  ADI: ${{ inputs.ad }}
  PYTHON_SURUMU: ${{ inputs.python_surumu }}
  # appimagetool'un beklenen sha256'sı. Boşken doğrulama yapılmaz, indirilen
  # dosyanın özeti log'a yazılır; ilk çalıştırmadan sonra buraya yapıştırıp
  # sabitleyin.
  APPIMAGETOOL_SHA256: ""

jobs:
  build:
    name: ${{ inputs.ad }} · ${{ matrix.ad }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - ad: windows-x64
            os: windows-2025
            req: requirements-windows.txt
            hedef: windows-x64
          - ad: linux-x86_64
            os: ubuntu-22.04
            req: requirements-linux.txt
            hedef: linux-x86_64
          - ad: macos-arm64
            os: macos-15
            req: requirements-macos.txt
            hedef: macos-arm64
          - ad: macos-x64
            os: macos-15-intel
            req: requirements-macos.txt
            hedef: macos-x64

    steps:
      - name: Depoyu al
        uses: actions/checkout@v6

      - name: Python ${{ env.PYTHON_SURUMU }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_SURUMU }}
          cache: pip
          cache-dependency-path: ${{ env.UYGULAMA_DIZINI }}/docs/requirements*.txt

      - name: Qt sistem kütüphaneleri (yalnız Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxkbcommon-x11-0 libegl1 libgl1 libnss3 desktop-file-utils

      - name: Bağımlılıkları kur
        working-directory: ${{ env.UYGULAMA_DIZINI }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "docs/${{ matrix.req }}"
          python -m pip install -r docs/requirements-build.txt

      - name: Sürümü belirle
        id: surum
        shell: bash
        working-directory: ${{ env.UYGULAMA_DIZINI }}
        run: |
          set -euo pipefail
          KAYNAK="$(python app.py --version)"
          echo "Kaynaktaki sürüm: $KAYNAK"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            # Etiket önekleri: "dap-v0.9.0" ya da eski biçim "v1.0.2".
            ETIKET="${GITHUB_REF_NAME#*-v}"
            ETIKET="${ETIKET#v}"
            if [[ "$ETIKET" != "$KAYNAK" ]]; then
              echo "::error::Etiket ($GITHUB_REF_NAME → $ETIKET) ile APP_VERSION ($KAYNAK) uyuşmuyor."
              echo "Kaynaktaki sürümü güncelleyin ya da doğru etiketi atın."
              exit 1
            fi
            SURUM="$ETIKET"
          else
            SURUM="$KAYNAK"
          fi
          echo "surum=$SURUM" >> "$GITHUB_OUTPUT"
          echo "Kullanılacak sürüm: $SURUM"

      - name: Birim testler
        if: inputs.testler != ''
        working-directory: ${{ env.UYGULAMA_DIZINI }}
        run: ${{ inputs.testler }}

      - name: Self-test (kaynak koddan)
        working-directory: ${{ env.UYGULAMA_DIZINI }}
        run: python app.py --self-test

      - name: Temiz PyInstaller build
        shell: bash
        working-directory: ${{ env.UYGULAMA_DIZINI }}
        run: |
          set -euo pipefail
          rm -rf build dist
          python -m PyInstaller --noconfirm --clean "${{ inputs.spec }}"
          ls -la dist

      # ── paketlenmiş uygulamada self-test ────────────────────────────────
      # Uygulama console=False (GUI alt sistemi) ile derleniyor. Böyle bir
      # exe'yi PowerShell'de "& $exe" ile çağırınca kabuk onu BEKLEMEZ ve
      # $LASTEXITCODE dolmaz. Start-Process -Wait -PassThru ile hem bekliyor
      # hem gerçek çıkış kodunu alıyoruz; çıktıyı da dosyaya yönlendirip
      # log'a basıyoruz.
      - name: Self-test (paketlenmiş) — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.UYGULAMA_DIZINI }}
        run: |
          $exe = "dist/${{ inputs.ad }}/${{ inputs.ad }}.exe"
          if (-not (Test-Path $exe)) { throw "exe bulunamadı: $exe" }
          $tam = (Resolve-Path $exe).Path
          $cikti = Join-Path $env:RUNNER_TEMP "selftest-out.txt"
          $hata  = Join-Path $env:RUNNER_TEMP "selftest-err.txt"

          $p = Start-Process -FilePath $tam -ArgumentList '--self-test' `
                 -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput $cikti -RedirectStandardError $hata

          if (Test-Path $cikti) { Get-Content $cikti }
          if ((Test-Path $hata) -and (Get-Item $hata).Length -gt 0) {
            Write-Host "--- stderr ---"
            Get-Content $hata
          }

          if ($null -eq $p.ExitCode) { throw "çıkış kodu okunamadı" }
          if ($p.ExitCode -ne 0) { throw "self-test başarısız ($($p.ExitCode))" }
          Write-Host "paketlenmiş self-test tamam (çıkış kodu 0)"

      - name: Self-test (paketlenmiş) — macOS
        if: runner.os == 'macOS'
        working-directory: ${{ env.UYGULAMA_DIZINI }}
        run: |
          set -euo pipefail
          BIN="dist/${{ inputs.gorunen_ad }}.app/Contents/MacOS/${{ inputs.ad }}"
          test -x "$BIN" || { echo "çalıştırılabilir bulunamadı: $BIN"; exit 1; }
          "$BIN" --self-test

      - name: Self-test (paketlenmiş) — Linux
        if: runner.os == 'Linux'
        working-directory: ${{ env.UYGULAMA_DIZINI }}
        run: |
          set -euo pipefail
          "./dist/${{ inputs.ad }}/${{ inputs.ad }}" --self-test

      # ── platforma göre paketleme ────────────────────────────────────────
      - name: Paketle — Windows (onedir ZIP)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.UYGULAMA_DIZINI }}
        run: |
          $ad = "${{ inputs.ad }}-${{ steps.surum.outputs.surum }}-${{ matrix.hedef }}.zip"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist/${{ inputs.ad }}" -DestinationPath "release/$ad" -Force
          Get-Item "release/$ad" | Select-Object Name, Length

      # ── Windows kurulum paketi (Inno Setup) ─────────────────────────────
      # ZIP'ten çıkarılan dosyalara Windows "internetten indirildi" damgası
      # koyuyor ve .NET, Python.Runtime.dll'i 0x80131515 ile reddediyor.
      # Installer ile kurulan dosyalarda bu damga oluşmaz.
      - name: WebView2 bootstrapper indir
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.UYGULAMA_DIZINI }}
        run: |
          $hedef = "packaging/windows/redist"
          New-Item -ItemType Directory -Force -Path $hedef | Out-Null
          $dosya = Join-Path $hedef "MicrosoftEdgeWebview2Setup.exe"
          # Microsoft'un kalıcı Evergreen Bootstrapper bağlantısı
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile $dosya -UseBasicParsing
          $b = (Get-Item $dosya).Length
          if ($b -lt 100kb) { throw "bootstrapper şüpheli küçük: $b bayt" }
          Write-Host "bootstrapper: $b bayt"
          Write-Host "sha256: $((Get-FileHash $dosya -Algorithm SHA256).Hash)"

      - name: Inno Setup hazırla
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup bulunamadı, kuruluyor…"
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe bulunamadı: $iscc" }
          & $iscc /? | Select-Object -First 1
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Paketle — Windows (kurulum paketi)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.UYGULAMA_DIZINI }}
        run: |
          $surum = "${{ steps.surum.outputs.surum }}"
          & "$env:ISCC" `
            "/DMyAppVersion=$surum" `
            "/DSourceDir=..\..\dist\${{ inputs.ad }}" `
            "/DOutputDir=..\..\release" `
            "${{ inputs.iss }}".Replace('/', '\')
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup başarısız ($LASTEXITCODE)" }

          $setup = "release/${{ inputs.ad }}-$surum-windows-x64-Setup.exe"
          if (-not (Test-Path $setup)) { throw "kurulum paketi üretilmedi: $setup" }
          $b = (Get-Item $setup).Length
          if ($b -lt 5mb) { throw "kurulum paketi şüpheli küçük: $b bayt" }
          Write-Host "kurulum paketi: $setup ($([math]::Round($b/1mb,1)) MB)"

      - name: Paketle — macOS (.app, ditto ile ZIP)
        if: runner.os == 'macOS'
        working-directory: ${{ env.UYGULAMA_DIZINI }}
        run: |
          set -euo pipefail
          AD="${{ inputs.ad }}-${{ steps.surum.outputs.surum }}-${{ matrix.hedef }}.zip"
          mkdir -p release
          # ditto: macOS dosya öznitelikleri ve sembolik bağlar korunur
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/${{ inputs.gorunen_ad }}.app" "release/$AD"
          ls -lh "release/$AD"

      - name: Paketle — Linux (AppImage)
        if: runner.os == 'Linux'
        working-directory: ${{ env.UYGULAMA_DIZINI }}
        run: |
          set -euo pipefail
          TEMEL="${{ inputs.ad }}-${{ steps.surum.outputs.surum }}-${{ matrix.hedef }}"
          chmod +x packaging/appimage.sh
          ./packaging/appimage.sh "dist/${{ inputs.ad }}" "release/$TEMEL.AppImage" \
            "${{ steps.surum.outputs.surum }}"

      - name: AppImage doğrulaması
        if: runner.os == 'Linux'
        working-directory: ${{ env.UYGULAMA_DIZINI }}
        run: |
          set -euo pipefail
          IMG="$(ls release/*.AppImage)"
          test -s "$IMG" || { echo "AppImage boş"; exit 1; }
          echo "boyut: $(du -h "$IMG" | cut -f1)"
          # CI'da FUSE yok — içeriği açarak sınıyoruz
          cd "$(mktemp -d)"
          "$OLDPWD/$IMG" --appimage-extract > /dev/null
          test -x squashfs-root/AppRun || { echo "AppRun yok"; exit 1; }
          "./squashfs-root/usr/bin/${{ inputs.ad }}" --self-test

      - name: AppImage'i ZIP'e koy
        if: runner.os == 'Linux'
        working-directory: ${{ env.UYGULAMA_DIZINI }}
        run: |
          set -euo pipefail
          TEMEL="${{ inputs.ad }}-${{ steps.surum.outputs.surum }}-${{ matrix.hedef }}"
          cd release
          # ZIP çalıştırma iznini saklar; AppImage açıldığında chmod +x
          # gerekmez. Ayrıca artifact/release boyutu küçülür.
          zip -9 -q "$TEMEL.zip" "$TEMEL.AppImage"
          rm -f "$TEMEL.AppImage"
          unzip -l "$TEMEL.zip"
          ls -lh "$TEMEL.zip"

      - name: Çıktıları doğrula
        shell: bash
        working-directory: ${{ env.UYGULAMA_DIZINI }}
        run: |
          set -euo pipefail
          SURUM="${{ steps.surum.outputs.surum }}"
          HEDEF="${{ matrix.hedef }}"
          ADI="${{ inputs.ad }}"

          # Platform başına TAM olarak hangi dosyaların beklendiği.
          # Eksik dosya sessizce geçmesin diye tek tek arıyoruz.
          case "$HEDEF" in
            windows-x64)
              BEKLENEN=("$ADI-$SURUM-windows-x64.zip"
                        "$ADI-$SURUM-windows-x64-Setup.exe") ;;
            *)
              BEKLENEN=("$ADI-$SURUM-$HEDEF.zip") ;;
          esac

          echo "release/ içeriği:"
          ls -lh release/

          EKSIK=0
          for d in "${BEKLENEN[@]}"; do
            if [ ! -f "release/$d" ]; then
              echo "::error::beklenen çıktı yok: $d"
              EKSIK=1
            elif [ ! -s "release/$d" ]; then
              echo "::error::çıktı boş: $d"
              EKSIK=1
            else
              BOYUT=$(du -h "release/$d" | cut -f1)
              echo "  OK  $d ($BOYUT)"
            fi
          done
          [ "$EKSIK" -eq 0 ] || exit 1

          FAZLA=$(( $(find release -type f | wc -l) - ${#BEKLENEN[@]} ))
          [ "$FAZLA" -eq 0 ] || echo "::warning::release/ içinde $FAZLA fazladan dosya var"

          # İş özetine yaz: log'a girmeden görünür olsun
          {
            echo "### $ADI · $HEDEF"
            for d in "${BEKLENEN[@]}"; do
              echo "- \`$d\` — $(du -h "release/$d" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artifact yükle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.ad }}-portable-${{ matrix.hedef }}
          path: ${{ env.UYGULAMA_DIZINI }}/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: ${{ inputs.ad }} · GitHub Release
    # Yalnızca etiket push'unda ve tüm build'ler geçtiyse
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write       # yalnızca burada yazma izni
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6

      - name: Artifact'leri indir
        uses: actions/download-artifact@v8
        with:
          path: indirilen
          pattern: ${{ inputs.ad }}-portable-*
          merge-multiple: true

      - name: Dosyaları doğrula
        shell: bash
        run: |
          set -euo pipefail
          SURUM="${GITHUB_REF_NAME#*-v}"; SURUM="${SURUM#v}"
          ADI="${{ inputs.ad }}"
          cd indirilen
          echo "İndirilen dosyalar:"
          ls -lh

          # Beklenen tam liste — biri eksikse Release YAYINLANMAZ.
          BEKLENEN=(
            "$ADI-$SURUM-windows-x64.zip"
            "$ADI-$SURUM-windows-x64-Setup.exe"
            "$ADI-$SURUM-linux-x86_64.zip"
            "$ADI-$SURUM-macos-arm64.zip"
            "$ADI-$SURUM-macos-x64.zip"
          )
          EKSIK=0
          for d in "${BEKLENEN[@]}"; do
            if [ ! -s "$d" ]; then
              echo "::error::eksik ya da boş: $d"
              EKSIK=1
            else
              echo "  OK  $d ($(du -h "$d" | cut -f1))"
            fi
          done
          [ "$EKSIK" -eq 0 ] || exit 1

      - name: SHA256SUMS.txt üret
        shell: bash
        run: |
          set -euo pipefail
          cd indirilen
          # Glob'u açıkça yazıyoruz: "*" kullanılırsa dosya kendini de
          # listeleyebiliyor.
          sha256sum *.zip *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release oluştur / güncelle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ETIKET: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTLAR="$GITHUB_WORKSPACE/${{ inputs.uygulama_dizini }}/docs/RELEASE_NOTES.md"
          BASLIK="${{ inputs.gorunen_ad }} $ETIKET"
          cd indirilen

          if gh release view "$ETIKET" >/dev/null 2>&1; then
            echo "Release zaten var — dosyalar üzerine yazılıyor."
            gh release upload "$ETIKET" ./* --clobber
            # Notları da tazele: yalnızca dosya yüklemek, gövdeyi ilk
            # oluşturmadaki eski metinle bırakıyordu.
            gh release edit "$ETIKET" \
              --draft=false --title "$BASLIK" --notes-file "$NOTLAR"

            # Adı değişen çıktılar geride kalıyor: --clobber yalnızca aynı
            # isimli dosyayı değiştirir, eskisini silmez. (Örn. AppImage
            # ZIP'e alınınca eski .AppImage varlığı asılı kalmıştı.)
            echo "Beklenmeyen eski varlıklar temizleniyor…"
            gh release view "$ETIKET" --json assets --jq '.assets[].name' \
            | while read -r AD; do
                if [ ! -e "$AD" ]; then
                  echo "  siliniyor: $AD"
                  gh release delete-asset "$ETIKET" "$AD" --yes
                fi
              done
          else
            echo "Yeni release oluşturuluyor: $ETIKET"
            # Ön sürüm etiketleri (0.9.0-dev gibi) "pre-release" işaretlenir.
            EK=()
            case "$ETIKET" in
              *-dev|*-alpha*|*-beta*|*-rc*) EK+=(--prerelease) ;;
            esac
            gh release create "$ETIKET" ./* \
              --title "$BASLIK" \
              --notes-file "$NOTLAR" \
              --generate-notes "${EK[@]}"
          fi

      - name: Release'i doğrula
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ETIKET: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # gh release create sessizce yarım kalırsa burada yakalanır.
          BILGI="$(gh release view "$ETIKET" --json url,isDraft,assets)"
          ADRES=$(echo "$BILGI" | jq -r .url)
          TASLAK=$(echo "$BILGI" | jq -r .isDraft)

          echo "Release : $ADRES"
          echo "Taslak  : $TASLAK"
          echo "$BILGI" | jq -r '.assets[] | "  \(.name)  \(.size) bayt"'

          if [ "$TASLAK" != "false" ]; then
            echo "::error::Release taslak durumda kaldı"
            exit 1
          fi

          # Yüklediğimiz dosyalarla release'deki varlıklar birebir aynı mı?
          # Sayı saymak yerine ad ad karşılaştırıyoruz: fazlalık da eksiklik
          # de görünür olsun.
          ls indirilen | sort > /tmp/beklenen
          echo "$BILGI" | jq -r '.assets[].name' | sort > /tmp/gelen
          if ! diff -u /tmp/beklenen /tmp/gelen > /tmp/fark; then
            echo "::error::Release varlıkları beklenenle uyuşmuyor:"
            cat /tmp/fark
            exit 1
          fi
          echo "Release varlıkları beklenenle birebir aynı."

          {
            echo "## ${{ inputs.gorunen_ad }} — Release yayınlandı"
            echo ""
            echo "$ADRES"
            echo ""
            echo "$BILGI" | jq -r '.assets[] | "- `\(.name)` — \(.size) bayt"'
          } >> "$GITHUB_STEP_SUMMARY"
