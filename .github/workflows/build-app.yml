name: Build app (reusable)

# Packages one application for four platforms and publishes a Release on a
# tag push. It does not run on its own: the calling workflow says which
# application is being built.
#
#   .github/workflows/build-commissioning-panel.yml   Commissioning Panel
#
# Common steps (build, self-test, packaging, release verification) live here
# in one place; two copies side by side means one gets fixed and the other
# forgotten.
#
# Outputs are UNSIGNED (code signing is out of scope).

on:
  workflow_call:
    inputs:
      app_dir:
        description: Application root (relative to the repository root)
        required: true
        type: string
      edition:
        description: >-
          Which package is being built — an id from the edition table
          (panel/editions/catalogue.py). Everything else that used to be
          passed in here is READ FROM THAT TABLE by the "Resolve the
          edition" step below: the output name, the product name people
          read, and the Windows AppId. Passing them in as well would mean
          two places to change when an edition is added, with the copy in
          the half nobody runs locally.
        required: true
        type: string
      spec:
        description: PyInstaller spec file (relative to the application root)
        required: true
        type: string
      iss:
        description: Inno Setup script (relative to the application root)
        required: true
        type: string
      tests:
        description: Unit test command — the test step is skipped when empty
        required: false
        type: string
        default: ""
      frontend_bundle_tool:
        description: Single-file desktop UI verifier — skipped when empty
        required: false
        type: string
        default: ""
      python_version:
        required: false
        type: string
        default: "3.12"
    secrets:
      DAP_ADMIN_KEY_SECRET:
        description: >-
          The service key's build secret. Every package is built with a
          one-way DIGEST of it and can therefore RECOGNISE a key without
          being able to make one; no package is ever built with the secret
          itself, which stays with whoever cuts the builds and is what
          writes a stick from source (see panel/adminkey/secret.py).

          Not required, so a fork with no secrets configured can still build.
          Such a build carries no key material and says so: admin mode simply
          cannot be opened on it, and `--self-test` reports "none".
        required: false

permissions:
  contents: read          # read access is enough for the build jobs

env:
  APP_DIR: ${{ inputs.app_dir }}
  EDITION: ${{ inputs.edition }}
  PYTHON_VERSION: ${{ inputs.python_version }}
  # THE PRODUCT NAME IS TURKISH and the message catalogue is half Turkish,
  # while Windows hands a Python process a cp1252 stdout, which has no room
  # for U+0131 (the dotless i). A build died on that one letter
  # (`tools/edition_info.py`), and the failure mode elsewhere is worse:
  # output silently disappears and a step that greps for it fails for no
  # visible reason. Set for every Python in the job, the packaged .exe
  # included — it reads these at start-up.
  PYTHONIOENCODING: "utf-8"
  PYTHONUTF8: "1"
  # NO BUILD MACHINE'S NETWORK IS RECONFIGURED BY A BUILD. `--self-test`
  # calls the same `api.start()` the product does, and that reaches
  # `network.ensure()`, which really writes IP aliases to the runner's
  # adapter (see panel/api/lifecycle.py). The mask it writes is the
  # project's own width, so an edition declaring `prefix: 16` had the
  # packaged .exe put a /16 on the runner's NIC — over the hosted runner's
  # own private subnet, for the 10.x projects. Every /16 edition's Windows
  # job then hung in the packaged self-test with nothing in the log, while
  # the /24 edition next to it passed in three seconds. The self-test has
  # nothing to prove by touching the adapter; the switch that says so is
  # this one (see panel/network/aliases.py).
  PANEL_NETWORK_WRITES: "0"
  # appimagetool's version AND its expected sha256 live together in
  # packaging/appimage.sh — the two have to be bumped as a pair, and a copy
  # of the digest here would be the copy that drifts.

jobs:
  build:
    name: ${{ inputs.edition }} · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            req: requirements-windows.txt
            target: windows-x64
          - name: linux-x86_64
            os: ubuntu-22.04
            req: requirements-linux.txt
            target: linux-x86_64
          - name: macos-arm64
            os: macos-15
            req: requirements-macos.txt
            target: macos-arm64
          - name: macos-x64
            os: macos-15-intel
            req: requirements-macos.txt
            target: macos-x64

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      # ── the key material gate ───────────────────────────────────────────
      # A RELEASE without the secret would be a package that can never
      # recognise a service key: admin mode unreachable on every field
      # laptop it lands on, and nothing says so until somebody is standing
      # next to one with a stick in hand. The escape hatch on the
      # PyInstaller step used to be unconditional, which disabled the
      # spec's refusal for real releases too; now a run on a tag ref stops
      # here instead — FIRST, before the suite and the downloads burn four
      # runners' time saying it later.
      #
      # ANY run whose ref is a tag counts as a release, dispatched or
      # pushed: `github.ref_type` reflects the ref, not the event, and the
      # rest of this workflow (the version check, the release job) already
      # draws the line in the same place. A fork without the secret builds
      # artifact-only trials by dispatching from a BRANCH ref.
      - name: A tagged build must carry the key secret
        if: github.ref_type == 'tag'
        shell: bash
        env:
          HAS_KEY_SECRET: ${{ secrets.DAP_ADMIN_KEY_SECRET != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEY_SECRET" != "true" ]; then
            echo "::error::this is a release build and DAP_ADMIN_KEY_SECRET is not configured."
            echo "Configure the repository secret (see docs/BUILD_RELEASE.md),"
            echo "or build an artifact-only trial via workflow_dispatch from a branch."
            exit 1
          fi
          echo "Key secret is configured."

      # ── who this package is ────────────────────────────────────────────
      # Read from the edition table so the workflow holds no second copy of
      # it. `tools/edition_info.py` loads the table directly and needs
      # nothing installed, so this can run before pip.
      - name: Resolve the edition
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          for FIELD in app_name display_name app_id; do
            VALUE="$(python3 tools/edition_info.py \
                       --edition "$EDITION" --field "$FIELD")"
            echo "$(echo "$FIELD" | tr '[:lower:]' '[:upper:]')=$VALUE" \
              >> "$GITHUB_ENV"
            echo "  $FIELD = $VALUE"
          done

      - name: Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/docs/requirements*.txt

      - name: Deno 2.9.4
        if: inputs.frontend_bundle_tool != ''
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Qt system libraries (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxkbcommon-x11-0 libegl1 libgl1 libnss3 desktop-file-utils

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "docs/${{ matrix.req }}"
          python -m pip install -r docs/requirements-build.txt

      - name: Determine the version
        id: version
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(python app.py --version)"
          echo "Version in source: $SOURCE_VERSION"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            # Tag shapes: "dap-gdm-v0.9.8", the single-edition "dap-v0.9.0"
            # and the older bare "v1.0.2".
            #
            # "##" (longest match), never "#": an edition id may itself
            # contain "-v". With "#" the tag "dap-vip-yatakli-v0.9.8" strips
            # only "dap-v" and the build is named after "ip-yatakli-v0.9.8".
            TAG_VERSION="${GITHUB_REF_NAME##*-v}"
            TAG_VERSION="${TAG_VERSION#v}"
            if [[ "$TAG_VERSION" != "$SOURCE_VERSION" ]]; then
              echo "::error::Tag ($GITHUB_REF_NAME → $TAG_VERSION) does not match APP_VERSION ($SOURCE_VERSION)."
              echo "Update the version in source or push the right tag."
              exit 1
            fi
            VERSION="$TAG_VERSION"
          else
            VERSION="$SOURCE_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version to use: $VERSION"

      - name: Is the socketless desktop UI up to date
        if: inputs.frontend_bundle_tool != ''
        working-directory: ${{ env.APP_DIR }}
        run: python "${{ inputs.frontend_bundle_tool }}" --check

      - name: Unit tests
        if: inputs.tests != ''
        working-directory: ${{ env.APP_DIR }}
        run: ${{ inputs.tests }}

      - name: Self-test (from source)
        working-directory: ${{ env.APP_DIR }}
        # As the edition being built, so the check covers THIS customer's
        # device list and not whichever one the source tree happens to hold.
        run: python app.py --edition "$EDITION" --self-test

      # A bare run must refuse to start. From source there is no stamp, and
      # "whichever DeviceMap the tree happens to hold" is not an answer
      # anybody meant to give — so the panel names the editions and stops.
      # Checked here because edition resolution deliberately sits BEFORE the
      # elevation gate, which CI cannot pass.
      - name: A run with no edition is refused
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        env:
          DAP_EDITION: ""
        run: |
          set +e
          OUTPUT="$(python app.py 2>&1)"
          CODE=$?
          set -e
          echo "$OUTPUT"
          if [ "$CODE" -eq 0 ]; then
            echo "::error::a run with no edition must not start"
            exit 1
          fi
          echo "refused with exit code $CODE, as it must be."

      # ── the ADB tools ───────────────────────────────────────────────────
      # WITHOUT THIS STEP EVERY RELEASE SHIPS WITHOUT adb. The panel carries
      # its own copy because a commissioning laptop has no reason to have
      # Android Studio on it (panel/adb/binary.py); the source tree does not
      # carry the executables, because they are a third-party download with
      # their own licence. So the archive is fetched here, per runner.
      #
      # The spec REFUSES to build without it (DAP_ALLOW_NO_ADB is not set
      # below), and `--self-test` on the packaged application checks it
      # again — a silently adb-less package is the exact failure this whole
      # arrangement exists to prevent, and it is invisible until a display
      # in the field reports itself unreadable.
      #
      # Unzipped with Python rather than `unzip`: Python is already set up on
      # every runner and `unzip` is not on the Windows one.
      # PINNED AND VERIFIED, because this download is not a build tool: the
      # spec copies it INTO every package (dabp.spec, platform-tools), so
      # "-latest-" here meant the adb every customer receives changed on
      # Google's schedule, unverified, between two builds of the same tag.
      # The digests come from Google's own repository manifest
      # (repository2-3.xml) and were confirmed against the downloaded bytes;
      # bump the version and all three digests together.
      - name: Fetch the ADB tools
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          PT_VERSION="r37.0.1"
          case "${{ runner.os }}" in
            Windows) ARCHIVE=win
                     SHA256=45f4d63113e895ebde0c90f194099a4676b6ac653bd28d54314a9e022bbc1a99 ;;
            Linux)   ARCHIVE=linux
                     SHA256=d230f13842f60f782a8645f9c813f8f845bf36089ea7289f28c48f17979313f1 ;;
            macOS)   ARCHIVE=darwin
                     SHA256=ee39ad5967e95c2a07f04dbcbde96b1a0c916ba376096db5d2f498b7727a5d1d ;;
            *) echo "::error::unknown runner ${{ runner.os }}"; exit 1 ;;
          esac
          URL="https://dl.google.com/android/repository/platform-tools_${PT_VERSION}-${ARCHIVE}.zip"
          echo "downloading $URL"
          curl -fsSL --retry 3 --retry-delay 5 -o platform-tools.zip "$URL"
          # Hashed with Python rather than shasum/sha256sum: the three
          # runners do not agree on which of those exists, and Python is
          # already set up on every one of them.
          ACTUAL="$(python -c "import hashlib; print(hashlib.sha256(open('platform-tools.zip','rb').read()).hexdigest())")"
          if [ "$ACTUAL" != "$SHA256" ]; then
            echo "::error::platform-tools sha256 mismatch"
            echo "  expected: $SHA256"
            echo "  actual  : $ACTUAL"
            exit 1
          fi
          echo "sha256 verified: $ACTUAL"
          python -c "import zipfile; zipfile.ZipFile('platform-tools.zip').extractall('.')"
          rm -f platform-tools.zip
          # The executable bit does not survive a ZIP on POSIX. The panel
          # restores it at run time too (binary.py:_make_runnable), but a
          # build that can run the tool is a build that can be checked here.
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x platform-tools/adb
            ./platform-tools/adb version
          else
            ./platform-tools/adb.exe version
          fi

      - name: Clean PyInstaller build
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        env:
          # The spec stamps both into the package: the edition, and the key
          # material for admin mode. What is stamped is a ONE-WAY DIGEST of
          # the secret and never the secret itself — no package needs it,
          # and none may carry it (see panel/adminkey/secret.py). The value
          # is passed in the environment and never on a command line, so it
          # cannot end up in a process listing or a log.
          DAP_ADMIN_KEY_SECRET: ${{ secrets.DAP_ADMIN_KEY_SECRET }}
          # A fork has no secrets and still builds; the package simply cannot
          # open admin mode, and says so. But the hatch opens ONLY when there
          # really is no secret: written as a constant "1", it also silenced
          # the spec's refusal on real releases, so a release cut while the
          # secret was missing from the repository configuration built green
          # and shipped unable to recognise any service key. A run on a tag
          # ref never gets this far without one — see "A tagged build must
          # carry the key secret" at the top of the job.
          DAP_ALLOW_NO_ADMIN_KEY: ${{ secrets.DAP_ADMIN_KEY_SECRET != '' && '0' || '1' }}
          # WHICH PACKAGE IS BEING BUILT. The spec refuses to guess — it
          # stops and names the editions rather than stamping whichever one
          # the source tree happens to hold — so the answer has to be handed
          # over here. Missing, every platform failed at this step with a
          # message about a variable nobody had set.
          DAP_EDITION: ${{ inputs.edition }}
        run: |
          set -euo pipefail
          rm -rf build dist
          python -m PyInstaller --noconfirm --clean "${{ inputs.spec }}"
          ls -la dist

      # ── self-test on the packaged application ───────────────────────────
      # The app is built with console=False (GUI subsystem). Calling such an
      # exe from PowerShell as "& $exe" does NOT make the shell wait and
      # leaves $LASTEXITCODE unset. Start-Process -Wait -PassThru both waits
      # and returns the real exit code; the output is redirected to a file
      # and printed to the log.
      - name: Self-test (packaged) — Windows
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $exe = "dist/${{ env.APP_NAME }}/${{ env.APP_NAME }}.exe"
          if (-not (Test-Path $exe)) { throw "exe not found: $exe" }
          $fullPath = (Resolve-Path $exe).Path
          # In the working directory, not RUNNER_TEMP: the cross-platform
          # "Verify the packaged self-test output" step below reads it back.
          $outFile = Join-Path (Get-Location) "selftest-output.txt"
          $errFile = Join-Path $env:RUNNER_TEMP "selftest-err.txt"

          $proc = Start-Process -FilePath $fullPath -ArgumentList '--self-test' `
                    -PassThru -NoNewWindow `
                    -RedirectStandardOutput $outFile -RedirectStandardError $errFile

          # WAITED FOR WITH A DEADLINE, not with -Wait. The application is a
          # GUI-subsystem binary: one that never exits — a modal error box
          # nobody can click, a background thread that will not end — holds
          # -Wait until the job's own timeout, and because the output is in a
          # file rather than on the console the log says nothing at all for
          # forty-five minutes. A build that hung this way is what put this
          # deadline here; two minutes is forty times what a passing run
          # takes.
          if (-not $proc.WaitForExit(120000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $outFile) { Get-Content $outFile }
            if (Test-Path $errFile) { Get-Content $errFile }
            throw "the packaged self-test did not finish within 120 s"
          }

          if (Test-Path $outFile) { Get-Content $outFile }
          if ((Test-Path $errFile) -and (Get-Item $errFile).Length -gt 0) {
            Write-Host "--- stderr ---"
            Get-Content $errFile
          }

          if ($null -eq $proc.ExitCode) { throw "could not read the exit code" }
          if ($proc.ExitCode -ne 0) { throw "self-test failed ($($proc.ExitCode))" }
          Write-Host "packaged self-test passed (exit code 0)"

      - name: Self-test (packaged) — macOS
        timeout-minutes: 5
        if: runner.os == 'macOS'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          BIN="dist/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}"
          test -x "$BIN" || { echo "executable not found: $BIN"; exit 1; }
          "$BIN" --self-test | tee selftest-output.txt

      - name: Self-test (packaged) — Linux
        timeout-minutes: 5
        if: runner.os == 'Linux'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          "./dist/${{ env.APP_NAME }}/${{ env.APP_NAME }}" --self-test \
            | tee selftest-output.txt

      # ── what the packaged binary reported, verified on EVERY platform ──
      # These greps ran on Linux alone for a while, so a wrong stamp or a
      # leaked secret in the Windows or macOS package would have shipped
      # unverified — four packages come out of four separate PyInstaller
      # runs, and the stamping path is exactly the kind of thing that works
      # on one platform and not another. The patterns are ASCII-only and
      # unanchored on purpose: the Windows output file arrives
      # CRLF-terminated, and the em-dash in "Admin key material — digest
      # only" may not survive the PowerShell redirect encoding.
      - name: Verify the packaged self-test output
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        env:
          # WHETHER there is a secret, never the secret. Interpolating the
          # value into a shell test would put it on a command line, which is
          # readable in a process listing on the runner and would appear in
          # any `set -x` trace — masking in the log does not undo either.
          HAS_KEY_SECRET: ${{ secrets.DAP_ADMIN_KEY_SECRET != '' }}
        run: |
          set -euo pipefail
          test -s selftest-output.txt || {
            echo "::error::selftest-output.txt is missing or empty"
            exit 1; }

          # THE PACKAGE MUST BE WHAT IT SAYS IT IS.
          grep -q "edition: $EDITION " selftest-output.txt || {
            echo "::error::the package does not report itself as '$EDITION'"
            exit 1; }

          # AND IT MUST NOT CARRY THE SECRET. Every package is a
          # customer's; each is stamped with a one-way digest, and if the
          # secret itself ever leaked into one, that customer could mint
          # service keys for every other customer's package. Read back off
          # the built artifact rather than trusted from the build script —
          # and the secret is never put on a shell command line to do it.
          if [ "$HAS_KEY_SECRET" != "true" ]; then
            echo "No build secret configured; key material check skipped."
          else
            grep -q "Admin key material" selftest-output.txt || {
              echo "::error::the self-test did not report its key material"
              exit 1; }
            grep -q "digest only" selftest-output.txt || {
              echo "::error::a package must carry the digest ONLY"
              exit 1; }

            # AND THE OTHER CUSTOMERS' PROJECTS MUST REALLY BE SEALED IN.
            # The spec now fails a secret-holding build whose sealing broke
            # (dabp.spec), and this is the same fact read back off the
            # artifact: every edition carries the other projects encrypted,
            # so a package built with the secret and holding no .sealed
            # files is a broken package, not a lean one.
            COUNT="$(find dist -name '*.sealed' | wc -l | tr -d ' ')"
            if [ "$COUNT" -eq 0 ]; then
              echo "::error::the package holds no .sealed project files"
              exit 1
            fi
            echo "sealed project files in the package: $COUNT"
          fi
          echo "Edition and key material verified on the built package."

      # ── packaging per platform ──────────────────────────────────────────
      - name: Package — Windows (onedir ZIP)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $zipName = "${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist/${{ env.APP_NAME }}" -DestinationPath "release/$zipName" -Force
          Get-Item "release/$zipName" | Select-Object Name, Length

      # ── Windows installer (Inno Setup) ──────────────────────────────────
      # Windows marks files extracted from a ZIP as "downloaded from the
      # internet" and .NET then rejects Python.Runtime.dll with 0x80131515.
      # Files placed by an installer never get that mark.
      - name: Download the WebView2 bootstrapper
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $destDir = "packaging/windows/redist"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $file = Join-Path $destDir "MicrosoftEdgeWebview2Setup.exe"
          # Microsoft's permanent Evergreen Bootstrapper link. DELIBERATELY
          # NOT PINNED, unlike the adb tools: the link's content changes on
          # Microsoft's release schedule, so a sha256 here would break the
          # build on every WebView2 update — and the bootstrapper is a
          # downloader, not the runtime; what it installs is fetched signed
          # from Microsoft at install time either way. The size floor below
          # and the logged digest are the sanity checks that remain.
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile $file -UseBasicParsing
          $bytes = (Get-Item $file).Length
          if ($bytes -lt 100kb) { throw "bootstrapper suspiciously small: $bytes bytes" }
          Write-Host "bootstrapper: $bytes bytes"
          Write-Host "sha256: $((Get-FileHash $file -Algorithm SHA256).Hash)"

      - name: Prepare Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found, installing…"
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          & $iscc /? | Select-Object -First 1
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package — Windows (installer)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          # Every name comes from the edition table, so two editions
          # installed on one machine keep separate folders, separate Start
          # menu entries and — above all — separate AppIds: without that an
          # update to one would land on the other.
          & "$env:ISCC" `
            "/DMyAppVersion=$version" `
            "/DMyAppSlug=${{ env.APP_NAME }}" `
            "/DMyAppName=${{ env.DISPLAY_NAME }}" `
            "/DMyAppId=${{ env.APP_ID }}" `
            "/DSourceDir=..\..\dist\${{ env.APP_NAME }}" `
            "/DOutputDir=..\..\release" `
            "${{ inputs.iss }}".Replace('/', '\')
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

          $setup = "release/${{ env.APP_NAME }}-$version-windows-x64-Setup.exe"
          if (-not (Test-Path $setup)) { throw "installer was not produced: $setup" }
          $bytes = (Get-Item $setup).Length
          if ($bytes -lt 5mb) { throw "installer suspiciously small: $bytes bytes" }
          Write-Host "installer: $setup ($([math]::Round($bytes/1mb,1)) MB)"

      - name: Package — macOS (.app, zipped with ditto)
        if: runner.os == 'macOS'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          ZIP_NAME="${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip"
          mkdir -p release
          # ditto: macOS file attributes and symlinks are preserved
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/${{ env.APP_NAME }}.app" "release/$ZIP_NAME"
          ls -lh "release/$ZIP_NAME"

      - name: Package — Linux (AppImage)
        if: runner.os == 'Linux'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          BASE_NAME="${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          chmod +x packaging/appimage.sh
          ./packaging/appimage.sh "dist/${{ env.APP_NAME }}" "release/$BASE_NAME.AppImage" \
            "${{ steps.version.outputs.version }}" "${{ env.DISPLAY_NAME }}"

      - name: Verify the AppImage
        if: runner.os == 'Linux'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          IMG="$(ls release/*.AppImage)"
          test -s "$IMG" || { echo "AppImage is empty"; exit 1; }
          echo "size: $(du -h "$IMG" | cut -f1)"
          # No FUSE on CI — test it by extracting the contents
          cd "$(mktemp -d)"
          "$OLDPWD/$IMG" --appimage-extract > /dev/null
          test -x squashfs-root/AppRun || { echo "AppRun missing"; exit 1; }
          "./squashfs-root/usr/bin/${{ env.APP_NAME }}" --self-test

      - name: Put the AppImage in a ZIP
        if: runner.os == 'Linux'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          BASE_NAME="${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          cd release
          # A ZIP keeps the execute bit, so no chmod +x is needed after
          # extraction. It also shrinks the artifact/release size.
          zip -9 -q "$BASE_NAME.zip" "$BASE_NAME.AppImage"
          rm -f "$BASE_NAME.AppImage"
          unzip -l "$BASE_NAME.zip"
          ls -lh "$BASE_NAME.zip"

      - name: Verify the outputs
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          APP="${{ env.APP_NAME }}"

          # EXACTLY which files are expected per platform. Looked up one by
          # one so a missing file cannot slip through.
          case "$TARGET" in
            windows-x64)
              EXPECTED=("$APP-$VERSION-windows-x64.zip"
                        "$APP-$VERSION-windows-x64-Setup.exe") ;;
            *)
              EXPECTED=("$APP-$VERSION-$TARGET.zip") ;;
          esac

          echo "contents of release/:"
          ls -lh release/

          MISSING=0
          for f in "${EXPECTED[@]}"; do
            if [ ! -f "release/$f" ]; then
              echo "::error::expected output missing: $f"
              MISSING=1
            elif [ ! -s "release/$f" ]; then
              echo "::error::output is empty: $f"
              MISSING=1
            else
              SIZE=$(du -h "release/$f" | cut -f1)
              echo "  OK  $f ($SIZE)"
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1

          EXTRA=$(( $(find release -type f | wc -l) - ${#EXPECTED[@]} ))
          [ "$EXTRA" -eq 0 ] || echo "::warning::release/ holds $EXTRA extra file(s)"

          # Write to the job summary: visible without opening the log
          {
            echo "### $APP · $TARGET"
            for f in "${EXPECTED[@]}"; do
              echo "- \`$f\` — $(du -h "release/$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-portable-${{ matrix.target }}
          path: ${{ env.APP_DIR }}/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: ${{ inputs.edition }} · GitHub Release
    # Only on a tag push and only if every build passed
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write       # write access only here
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      # ── who this package is ────────────────────────────────────────────
      # Read from the edition table so the workflow holds no second copy of
      # it. `tools/edition_info.py` loads the table directly and needs
      # nothing installed, so this can run before pip.
      - name: Resolve the edition
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          for FIELD in app_name display_name app_id; do
            VALUE="$(python3 tools/edition_info.py \
                       --edition "$EDITION" --field "$FIELD")"
            echo "$(echo "$FIELD" | tr '[:lower:]' '[:upper:]')=$VALUE" \
              >> "$GITHUB_ENV"
            echo "  $FIELD = $VALUE"
          done

      - name: Download the artifacts
        uses: actions/download-artifact@v8
        with:
          path: downloaded
          pattern: ${{ env.APP_NAME }}-portable-*
          merge-multiple: true

      - name: Verify the files
        shell: bash
        run: |
          set -euo pipefail
          # "##" (longest match) — see "Determine the version".
          VERSION="${GITHUB_REF_NAME##*-v}"; VERSION="${VERSION#v}"
          APP="${{ env.APP_NAME }}"
          cd downloaded
          echo "Downloaded files:"
          ls -lh

          # The exact expected list — if one is missing the Release is NOT
          # published.
          EXPECTED=(
            "$APP-$VERSION-windows-x64.zip"
            "$APP-$VERSION-windows-x64-Setup.exe"
            "$APP-$VERSION-linux-x86_64.zip"
            "$APP-$VERSION-macos-arm64.zip"
            "$APP-$VERSION-macos-x64.zip"
          )
          MISSING=0
          for f in "${EXPECTED[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty: $f"
              MISSING=1
            else
              echo "  OK  $f ($(du -h "$f" | cut -f1))"
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd downloaded
          # The glob is spelled out: with "*" the file can end up listing
          # itself.
          sha256sum *.zip *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / update the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRODUCT_NAME: ${{ env.DISPLAY_NAME }}
          PACKAGE_NAME: ${{ env.APP_NAME }}
        run: |
          set -euo pipefail
          NOTES="$GITHUB_WORKSPACE/${{ inputs.app_dir }}/docs/RELEASE_NOTES.md"
          # "##" (longest match) — see "Determine the version".
          VERSION="${TAG##*-v}"; VERSION="${VERSION#v}"
          # THE TITLE IS THE PACKAGE'S OWN NAME, which is also what every
          # file on the page is called: `dabp-gaziray-v1.0.6` over
          # `dabp-gaziray-1.0.6-windows-x64-Setup.exe`. It used to be the
          # product name spelled out in full - forty-eight characters, which
          # is wider than the box GitHub gives a release title in the sidebar
          # and on the repository's own front page. Every entry was clipped,
          # and the half that told the packages apart was the half cut off.
          TITLE="$PACKAGE_NAME-v$VERSION"

          cd downloaded

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists — overwriting the files."
            gh release upload "$TAG" ./* --clobber
            # Refresh the notes too: uploading files alone left the body on
            # the old text from the first creation.
            # --latest=false: the "Latest" badge is per repository. Whichever
            # application published last stole the other's badge, so it is
            # deliberately given to neither.
            gh release edit "$TAG" \
              --draft=false --latest=false \
              --title "$TITLE" --notes-file "$NOTES"

            # Renamed outputs linger: --clobber only replaces a file with the
            # same name, it does not delete the old one. (For example, once
            # the AppImage moved into a ZIP the old .AppImage asset stayed.)
            echo "Cleaning up unexpected old assets…"
            gh release view "$TAG" --json assets --jq '.assets[].name' \
            | while read -r ASSET; do
                if [ ! -e "$ASSET" ]; then
                  echo "  deleting: $ASSET"
                  gh release delete-asset "$TAG" "$ASSET" --yes
                fi
              done
          else
            echo "Creating a new release: $TAG"
            # Pre-release tags (such as 0.9.0-dev) are marked "pre-release".
            EXTRA_ARGS=()
            case "$TAG" in
              *-dev|*-alpha*|*-beta*|*-rc*) EXTRA_ARGS+=(--prerelease) ;;
            esac
            # No --generate-notes: the release body should be RELEASE_NOTES.md
            # only. GitHub's generated commit list made the page long; the
            # version history lives in docs/DEGISIKLIKLER.md.
            gh release create "$TAG" ./* \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --latest=false "${EXTRA_ARGS[@]}"
          fi

      - name: Verify the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRODUCT_NAME: ${{ env.DISPLAY_NAME }}
        run: |
          set -euo pipefail
          # If gh release create quietly did half the job, it is caught here.
          INFO="$(gh release view "$TAG" --json url,isDraft,assets)"
          URL=$(echo "$INFO" | jq -r .url)
          IS_DRAFT=$(echo "$INFO" | jq -r .isDraft)

          echo "Release : $URL"
          echo "Draft   : $IS_DRAFT"
          echo "$INFO" | jq -r '.assets[] | "  \(.name)  \(.size) bytes"'

          if [ "$IS_DRAFT" != "false" ]; then
            echo "::error::the Release was left as a draft"
            exit 1
          fi

          # Are the uploaded files and the release assets exactly the same?
          # Compared name by name rather than by count, so both a surplus and
          # a shortfall are visible.
          ls downloaded | sort > /tmp/expected-assets
          echo "$INFO" | jq -r '.assets[].name' | sort > /tmp/actual-assets
          if ! diff -u /tmp/expected-assets /tmp/actual-assets > /tmp/asset-diff; then
            echo "::error::Release assets do not match the expected list:"
            cat /tmp/asset-diff
            exit 1
          fi
          echo "Release assets match the expected list exactly."

          {
            echo "## $PRODUCT_NAME — Release published"
            echo ""
            echo "$URL"
            echo ""
            echo "$INFO" | jq -r '.assets[] | "- `\(.name)` — \(.size) bytes"'
          } >> "$GITHUB_STEP_SUMMARY"
