name: Build app (reusable)

# Packages one application for four platforms and publishes a Release on a
# tag push. It does not run on its own: the calling workflow says which
# application is being built.
#
#   .github/workflows/build-commissioning-panel.yml   Commissioning Panel
#
# Common steps (build, self-test, packaging, release verification) live here
# in one place; two copies side by side means one gets fixed and the other
# forgotten.
#
# Outputs are UNSIGNED (code signing is out of scope).

on:
  workflow_call:
    inputs:
      app_dir:
        description: Application root (relative to the repository root)
        required: true
        type: string
      app_name:
        description: Output name — exe/dist folder and file names (ASCII)
        required: true
        type: string
      display_name:
        description: >-
          The product name people read: the Release title and the job
          summaries. NOT a path — every file is named after app_name,
          so this one may hold spaces and non-ASCII letters.
        required: true
        type: string
      spec:
        description: PyInstaller spec file (relative to the application root)
        required: true
        type: string
      iss:
        description: Inno Setup script (relative to the application root)
        required: true
        type: string
      tests:
        description: Unit test command — the test step is skipped when empty
        required: false
        type: string
        default: ""
      frontend_bundle_tool:
        description: Single-file desktop UI verifier — skipped when empty
        required: false
        type: string
        default: ""
      python_version:
        required: false
        type: string
        default: "3.12"

permissions:
  contents: read          # read access is enough for the build jobs

env:
  APP_DIR: ${{ inputs.app_dir }}
  APP_NAME: ${{ inputs.app_name }}
  PYTHON_VERSION: ${{ inputs.python_version }}
  # Expected sha256 of appimagetool. While empty nothing is verified and the
  # digest of the downloaded file is written to the log; paste it here after
  # the first run to pin it.
  APPIMAGETOOL_SHA256: ""

jobs:
  build:
    name: ${{ inputs.app_name }} · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            req: requirements-windows.txt
            target: windows-x64
          - name: linux-x86_64
            os: ubuntu-22.04
            req: requirements-linux.txt
            target: linux-x86_64
          - name: macos-arm64
            os: macos-15
            req: requirements-macos.txt
            target: macos-arm64
          - name: macos-x64
            os: macos-15-intel
            req: requirements-macos.txt
            target: macos-x64

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/docs/requirements*.txt

      - name: Deno 2.9.4
        if: inputs.frontend_bundle_tool != ''
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Qt system libraries (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxkbcommon-x11-0 libegl1 libgl1 libnss3 desktop-file-utils

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "docs/${{ matrix.req }}"
          python -m pip install -r docs/requirements-build.txt

      - name: Determine the version
        id: version
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(python app.py --version)"
          echo "Version in source: $SOURCE_VERSION"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            # Tag prefixes: "dap-v0.9.0" or the older form "v1.0.2".
            TAG_VERSION="${GITHUB_REF_NAME#*-v}"
            TAG_VERSION="${TAG_VERSION#v}"
            if [[ "$TAG_VERSION" != "$SOURCE_VERSION" ]]; then
              echo "::error::Tag ($GITHUB_REF_NAME → $TAG_VERSION) does not match APP_VERSION ($SOURCE_VERSION)."
              echo "Update the version in source or push the right tag."
              exit 1
            fi
            VERSION="$TAG_VERSION"
          else
            VERSION="$SOURCE_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version to use: $VERSION"

      - name: Is the socketless desktop UI up to date
        if: inputs.frontend_bundle_tool != ''
        working-directory: ${{ env.APP_DIR }}
        run: python "${{ inputs.frontend_bundle_tool }}" --check

      - name: Unit tests
        if: inputs.tests != ''
        working-directory: ${{ env.APP_DIR }}
        run: ${{ inputs.tests }}

      - name: Self-test (from source)
        working-directory: ${{ env.APP_DIR }}
        run: python app.py --self-test

      - name: Clean PyInstaller build
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          rm -rf build dist
          python -m PyInstaller --noconfirm --clean "${{ inputs.spec }}"
          ls -la dist

      # ── self-test on the packaged application ───────────────────────────
      # The app is built with console=False (GUI subsystem). Calling such an
      # exe from PowerShell as "& $exe" does NOT make the shell wait and
      # leaves $LASTEXITCODE unset. Start-Process -Wait -PassThru both waits
      # and returns the real exit code; the output is redirected to a file
      # and printed to the log.
      - name: Self-test (packaged) — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $exe = "dist/${{ inputs.app_name }}/${{ inputs.app_name }}.exe"
          if (-not (Test-Path $exe)) { throw "exe not found: $exe" }
          $fullPath = (Resolve-Path $exe).Path
          $outFile = Join-Path $env:RUNNER_TEMP "selftest-out.txt"
          $errFile = Join-Path $env:RUNNER_TEMP "selftest-err.txt"

          $proc = Start-Process -FilePath $fullPath -ArgumentList '--self-test' `
                    -Wait -PassThru -NoNewWindow `
                    -RedirectStandardOutput $outFile -RedirectStandardError $errFile

          if (Test-Path $outFile) { Get-Content $outFile }
          if ((Test-Path $errFile) -and (Get-Item $errFile).Length -gt 0) {
            Write-Host "--- stderr ---"
            Get-Content $errFile
          }

          if ($null -eq $proc.ExitCode) { throw "could not read the exit code" }
          if ($proc.ExitCode -ne 0) { throw "self-test failed ($($proc.ExitCode))" }
          Write-Host "packaged self-test passed (exit code 0)"

      - name: Self-test (packaged) — macOS
        if: runner.os == 'macOS'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          BIN="dist/${{ inputs.app_name }}.app/Contents/MacOS/${{ inputs.app_name }}"
          test -x "$BIN" || { echo "executable not found: $BIN"; exit 1; }
          "$BIN" --self-test

      - name: Self-test (packaged) — Linux
        if: runner.os == 'Linux'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          "./dist/${{ inputs.app_name }}/${{ inputs.app_name }}" --self-test

      # ── packaging per platform ──────────────────────────────────────────
      - name: Package — Windows (onedir ZIP)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $zipName = "${{ inputs.app_name }}-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist/${{ inputs.app_name }}" -DestinationPath "release/$zipName" -Force
          Get-Item "release/$zipName" | Select-Object Name, Length

      # ── Windows installer (Inno Setup) ──────────────────────────────────
      # Windows marks files extracted from a ZIP as "downloaded from the
      # internet" and .NET then rejects Python.Runtime.dll with 0x80131515.
      # Files placed by an installer never get that mark.
      - name: Download the WebView2 bootstrapper
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $destDir = "packaging/windows/redist"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $file = Join-Path $destDir "MicrosoftEdgeWebview2Setup.exe"
          # Microsoft's permanent Evergreen Bootstrapper link
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile $file -UseBasicParsing
          $bytes = (Get-Item $file).Length
          if ($bytes -lt 100kb) { throw "bootstrapper suspiciously small: $bytes bytes" }
          Write-Host "bootstrapper: $bytes bytes"
          Write-Host "sha256: $((Get-FileHash $file -Algorithm SHA256).Hash)"

      - name: Prepare Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found, installing…"
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          & $iscc /? | Select-Object -First 1
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package — Windows (installer)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          & "$env:ISCC" `
            "/DMyAppVersion=$version" `
            "/DSourceDir=..\..\dist\${{ inputs.app_name }}" `
            "/DOutputDir=..\..\release" `
            "${{ inputs.iss }}".Replace('/', '\')
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

          $setup = "release/${{ inputs.app_name }}-$version-windows-x64-Setup.exe"
          if (-not (Test-Path $setup)) { throw "installer was not produced: $setup" }
          $bytes = (Get-Item $setup).Length
          if ($bytes -lt 5mb) { throw "installer suspiciously small: $bytes bytes" }
          Write-Host "installer: $setup ($([math]::Round($bytes/1mb,1)) MB)"

      - name: Package — macOS (.app, zipped with ditto)
        if: runner.os == 'macOS'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          ZIP_NAME="${{ inputs.app_name }}-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip"
          mkdir -p release
          # ditto: macOS file attributes and symlinks are preserved
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/${{ inputs.app_name }}.app" "release/$ZIP_NAME"
          ls -lh "release/$ZIP_NAME"

      - name: Package — Linux (AppImage)
        if: runner.os == 'Linux'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          BASE_NAME="${{ inputs.app_name }}-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          chmod +x packaging/appimage.sh
          ./packaging/appimage.sh "dist/${{ inputs.app_name }}" "release/$BASE_NAME.AppImage" \
            "${{ steps.version.outputs.version }}"

      - name: Verify the AppImage
        if: runner.os == 'Linux'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          IMG="$(ls release/*.AppImage)"
          test -s "$IMG" || { echo "AppImage is empty"; exit 1; }
          echo "size: $(du -h "$IMG" | cut -f1)"
          # No FUSE on CI — test it by extracting the contents
          cd "$(mktemp -d)"
          "$OLDPWD/$IMG" --appimage-extract > /dev/null
          test -x squashfs-root/AppRun || { echo "AppRun missing"; exit 1; }
          "./squashfs-root/usr/bin/${{ inputs.app_name }}" --self-test

      - name: Put the AppImage in a ZIP
        if: runner.os == 'Linux'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          BASE_NAME="${{ inputs.app_name }}-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          cd release
          # A ZIP keeps the execute bit, so no chmod +x is needed after
          # extraction. It also shrinks the artifact/release size.
          zip -9 -q "$BASE_NAME.zip" "$BASE_NAME.AppImage"
          rm -f "$BASE_NAME.AppImage"
          unzip -l "$BASE_NAME.zip"
          ls -lh "$BASE_NAME.zip"

      - name: Verify the outputs
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          APP="${{ inputs.app_name }}"

          # EXACTLY which files are expected per platform. Looked up one by
          # one so a missing file cannot slip through.
          case "$TARGET" in
            windows-x64)
              EXPECTED=("$APP-$VERSION-windows-x64.zip"
                        "$APP-$VERSION-windows-x64-Setup.exe") ;;
            *)
              EXPECTED=("$APP-$VERSION-$TARGET.zip") ;;
          esac

          echo "contents of release/:"
          ls -lh release/

          MISSING=0
          for f in "${EXPECTED[@]}"; do
            if [ ! -f "release/$f" ]; then
              echo "::error::expected output missing: $f"
              MISSING=1
            elif [ ! -s "release/$f" ]; then
              echo "::error::output is empty: $f"
              MISSING=1
            else
              SIZE=$(du -h "release/$f" | cut -f1)
              echo "  OK  $f ($SIZE)"
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1

          EXTRA=$(( $(find release -type f | wc -l) - ${#EXPECTED[@]} ))
          [ "$EXTRA" -eq 0 ] || echo "::warning::release/ holds $EXTRA extra file(s)"

          # Write to the job summary: visible without opening the log
          {
            echo "### $APP · $TARGET"
            for f in "${EXPECTED[@]}"; do
              echo "- \`$f\` — $(du -h "release/$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app_name }}-portable-${{ matrix.target }}
          path: ${{ env.APP_DIR }}/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: ${{ inputs.app_name }} · GitHub Release
    # Only on a tag push and only if every build passed
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write       # write access only here
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Download the artifacts
        uses: actions/download-artifact@v8
        with:
          path: downloaded
          pattern: ${{ inputs.app_name }}-portable-*
          merge-multiple: true

      - name: Verify the files
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#*-v}"; VERSION="${VERSION#v}"
          APP="${{ inputs.app_name }}"
          cd downloaded
          echo "Downloaded files:"
          ls -lh

          # The exact expected list — if one is missing the Release is NOT
          # published.
          EXPECTED=(
            "$APP-$VERSION-windows-x64.zip"
            "$APP-$VERSION-windows-x64-Setup.exe"
            "$APP-$VERSION-linux-x86_64.zip"
            "$APP-$VERSION-macos-arm64.zip"
            "$APP-$VERSION-macos-x64.zip"
          )
          MISSING=0
          for f in "${EXPECTED[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty: $f"
              MISSING=1
            else
              echo "  OK  $f ($(du -h "$f" | cut -f1))"
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd downloaded
          # The glob is spelled out: with "*" the file can end up listing
          # itself.
          sha256sum *.zip *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / update the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRODUCT_NAME: ${{ inputs.display_name }}
        run: |
          set -euo pipefail
          NOTES="$GITHUB_WORKSPACE/${{ inputs.app_dir }}/docs/RELEASE_NOTES.md"
          VERSION="${TAG#*-v}"; VERSION="${VERSION#v}"
          # The title carries the product name + version rather than the
          # raw tag, so the Releases list stays readable.
          TITLE="$PRODUCT_NAME v$VERSION"

          cd downloaded

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists — overwriting the files."
            gh release upload "$TAG" ./* --clobber
            # Refresh the notes too: uploading files alone left the body on
            # the old text from the first creation.
            # --latest=false: the "Latest" badge is per repository. Whichever
            # application published last stole the other's badge, so it is
            # deliberately given to neither.
            gh release edit "$TAG" \
              --draft=false --latest=false \
              --title "$TITLE" --notes-file "$NOTES"

            # Renamed outputs linger: --clobber only replaces a file with the
            # same name, it does not delete the old one. (For example, once
            # the AppImage moved into a ZIP the old .AppImage asset stayed.)
            echo "Cleaning up unexpected old assets…"
            gh release view "$TAG" --json assets --jq '.assets[].name' \
            | while read -r ASSET; do
                if [ ! -e "$ASSET" ]; then
                  echo "  deleting: $ASSET"
                  gh release delete-asset "$TAG" "$ASSET" --yes
                fi
              done
          else
            echo "Creating a new release: $TAG"
            # Pre-release tags (such as 0.9.0-dev) are marked "pre-release".
            EXTRA_ARGS=()
            case "$TAG" in
              *-dev|*-alpha*|*-beta*|*-rc*) EXTRA_ARGS+=(--prerelease) ;;
            esac
            # No --generate-notes: the release body should be RELEASE_NOTES.md
            # only. GitHub's generated commit list made the page long; the
            # version history lives in docs/DEGISIKLIKLER.md.
            gh release create "$TAG" ./* \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --latest=false "${EXTRA_ARGS[@]}"
          fi

      - name: Verify the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRODUCT_NAME: ${{ inputs.display_name }}
        run: |
          set -euo pipefail
          # If gh release create quietly did half the job, it is caught here.
          INFO="$(gh release view "$TAG" --json url,isDraft,assets)"
          URL=$(echo "$INFO" | jq -r .url)
          IS_DRAFT=$(echo "$INFO" | jq -r .isDraft)

          echo "Release : $URL"
          echo "Draft   : $IS_DRAFT"
          echo "$INFO" | jq -r '.assets[] | "  \(.name)  \(.size) bytes"'

          if [ "$IS_DRAFT" != "false" ]; then
            echo "::error::the Release was left as a draft"
            exit 1
          fi

          # Are the uploaded files and the release assets exactly the same?
          # Compared name by name rather than by count, so both a surplus and
          # a shortfall are visible.
          ls downloaded | sort > /tmp/expected-assets
          echo "$INFO" | jq -r '.assets[].name' | sort > /tmp/actual-assets
          if ! diff -u /tmp/expected-assets /tmp/actual-assets > /tmp/asset-diff; then
            echo "::error::Release assets do not match the expected list:"
            cat /tmp/asset-diff
            exit 1
          fi
          echo "Release assets match the expected list exactly."

          {
            echo "## $PRODUCT_NAME — Release published"
            echo ""
            echo "$URL"
            echo ""
            echo "$INFO" | jq -r '.assets[] | "- `\(.name)` — \(.size) bytes"'
          } >> "$GITHUB_STEP_SUMMARY"
