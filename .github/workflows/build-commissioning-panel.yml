name: Build · Commissioning Panel

# Packages and Releases for the Commissioning and Maintenance Panel.
#   • workflow_dispatch          -> one chosen edition, artifact only
#   • dap-<edition>-v* tag push  -> that edition, artifact + GitHub Release
#
# ONE PACKAGE PER CUSTOMER. The panel is commissioned by several operators on
# several trains, and each may only see their own project, so the separation
# is made at build time: every edition is packaged on its own and carries
# only its own DeviceMap (see panel/editions/catalogue.py). Cutting a release
# for one customer therefore does not rebuild anyone else's.
#
# Tag examples:
#   dap-vip-yatakli-v0.9.8   dap-gdm-v0.9.8   dap-gaziray-v0.9.8
#   dap-fuar-v0.9.8
#
# The version after "-v" must match APP_VERSION in panel/settings.py.
# Pre-release tags (-dev, -alpha, -beta, -rc) are marked "pre-release".
#
# Why the "dap-" prefix at all: the repository used to hold two applications.
# Unprefixed "v*" and "syp-v*" tags belong to the Switch Management Panel,
# which is built on the `syp` branch.

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Which package to build
        required: true
        type: choice
        options: [vip-yatakli, gdm, gaziray, fuar]
  push:
    tags:
      - "dap-vip-yatakli-v*"
      - "dap-gdm-v*"
      - "dap-gaziray-v*"
      - "dap-fuar-v*"

concurrency:
  group: build-commissioning-panel-${{ github.ref }}
  cancel-in-progress: false      # never cancel a half-finished release build

permissions:
  contents: read

jobs:
  # `with:` is evaluated before any shell runs, so the edition cannot be
  # pulled out of the tag inline. This job does it, and validates the answer
  # against the table rather than trusting the tag's shape.
  resolve:
    name: Which edition
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      edition: ${{ steps.pick.outputs.edition }}
    steps:
      - uses: actions/checkout@v6

      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.edition }}" ]; then
            EDITION="${{ inputs.edition }}"
          else
            # dap-vip-yatakli-v0.9.8 -> vip-yatakli
            EDITION="${GITHUB_REF_NAME#dap-}"
            EDITION="${EDITION%-v*}"
          fi
          # The table is the authority; a tag that names no edition (an old
          # unprefixed "dap-v0.9.7", or a typo) stops here rather than
          # producing a package called after the mistake.
          if ! python3 tools/edition_info.py --list | grep -qx "$EDITION"; then
            echo "::error::'$EDITION' is not an edition. Known:"
            python3 tools/edition_info.py --list
            exit 1
          fi
          echo "edition=$EDITION" >> "$GITHUB_OUTPUT"
          echo "Building the '$EDITION' package."

  # The Release must not publish over a failing credential scan: the
  # DeviceMap the scan inspects is the file dabp.spec compiles into the
  # package. ci.yml runs the same checks (same file), but it runs in
  # PARALLEL with this workflow on a tag push and cannot block it — this
  # `needs:` edge is what does.
  checks:
    uses: ./.github/workflows/repo-checks.yml

  package:
    needs: [resolve, checks]
    uses: ./.github/workflows/build-app.yml
    permissions:
      contents: write            # for the Release step
    # Reusable workflows do NOT inherit secrets. Without this line the build
    # produces a package that cannot recognise a service key, and nothing
    # says so until somebody plugs one into it in the field.
    secrets: inherit
    with:
      app_dir: .
      edition: ${{ needs.resolve.outputs.edition }}
      # The file names and the Release title are read from the edition table
      # inside the build (tools/edition_info.py), so they are written once.
      spec: dabp.spec
      iss: packaging/windows/dabp.iss
      # This panel has unit tests; they run before the package is produced.
      tests: python -m unittest discover -s tests -t .
      frontend_bundle_tool: tools/build_desktop_bundle.py
