name: Build · Devreye Alma Paneli

# Devreye Alma Paneli'nin paketleri ve Release'i.
#   • workflow_dispatch      -> yalnızca Artifact
#   • dap-v* etiketi push'u  -> Artifact + GitHub Release
#
# Etiket öneki neden var: depoda iki uygulama var, her biri kendi
# branch'inde ve kendi sürümüyle. Öneksiz "v*" ve "syp-v*" etiketleri
# Switch Yönetim Paneli'ne ait; o uygulama `syp` branch'inde derlenir.
# Örnek: dap-v0.9.0-dev  →  APP_VERSION 0.9.0-dev ile eşleşmek zorunda.
#
# Ön sürüm etiketleri (-dev, -alpha, -beta, -rc) Release'de "pre-release"
# olarak işaretlenir.

on:
  workflow_dispatch:
  push:
    tags:
      - "dap-v*"

concurrency:
  group: build-devreye-${{ github.ref }}
  cancel-in-progress: false      # yarım kalan release build'i iptal etme

permissions:
  contents: read

jobs:
  paket:
    uses: ./.github/workflows/build-app.yml
    permissions:
      contents: write            # Release adımı için
    with:
      uygulama_dizini: .
      ad: DevreyeAlmaPaneli
      gorunen_ad: Devreye Alma Paneli
      spec: DevreyeAlmaPaneli.spec
      iss: packaging/windows/DevreyeAlmaPaneli.iss
      # Bu panelin birim testleri var; paket üretilmeden önce koşar.
      testler: python -m unittest discover -s tests -t .
