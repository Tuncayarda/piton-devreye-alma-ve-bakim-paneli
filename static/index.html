<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="app.name">Commissioning and Maintenance Panel</title>
<link rel="icon" type="image/png" href="/piton-favicon.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/views.css">
<link rel="stylesheet" href="/css/ip.css">
</head>
<body>

<!-- ═════════════════════════════════════════════════ application ══════ -->
<div id="app">

  <!-- Without this a keyboard user walks the whole top bar and the menu rail
       again on every screen before reaching what they came for. -->
  <a class="skip-link" href="#content" data-i18n="nav.skipToContent">Skip to content</a>

  <header class="top-bar">
    <!-- The main menu is not in the top bar but on the narrow icon rail to
         the left of the content (see js/components/sidebar.js); the top bar
         carries only the project identity and the actions. -->
    <img src="/piton-logo.svg" alt="Piton" class="logo">
    <span class="divider" aria-hidden="true"></span>
    <span class="app-name" data-i18n="app.name">Commissioning and Maintenance Panel</span>

    <!-- Project identity. The train set is changed here without admin mode:
         a field user must be able to switch sets too. On a package that
         carries more than one project (VIP and Yatakli), the project name
         itself opens a menu — see js/app.js. -->
    <div class="project-bar">
      <button type="button" id="project-btn" data-i18n-title="topbar.projectDetails"
              title="Project details">
        <span class="dot" style="background:var(--accent)" aria-hidden="true"></span>
        <span id="project-name">—</span>
      </button>
      <span class="text-dim" aria-hidden="true">/</span>
      <!-- The set number is typed in: numbers like 49 and 112 are in use in
           the field, and no fixed list covered them all. -->
      <label class="set-field" for="set-picker">
        <span class="visually-hidden" data-i18n="topbar.trainSet">Train set</span>
        <span aria-hidden="true">SET</span>
        <input type="number" id="set-picker"
               data-i18n-title="topbar.changeTrainSet" title="Change the train set"
               inputmode="numeric" autocomplete="off" min="1" max="254" step="1">
      </label>
    </div>

    <span class="spacer"></span>

    <!-- A scan already runs by itself every minute; this button pulls that
         round forward (see js/app.js).

         Two labels sit on top of each other: the visible one changes with
         the state, while the width is always set by the longer one. Without
         that, the "Scan now" -> "Scanning…" switch grew the button and
         shifted the top bar. -->
    <button type="button" class="btn" id="refresh-btn"
            data-i18n-title="topbar.runNextScan" title="Run the next scan now">
      <span class="label-live" data-i18n="topbar.scanNow">Scan now</span>
      <span class="label-measure" aria-hidden="true"
            data-i18n="topbar.scanning">Scanning…</span>
    </button>

    <!-- Stops the AUTOMATIC rounds — both of them, not only the minute-long
         discovery: the light round reads over adb every two seconds and is
         the one that actually interrupts a session on a Compartment LCD.
         "Scan now" keeps working while paused, so the operator still decides
         when a device is read.

         Not written to disk (see js/core/store.js): a panel that came back
         paused would show yesterday's readings with nothing saying why.
         While it is paused the status text says so, in place of the usual
         "last scan" line. -->
    <button type="button" class="btn" id="auto-btn" aria-pressed="false"
            data-i18n-title="topbar.pauseHint"
            title="Stop the automatic rounds; devices are then only read when you ask">
      <span class="label-live" data-i18n="topbar.pause">Pause</span>
      <span class="label-measure" aria-hidden="true"
            data-i18n="topbar.paused">Paused</span>
    </button>

    <!-- Devices that need credentials; the badge shows how many. -->
    <button type="button" class="btn btn-icon" id="locked-btn"
            style="position:relative" aria-expanded="false"
            data-i18n-title="topbar.lockedDevices"
            data-i18n-aria="topbar.lockedDevices"
            title="Devices needing credentials"
            aria-label="Devices needing credentials">
      <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="1.5" aria-hidden="true">
        <rect x="4.5" y="8.5" width="11" height="7.5"></rect>
        <path d="M7 8.5V6.6a3 3 0 0 1 6 0v1.9"></path>
      </svg>
      <span class="count-badge" id="locked-count" data-kind="locked" hidden>0</span>
    </button>

    <button type="button" class="btn btn-icon" id="queue-btn"
            style="position:relative" aria-expanded="false"
            data-i18n-title="topbar.jobQueue" data-i18n-aria="topbar.jobQueue"
            title="Job queue" aria-label="Job queue">
      <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <path d="M4 5.5h12M4 10h12M4 14.5h8"></path>
      </svg>
      <span class="count-badge" id="queue-count" data-kind="queue" hidden>0</span>
    </button>

    <!-- The language control sits next to the mode badge: switching is a
         session-level act, not a screen setting. -->
    <div class="language-picker" id="language-picker" role="group"
         data-i18n-aria="topbar.language" aria-label="Language"></div>

    <!-- Nothing here in field mode. There is no role to display: the package
         IS the role, and a badge reading "User" on every screen of every
         customer's copy said nothing. It appears only once admin mode has
         been opened with the service key, where it is worth knowing. -->
    <span class="badge" id="mode-badge" hidden></span>

    <!-- Enters admin mode without going through the launch question again.
         Shown ONLY when there is something to enter it with: the service key
         in the machine, or the build secret in this run. Otherwise it is not
         a button that could be pressed, so it is not a button at all. -->
    <button type="button" class="btn btn-icon" id="enter-admin-btn" hidden
            data-i18n-title="topbar.enterAdmin" data-i18n-aria="topbar.enterAdmin"
            title="Enter admin mode" aria-label="Enter admin mode">
      <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="7" cy="10" r="3"></circle>
        <path d="M10 10h7m-2 0v2.5"></path>
      </svg>
    </button>

    <!-- Leaves admin mode. Not a sign-out: there is no session to end and no
         screen to go back to, only the field view of this same package. It
         comes back with the button above. -->
    <button type="button" class="btn btn-icon" id="leave-admin-btn" hidden
            data-i18n-title="topbar.leaveAdmin" data-i18n-aria="topbar.leaveAdmin"
            title="Leave admin mode" aria-label="Leave admin mode">
      <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <path d="M12 6V4H4v12h8v-2M9 10h8m0 0l-2.5-2.5M17 10l-2.5 2.5"></path>
      </svg>
    </button>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar" data-i18n-aria="nav.mainMenu"
           aria-label="Main menu"></aside>

    <!-- `main`, not a div: it is the one landmark a screen reader can jump
         to, and the skip link above needs somewhere to land. `tabindex="-1"`
         makes it a programmatic focus target — focus moves here on every
         screen change (see js/app.js), which is what tells a keyboard user
         the screen changed at all. -->
    <main class="content" id="content" tabindex="-1">
      <!-- The screens start their headings at h2. This is the document's
           only h1 and it names the open screen; `#route-status` announces
           the same words. Both are written in one place (app.js). -->
      <h1 class="visually-hidden" id="view-title"></h1>
      <div class="view" id="v-overview"></div>
      <div class="view" id="v-devices" hidden></div>
      <div class="view" id="v-ip" hidden></div>
      <div class="view" id="v-network" hidden></div>
      <div class="view" id="v-config" hidden></div>
      <div class="view" id="v-firmware" hidden></div>
      <div class="view" id="v-checklist" hidden></div>
      <div class="view" id="v-history" hidden></div>
      <div class="view" id="v-piscu" hidden></div>
      <div class="view" id="v-mqtt" hidden></div>
      <div class="view" id="v-admin" hidden></div>
    </main>

    <!-- Dims the content while a panel OVERLAYS it (narrow windows only —
         see components.css). Not a control: the panel closes with its own ×
         or with Escape. -->
    <div class="panel-scrim" id="panel-scrim" aria-hidden="true" hidden></div>

    <aside class="side-panel" id="queue-panel" hidden
           data-i18n-aria="topbar.jobQueue" aria-label="Job queue">
      <header>
        <span class="title" data-i18n="topbar.jobQueue">Job queue</span>
        <span class="spacer" style="flex:1"></span>
        <button type="button" class="btn btn-close" data-close="queue"
                data-i18n-aria="queue.close"
                aria-label="Close the job queue">×</button>
      </header>
      <div class="list" id="queue-list"></div>
    </aside>

    <aside class="side-panel" id="locked-panel" hidden
           data-i18n-aria="topbar.lockedDevices"
           aria-label="Devices needing credentials">
      <header>
        <span class="title" data-i18n="locked.title">Needs credentials</span>
        <span class="spacer" style="flex:1"></span>
        <button type="button" class="btn btn-close" data-close="locked"
                data-i18n-aria="locked.close"
                aria-label="Close the credentials panel">×</button>
      </header>
      <div class="list" id="locked-list"></div>
    </aside>
  </div>

  <footer class="footer-bar">
    <span>Piton Technology</span>
    <span class="divider" aria-hidden="true"></span>
    <span class="center" id="status-text" data-i18n="footer.ready">Ready</span>
    <span style="flex:1"></span>
    <span id="footer-version">—</span>
  </footer>
</div>

<div id="detail-slot"></div>
<div id="dialog-slot"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="route-status" class="visually-hidden" role="status"
     aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
