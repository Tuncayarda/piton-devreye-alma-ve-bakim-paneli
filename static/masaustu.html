<script>
(() => {
  const meta = document.querySelector('meta[name="dap-capability"]');
  if (!meta) throw new Error("Masaüstü köprü anahtarı bulunamadı");
  Object.defineProperties(window, {
    __PANEL_TRANSPORT__: {value: "bridge", writable: false, configurable: false},
    __PANEL_CAPABILITY__: {value: meta.content, writable: false, configurable: false},
  });
  document.addEventListener("click", (olay) => {
    const hedef = olay.target;
    if (hedef && hedef.closest && hedef.closest("a[href]")) olay.preventDefault();
  }, true);
  document.addEventListener("submit", (olay) => olay.preventDefault(), true);
  for (const ad of ["dragenter", "dragover", "drop"]) {
    document.addEventListener(ad, (olay) => olay.preventDefault(), true);
  }
})();
</script>

<style>
/* static/css/temel.css */
/* Devreye Alma Paneli — belirteçler, sıfırlama ve iskelet yerleşim.
   Renkler ve tipografi tasarım dosyasından alınmıştır; tek kaynak burası. */

:root {
  /* zemin katmanları */
  --bg: #0e1317;
  --panel: #151d24;
  --panel-2: #111a20;
  --derin: #0b1116;

  /* vurgu ve metin */
  --accent: #4294E0;
  --accent-zayif: rgba(66, 148, 224, .10);
  --accent-cizgi: rgba(66, 148, 224, .45);
  --metin: #e6edf3;
  --acik: #a9bacb;
  --orta: #7f93a6;
  --soluk: #5d7185;
  --cok-soluk: #3d4c5a;
  --marka: #8fa3b5;

  /* durum renkleri — yeşil/turuncu/kırmızı/gri karşılıkları */
  --yesil: #3fb950;
  --turuncu: #d29922;
  --kirmizi: #da3633;
  --gri: #3d4c5a;
  --yesil-zayif: rgba(63, 185, 80, .45);
  --turuncu-zayif: rgba(210, 153, 34, .45);
  --kirmizi-zayif: rgba(218, 54, 51, .45);

  /* çizgiler */
  --cizgi: rgba(214, 235, 255, .14);
  --cizgi-kuvvetli: rgba(214, 235, 255, .22);
  --cizgi-hafif: rgba(214, 235, 255, .07);
  --cizgi-kose: #6b8299;

  /* tipografi — yerelde varsa tasarım yazı tipleri, yoksa sistem */
  --f-baslik: "Barlow Condensed", "Oswald", "Avenir Next Condensed",
              "Roboto Condensed", system-ui, sans-serif;
  --f-govde: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", "Menlo", monospace;

  --ust: 50px;
  /* Alt bar ana menü düğmesini de taşıyor; 30px'de düğme bara sığmıyordu. */
  --alt: 36px;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--metin);
  font-family: var(--f-govde);
  font-size: 14.5px;
  line-height: 1.5;
  overflow: hidden;
}

h1, h2, h3, h4 {
  font-family: var(--f-baslik);
  font-weight: 600;
  letter-spacing: 0;
  text-transform: none;
  line-height: 1.12;
  margin: 0;
}

h2 { font-size: 28px; }
h3 { font-size: 18px; }
h4 { font-size: 15.5px; }

button { font: inherit; color: inherit; }
input, select { font: inherit; }

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
/* İçerik alanı yalnızca programatik odak hedefi (ekran değişince odak
   oraya taşınıyor). Klavyeyle gezilen bir öğe olmadığı için çerçeve
   çizmiyoruz — açılışta koca bir mavi kutu olarak görünüyordu. */
#icerik:focus, #icerik:focus-visible { outline: none; }

::selection { background: rgba(66, 148, 224, .35); }

/* kaydırma çubukları — koyu zeminde açık çubuk göz almıyor */
* {
  scrollbar-width: thin;
  scrollbar-color: #2a3339 transparent;
}
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-thumb { background: #2a3339; }
*::-webkit-scrollbar-track { background: transparent; }

/* ekran okuyucu metni */
.gizli-metin {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

[hidden] { display: none !important; }

/* ───────────────────────────────────────────────── rol seçim ekranı ── */
#rol-ekrani {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: var(--bg);
  background-image:
    linear-gradient(rgba(214, 235, 255, .035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(214, 235, 255, .035) 1px, transparent 1px);
  background-size: 48px 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow-y: auto;
}

.rol-marka {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 34px;
}
.rol-marka img { height: 26px; display: block; }
.rol-marka .ayrac { width: 1px; height: 24px; background: var(--cizgi-kuvvetli); }
.rol-marka span:last-child {
  font-family: var(--f-baslik);
  font-weight: 600; font-size: 14px;
  letter-spacing: .2em; text-transform: uppercase;
  color: var(--marka);
}

.rol-kutu {
  position: relative;
  border: 1px solid var(--cizgi);
  background: var(--panel);
  padding: 34px;
  width: min(640px, 100%);
}

.rol-secenekler {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
}

.rol-btn {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 18px;
  padding: 38px 16px 30px;
  background: transparent;
  border: 1px solid var(--cizgi-kuvvetli);
  color: var(--metin);
  cursor: pointer;
  transition: background .14s ease, border-color .14s ease;
}
.rol-btn:hover { background: rgba(66, 148, 224, .12); border-color: var(--accent); }
.rol-btn span {
  font-family: var(--f-baslik); font-weight: 600; font-size: 20px;
  letter-spacing: 0; text-transform: none;
}

.rol-parola {
  margin-top: 18px; padding-top: 16px;
  border-top: 1px solid var(--cizgi);
  display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap;
}
.rol-parola label { flex: 1 1 220px; display: flex; flex-direction: column; gap: 6px; }

.rol-alt {
  margin-top: 26px;
  display: flex; gap: 22px; flex-wrap: wrap;
  font-family: var(--f-mono); font-size: 10.5px; color: var(--cok-soluk);
}

/* ────────────────────────────────────────────────── uygulama iskeleti ── */
#uygulama {
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.ust-bar {
  display: flex; align-items: center; gap: 10px;
  min-height: var(--ust); flex: none;
  padding: 0 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--cizgi);
}
.ust-bar img.logo { height: 24px; display: block; }
.ust-bar .ayrac { width: 1px; height: 22px; background: var(--cizgi); flex: none; }
.ust-bar .isim {
  font-family: var(--f-baslik); font-weight: 600; font-size: 13px;
  letter-spacing: .18em; text-transform: uppercase; color: var(--marka);
  white-space: nowrap;
}
.ust-bar .esne { flex: 1; }
/* Rol rozeti üst bardaki simge düğmeleriyle aynı boyda durur; küçük
   kutucuk yanındaki 30px'lik düğmelerin arasında havada kalıyordu. */
#rol-rozet {
  height: 30px; padding: 0 11px; flex: none;
  font-size: 11.5px; color: var(--metin);
}

.govde {
  position: relative;
  display: flex;
  flex: 1;
  min-height: 0;
}

/* Ana menü dar bir ikon rayı: 56 piksel. Adlar ikonun üstüne gelince yandaki
   balonda görünür, kalıcı isteyen rayı genişletir (bkz. ekran.css "ikon
   rayı"). Balon rayın dışına taştığı için burada taşma kesilmez. */
.kenar {
  flex: none;
  z-index: 30;
  display: flex; flex-direction: column;
  width: 56px;
  background: var(--panel);
  border-right: 1px solid var(--cizgi);
  transition: width .18s ease;
}
.kenar[data-genis="1"] { width: 214px; }
@media (prefers-reduced-motion: reduce) { .kenar { transition: none; } }

.icerik {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 20px 24px 28px;
}

.alt-bar {
  display: flex; align-items: center; gap: 14px;
  height: var(--alt); flex: none;
  padding: 0 18px;
  background: var(--panel);
  border-top: 1px solid var(--cizgi);
  font-family: var(--f-govde); font-size: 11.5px; color: var(--soluk);
}
.alt-bar .ayrac { width: 1px; height: 14px; background: var(--cizgi); }

/* ── dar ekran ───────────────────────────────────────────────────────── */
@media (max-width: 1080px) {
  /* Uygulamanın adı pencere başlığında zaten görünür. Minimum masaüstü
     genişliğinde bu metni gizlemek, aktif çalışma türünün kırpılmasını
     ve üst bar eylemlerinin taşmasını önler. */
  .ust-bar .isim,
  .ust-bar img.logo + .ayrac { display: none; }
  .icerik { padding: 16px 14px 24px; }
}

@media (max-width: 720px) {
  .ust-bar { flex-wrap: wrap; padding: 6px 10px; min-height: auto; }
  h2 { font-size: 21px; }
}

/* static/css/bilesen.css */
/* Yeniden kullanılan parçalar: düğmeler, kartlar, tablolar, rozetler,
   kilit menüsü, kuyruk paneli ve diyaloglar. */

/* ─────────────────────────────────────────────────────────── düğmeler ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 14px;
  background: transparent;
  border: 1px solid var(--cizgi-kuvvetli);
  border-radius: 0;
  color: var(--metin);
  cursor: pointer;
  font-family: var(--f-govde); font-weight: 600; font-size: 13px;
  letter-spacing: 0; text-transform: none;
  white-space: nowrap;
  transition: background .12s ease, border-color .12s ease;
}
.btn:hover:not(:disabled) { background: rgba(214, 235, 255, .06); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn-birincil {
  background: var(--accent); border-color: var(--accent); color: var(--derin);
}
.btn-birincil:hover:not(:disabled) { background: #59a3e8; }

.btn-tehlike { border-color: var(--kirmizi-zayif); color: #e05c59; }
.btn-tehlike:hover:not(:disabled) { background: rgba(218, 54, 51, .12); }

.btn-kucuk { padding: 5px 11px; font-size: 12px; }

/* Sabit genişlikli düğme: iki etiket aynı ızgara hücresinde üst üste
   durur, hücre genişliğini uzun olan verir. Piksel değeri yazmıyoruz —
   yazı tipi yerelde yoksa yedeğe düşüyor ve sabit genişlik tutmuyor. */
#guncelle-btn { display: inline-grid; place-items: center; }
#guncelle-btn > span { grid-area: 1 / 1; }
#guncelle-btn .etiket-olcu { visibility: hidden; }

.btn-simge {
  width: 30px; height: 30px; padding: 0; flex: none;
  border-color: var(--cizgi); color: var(--orta);
}
.btn-simge:hover:not(:disabled) { color: var(--metin); border-color: var(--cizgi-kuvvetli); }
.btn-simge[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

.btn-x {
  width: 24px; height: 24px; padding: 0; flex: none;
  border-color: var(--cizgi); color: var(--orta);
  font-family: var(--f-govde); font-size: 13px; letter-spacing: 0;
}

/* ────────────────────────────────────────────────────────── alanlar ──── */
.alan {
  width: 100%;
  background: var(--bg);
  color: var(--metin);
  border: 1px solid var(--cizgi-kuvvetli);
  border-radius: 0;
  padding: 8px 10px;
  font-family: var(--f-mono); font-size: 12.5px;
}
.alan:focus-visible { border-color: var(--accent); }
.alan[aria-invalid="true"] { border-color: var(--kirmizi); color: #e05c59; }

.etiket {
  font-family: var(--f-govde); font-size: 11px; font-weight: 600;
  letter-spacing: .01em; color: var(--orta); text-transform: none;
}

/* ─────────────────────────────────────────────────── köşe işaretleri ── */
.kose { position: relative; }
.kose::before, .kose::after {
  content: ""; position: absolute; width: 11px; height: 11px;
  pointer-events: none;
  background:
    linear-gradient(var(--cizgi-kose), var(--cizgi-kose)) center/100% 1px no-repeat,
    linear-gradient(var(--cizgi-kose), var(--cizgi-kose)) center/1px 100% no-repeat;
}
.kose::before { left: -6px; top: -6px; }
.kose::after { right: -6px; bottom: -6px; }

/* ──────────────────────────────────────────────────────────── kartlar ── */
.kart {
  border: 1px solid var(--cizgi);
  background: var(--panel);
  padding: 15px 17px 16px;
}
.kart.saydam { background: transparent; }

.kart-basi {
  display: flex; align-items: baseline; gap: 12px;
  margin-bottom: 13px; flex-wrap: wrap;
}
.kart-basi .esne { flex: 1; }

.sayfa-basi {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; margin-bottom: 18px;
}
.sayfa-basi .eylemler { display: flex; gap: 8px; flex-wrap: wrap; }
/* Başlığın altındaki tek satır: sayfadaki sayıların ne kadar taze olduğu. */
.sayfa-alt {
  margin-top: 5px;
  font-family: var(--f-govde); font-size: 12.5px; color: var(--orta);
}
/* Kontrol listesi kendiliğinden tazeleniyor. Veri bayatladığında bu satır
   dikkat çeker: o görüntüden Excel üretmek yanlış bir belge demek. */
.dog-tazelik[data-bayat="1"] { color: var(--turuncu); }

/* Excel onayında verinin yaşı ve sayaçlar. */
.diyalog .ozet-kutu {
  margin-top: 12px;
  padding: 2px 12px;
  border: 1px solid var(--cizgi-hafif);
  background: var(--derin);
  font-family: var(--f-mono);
  font-size: 11.5px;
}
.diyalog .ozet-kutu .ozet-satir:last-child { border-bottom: 0; }
.ust-etiket {
  font-family: var(--f-govde); font-size: 11px; font-weight: 600;
  letter-spacing: .01em; color: var(--orta); text-transform: none;
}

/* ───────────────────────────────────────────────────── durum renkleri ── */
.nokta {
  width: 7px; height: 7px; flex: none; display: block;
  background: var(--gri);
}
.nokta[data-durum="yesil"], .metin-yesil { }
[data-durum="yesil"] { --durum-renk: var(--yesil); }
[data-durum="turuncu"] { --durum-renk: var(--turuncu); }
[data-durum="kirmizi"] { --durum-renk: var(--kirmizi); }
[data-durum="gri"] { --durum-renk: var(--gri); }
/* Süren iş: yeşil "bitti" demek, bekleyen gri ise sönük kalıyor.
   Çalışan mavi — vurgu rengi zaten "şu an oluyor" anlamını taşıyor. */
[data-durum="mavi"] { --durum-renk: var(--accent); }
.nokta[data-durum] { background: var(--durum-renk); }
.durum-yazi[data-durum] { color: var(--durum-renk); }

.rozet {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 5px;
  border: 1px solid var(--cizgi-kuvvetli);
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .02em;
  color: var(--orta);
}

.mono { font-family: var(--f-mono); }
.soluk { color: var(--soluk); }
.orta { color: var(--orta); }
.acik { color: var(--acik); }

/* ───────────────────────────────────────────────────────── tablolar ──── */
/* Izgara tabanlı tablo: sütun genişlikleri her ekranda ayarlanır,
   dar ekranda satırlar bozulmasın diye kendi içinde yatay kayar. */
.tablo-sar {
  overflow-x: auto;
  margin-top: 14px;
}

.tablo {
  min-width: var(--tablo-min, 900px);
}

.tablo-basi, .tablo-satir {
  display: grid;
  grid-template-columns: var(--tablo-kolon);
  gap: 10px;
  align-items: center;
  padding: 9px 12px;
  border: 1px solid var(--cizgi);
}

.tablo-basi {
  background: var(--panel);
  border-bottom: 0;
  font-family: var(--f-govde); font-size: 11.5px; font-weight: 600;
  letter-spacing: .01em; color: var(--orta); text-transform: none;
  position: sticky; top: 0; z-index: 2;
}

.tablo-satir {
  border-top: 0;
  background: var(--panel-2);
  text-align: left;
  width: 100%;
  font: inherit;
  color: var(--metin);
}
button.tablo-satir { cursor: pointer; }
button.tablo-satir:hover { background: #16212a; }
button.tablo-satir[aria-selected="true"] { background: var(--accent-zayif); }


.tablo-satir .kirp {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  min-width: 0;
}

.tablo-bos {
  border: 1px solid var(--cizgi); border-top: 0;
  background: var(--panel-2);
  padding: 22px 12px; text-align: center;
  font-family: var(--f-govde); font-size: 12.5px; color: var(--orta);
}

/* ────────────────────────────────────────────────────── hedef şeridi ── */
/* Grup şeridi sığmayınca yatay kayar. Sağ kenardaki solma, listenin
   devam ettiğini söyler: kesilen son çip "bitti" gibi duruyor, kullanıcı
   kalan grupları aramıyordu. */
.serit {
  display: flex; align-items: center; gap: 7px;
  flex-wrap: nowrap; overflow-x: auto;
  min-height: 44px; margin-top: 16px;
  padding: 6px 12px;
  border: 1px solid var(--cizgi); background: var(--panel);
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
}
/* Sona gelindiğinde ya da hepsi sığdığında solmaya gerek yok. */
.serit[data-son="1"] { -webkit-mask-image: none; mask-image: none; }
.serit .etiket { flex: none; margin-right: 4px; }

/* İşlem hedefi: tek seçim için yatay çip dizisi yerine kompakt açılır
   liste. Sayılar işlem tablosunda görünür; seçicinin işi yalnız kapsamdır. */
.hedef-secici {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 18px;
}
.hedef-secici .etiket { margin: 0; color: var(--orta); }
.hedef-secici .alan {
  width: auto;
  min-width: 190px;
  min-height: 35px;
  padding-top: 6px;
  padding-bottom: 6px;
}

.cip {
  flex: none;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 10px;
  background: transparent;
  border: 1px solid var(--cizgi-kuvvetli);
  color: var(--acik);
  cursor: pointer;
  font-family: var(--f-govde); font-weight: 600; font-size: 13px;
  letter-spacing: 0; text-transform: none;
  white-space: nowrap;
}
.cip .n { font-family: var(--f-mono); font-size: 10px; color: var(--soluk); }
.cip[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent); color: var(--derin);
}
.cip[aria-pressed="true"] .n { color: rgba(11, 17, 22, .65); }

/* ──────────────────────────────────────────────── ilerleme çubukları ── */
.cubuk { height: 3px; background: rgba(214, 235, 255, .1); }
.cubuk > i { display: block; height: 3px; background: var(--accent); }

/* ────────────────────────────────────────────────── kilit ve kuyruk ─── */
.sayac-rozet {
  position: absolute; top: -7px; right: -7px;
  min-width: 17px; height: 17px; padding: 0 4px;
  display: flex; align-items: center; justify-content: center;
  background: var(--turuncu); color: var(--derin);
  font-family: var(--f-mono); font-size: 10px;
}
.sayac-rozet[data-tur="kuyruk"] { background: var(--accent); }

/* Kuyruğa iş eklendi — panel açılmadığı için haber düğmenin üstünde
   verilir. Üç kısa nabız; sonra düğme normale döner. */
#kuyruk-btn[data-yeni] {
  border-color: var(--accent);
  color: var(--accent);
  animation: kuyruk-nabiz .85s ease-out 3;
}
@keyframes kuyruk-nabiz {
  0%   { box-shadow: 0 0 0 0 rgba(66, 148, 224, .55); }
  70%  { box-shadow: 0 0 0 7px rgba(66, 148, 224, 0); }
  100% { box-shadow: 0 0 0 0 rgba(66, 148, 224, 0); }
}
/* Hareket azaltma isteyen kullanıcıda nabız yerine düz vurgu kalır. */
@media (prefers-reduced-motion: reduce) {
  #kuyruk-btn[data-yeni] { animation: none; background: var(--accent-zayif); }
}

/* Panel, üst bardaki "Güncelle" düğmesinin sol kenarında biter: paneli
   açan düğmeler ile panelin kendisi aynı hizada durunca panel üst bara
   yapışık, tek parça görünüyor. Genişliği app.js ölçer (--yan-panel);
   düğme yazıları değişince (rol rozeti, "Taranıyor…") hiza kaymasın. */
.yan-panel {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: min(92vw, max(300px, var(--yan-panel, 340px)));
  z-index: 30;
  background: var(--panel);
  border-left: 1px solid var(--cizgi-kuvvetli);
  box-shadow: -14px 0 34px rgba(6, 10, 13, .55);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.yan-panel > header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--cizgi);
}
.yan-panel > header .baslik {
  font-family: var(--f-baslik); font-weight: 600; font-size: 16px;
  letter-spacing: 0; text-transform: none;
}
.yan-panel > .liste {
  flex: 1; overflow-y: auto;
  padding: 12px 14px 16px;
  display: flex; flex-direction: column; gap: 10px;
}

/* İş kutusunda renkli kenar şeridi ve ilerleme çubuğu yok: işin durumu
   başlıktaki nokta, yüzde ve sayaçlardan okunuyor; kutunun kenarını da
   boyamak kuyruğu gürültülü gösteriyordu. */
.is-kart {
  border: 1px solid var(--cizgi);
  background: var(--panel-2);
}

/* Çalışan satır ince bir çerçeveyle ayrılır: koşu portları sırayla
   işlediği için bu çerçeve aynı anda tek satırda olur ve "şu an burada"
   demenin en sakin yolu. Satırın üstünden geçen ışık denenmiş, kuyruğu
   kaynatıyordu. Negatif kenar boşluğu, çerçeve yüzünden metnin diğer
   satırlara göre kaymasını engeller. */
.is-satir[data-islem="calisiyor"] {
  border: 1px solid var(--accent-cizgi);
  background: rgba(66, 148, 224, .06);
  padding: 6px 7px;
  margin: 0 -8px;
}
/* Tek hareket noktada: "duruyor mu, sürüyor mu" sorusunu cevaplar. */
.is-satir[data-islem="calisiyor"] .nokta {
  animation: is-nabiz 1.6s ease-in-out infinite;
}

@keyframes is-nabiz {
  0%, 100% { opacity: 1;  box-shadow: 0 0 0 0 rgba(66, 148, 224, .45); }
  50%      { opacity: .45; box-shadow: 0 0 0 3px rgba(66, 148, 224, 0); }
}

@media (prefers-reduced-motion: reduce) {
  .is-satir[data-islem="calisiyor"] .nokta { animation: none; }
}
/* Başlık düğmesi ile durdurma düğmesi tek satırda. `width:100%` vardı ve
   başlık düğmesi bütün genişliği isteyince durdurma düğmesi kartın
   dışına taşıyordu (kuyruk paneli dar). Şimdi başlık esner, durdurma
   düğmesi sabit genişlikte yerinde kalır. */
.is-kart-basi { display: flex; align-items: stretch; min-width: 0; }
.is-kart-basi > .btn-x { align-self: center; margin-right: 9px; flex: none; }
.is-basi {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 11px; flex: 1; min-width: 0;
  background: transparent; border: 0; cursor: pointer; text-align: left;
}
.is-basi .ad {
  display: block;
  font-family: var(--f-baslik); font-weight: 600; font-size: 14.5px;
  letter-spacing: 0; text-transform: none;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.is-basi .alt {
  display: block; margin-top: 3px;
  font-family: var(--f-mono); font-size: 10px;
}
/* Aşama metni ("Port 14 işleniyor (3/6)"). Tek satır: uzun bir aşama
   kartı büyütüp kuyruktaki diğer işleri aşağı itmemeli. */
.is-asama {
  display: block; margin-top: 2px;
  font-family: var(--f-mono); font-size: 9.5px; color: var(--soluk);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.is-sayac {
  display: flex; gap: 7px; flex: none;
  font-family: var(--f-mono); font-size: 10px;
}
/* İnce ilerleme çubuğu — kartın altına yapışık, yalnız süren işte. */
.is-cubuk { height: 2px; background: var(--cizgi-hafif); overflow: hidden; }
.is-cubuk i {
  display: block; height: 100%;
  background: var(--durum-renk, var(--accent));
  transition: width .3s ease;
}
.is-satirlar { padding: 4px 11px 10px; }
.is-satir {
  display: flex; gap: 9px; padding: 7px 0;
  border-bottom: 1px solid var(--cizgi-hafif);
}
.is-satir .nokta { margin-top: 5px; width: 6px; height: 6px; }
/* Sınıf adı ".govde" olamaz: o ad uygulamanın ana gövdesinde kullanılıyor
   ve oradaki display:flex bu satırı yan yana diziyordu. */
.is-satir .is-govde { min-width: 0; flex: 1; }
/* Uzun dosya adı ("..._set1.xlsx") kutusundan taşıp sağdaki durum
   yazısının üstüne biniyordu: alt çizgi ve nokta tarayıcı için satır
   sonu sayılmıyor, o yüzden kırılma açıkça isteniyor. */
.is-satir .ad {
  display: block; font-family: var(--f-mono); font-size: 11px;
  overflow-wrap: anywhere;
}
.is-satir .alt {
  display: block; margin-top: 2px;
  font-family: var(--f-mono); font-size: 9.5px; color: var(--soluk);
  word-break: break-word;
}
.is-satir .durum {
  flex: none; align-self: flex-start;
  font-family: var(--f-baslik); font-weight: 600; font-size: 11px;
  letter-spacing: .08em; text-transform: uppercase;
}

/* ---- satır altındaki adım akordiyonu ----
   Bir portun koşu içinde nerede olduğu ("cihaz aranıyor", "IP yazılıyor")
   tek satırlık nota sığmıyordu: her yeni adım bir öncekini siliyor, port
   hata verince neyin ne zaman olduğu kayboluyordu. Adımı olan satır bir
   düğmeye dönüşür; düğmenin kendi görünümü sıfırlanır, satır görünümü
   .is-satir'dan gelir. */
.is-satir-btn {
  width: 100%; color: inherit; font: inherit;
  background: transparent;
  border-top: 0; border-left: 0; border-right: 0;
  text-align: left; cursor: pointer;
}
.is-satir-btn:hover { background: rgba(255, 255, 255, .02); }
/* Açılabilir olduğunu gösteren tek işaret; açıkken aşağı döner. */
.is-ok {
  flex: none; align-self: center; width: 6px; height: 6px;
  margin-top: -3px;
  border-right: 1.5px solid var(--soluk);
  border-bottom: 1.5px solid var(--soluk);
  transform: rotate(-45deg);
  transition: transform .18s ease;
}
.is-satir-btn[data-acik="true"] .is-ok {
  transform: rotate(45deg); margin-top: -2px;
}
@media (prefers-reduced-motion: reduce) {
  .is-ok { transition: none; }
}

.is-adimlar {
  margin: 0 0 6px 3px; padding: 4px 0 4px 13px;
  border-left: 1px solid var(--cizgi-hafif);
}
.is-adim { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
.is-adim .nokta { width: 5px; height: 5px; margin-top: 0; }
.is-adim-metin {
  flex: 1; min-width: 0;
  font-family: var(--f-mono); font-size: 10px; color: var(--orta);
  overflow-wrap: anywhere;
}
.is-adim[data-islem="uyari"] .is-adim-metin { color: var(--turuncu); }
.is-adim[data-islem="hata"] .is-adim-metin { color: var(--kirmizi); }
.is-adim-saat {
  flex: none; align-self: flex-start;
  font-family: var(--f-mono); font-size: 9px; color: var(--soluk);
}

/* Üretilen dosyanın altındaki iki düğme: aç / klasörde göster. */
.dosya-eylem { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.dosya-btn {
  gap: 5px; padding: 3px 8px;
  font-family: var(--f-mono); font-size: 10px; font-weight: 400;
  letter-spacing: .04em; text-transform: none;
  border-color: var(--cizgi); color: var(--orta);
}
.dosya-btn:hover:not(:disabled) { color: var(--metin); border-color: var(--accent); }
.dosya-btn svg { flex: none; }

.kilit-satir {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 10px;
  width: 100%;
  padding: 10px 11px;
  background: var(--panel-2);
  border: 1px solid var(--turuncu-zayif);
  color: var(--metin);
  cursor: pointer; text-align: left;
}
.kilit-satir:hover { background: #1a232b; }
.kilit-satir .ad {
  font-family: var(--f-mono); font-size: 12px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.kilit-satir .alt {
  grid-column: 1 / -1;
  font-family: var(--f-mono); font-size: 9.5px; color: var(--soluk);
  line-height: 1.5;
}

/* ───────────────────────────────────────────────────────── diyalog ──── */
.perde {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(6, 10, 13, .62);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.perde.sag { align-items: stretch; justify-content: flex-end; padding: 0; }

.diyalog {
  width: min(430px, 100%);
  background: var(--panel);
  border: 1px solid var(--cizgi-kuvvetli);
  padding: 20px 22px 22px;
  display: flex; flex-direction: column; gap: 14px;
  max-height: 92vh; overflow-y: auto;
}
.diyalog h3 { font-size: 19px; }
.diyalog .aciklama { font-size: 12.5px; color: var(--acik); }
.diyalog .eylemler { display: flex; justify-content: flex-end; gap: 8px; }

.uyari {
  padding: 8px 10px;
  border: 1px solid var(--kirmizi-zayif);
  background: rgba(218, 54, 51, .08);
  color: #e8817f;
  font-size: 12px;
}
.bilgi {
  padding: 8px 10px;
  border: 1px solid var(--cizgi);
  border-left: 3px solid var(--accent);
  font-size: 12px; color: var(--acik);
}

.onay {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 11px;
  background: transparent;
  border: 1px solid var(--cizgi-kuvvetli);
  color: var(--metin); cursor: pointer; text-align: left; width: 100%;
}
.onay .kutu {
  width: 12px; height: 12px; flex: none;
  border: 1px solid var(--cizgi-kuvvetli); display: block;
}
.onay[aria-pressed="true"] { border-color: var(--accent); }
.onay[aria-pressed="true"] .kutu { background: var(--accent); border-color: var(--accent); }
.onay span:last-child {
  font-family: var(--f-govde); font-weight: 600; font-size: 13px;
  letter-spacing: 0; text-transform: none;
}

/* ───────────────────────────────────────────────────── cihaz detayı ─── */
.detay {
  width: min(520px, 100%); height: 100%;
  background: var(--panel);
  border-left: 1px solid var(--cizgi-kuvvetli);
  overflow-y: auto;
  padding: 20px 24px 30px;
}
.detay-blok { margin-top: 20px; }
.detay-blok > .basi {
  display: flex; align-items: baseline; gap: 10px;
  padding-bottom: 7px; border-bottom: 1px solid var(--cizgi);
}
.detay-blok > .basi .esne { flex: 1; }
.detay-satir {
  display: grid; grid-template-columns: 1fr 1.1fr; gap: 12px;
  padding: 7px 0; border-bottom: 1px solid rgba(214, 235, 255, .06);
}
.detay-satir .ad { font-size: 12.5px; color: var(--orta); }
.detay-satir .deger {
  font-family: var(--f-mono); font-size: 12px;
  word-break: break-word;
}

/* ──────────────────────────────────────────────────── bildirim şeridi ─ */
#bildirim {
  position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%);
  z-index: 70;
  max-width: min(560px, 92vw);
  padding: 9px 14px;
  border: 1px solid var(--cizgi-kuvvetli);
  background: var(--panel);
  box-shadow: 0 8px 26px rgba(6, 10, 13, .6);
  font-size: 12.5px;
}
#bildirim[data-tur="hata"] { border-color: var(--kirmizi-zayif); color: #e8817f; }
#bildirim[data-tur="basari"] { border-color: var(--yesil-zayif); color: var(--yesil); }

/* ────────────────────────────────────────────── üst bar proje şeridi ─── */
.proje-serit {
  display: flex; align-items: center; gap: 7px; flex: none;
  padding: 3px 9px;
  border: 1px solid var(--cizgi-kuvvetli);
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .04em;
  white-space: nowrap;
}
.proje-serit > button {
  display: flex; align-items: center; gap: 7px;
  padding: 2px 2px;
  background: transparent; border: 0; color: var(--metin);
  cursor: pointer; font: inherit;
}
.proje-serit > button:hover { color: var(--accent); }

.set-secim {
  display: inline-flex; align-items: center; gap: 5px;
  color: var(--metin); cursor: pointer;
}
.set-secim input {
  width: 44px;
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--cizgi);
  border-radius: 0;
  padding: 1px 4px;
  font-family: var(--f-mono); font-size: 11px;
  text-align: center;
}
.set-secim input:hover { border-color: var(--cizgi-kuvvetli); }
.set-secim input:focus-visible { border-color: var(--accent); outline: none; }
.set-secim input:disabled { color: var(--soluk); cursor: not-allowed; }
/* Artırma okları sayıyı daraltıyor; set numarası zaten elle yazılıyor. */
.set-secim input::-webkit-outer-spin-button,
.set-secim input::-webkit-inner-spin-button {
  -webkit-appearance: none; margin: 0;
}
.set-secim input { -moz-appearance: textfield; appearance: textfield; }

/* static/css/ekran.css */
/* Ekrana özgü yerleşimler. Ortak parçalar bilesen.css içindedir. */

/* ───────────────────────────────────────────────────────── ikon rayı ─── */
/* Beş (yönetimde sekiz) alan için 56 piksel. Ad, daralmış rayda ikonun
   yanında balon olarak belirir; ray genişletilince aynı öğe satır içi
   metne döner. Tek işaretleyici: seçili alanın sol kenarındaki şerit. */
.kenar-liste {
  display: flex; flex-direction: column; gap: 2px;
  padding: 10px 0; flex: 1; min-height: 0;
}
.kenar-oge {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  flex: none; height: 40px; padding: 0 12px 0 18px;
  background: transparent;
  border: 0; border-left: 2px solid transparent;
  color: var(--orta); cursor: pointer; text-align: left;
  font-family: var(--f-govde); font-weight: 600; font-size: 13px;
  letter-spacing: 0; text-transform: none;
  transition: background .14s ease, color .14s ease;
}
.kenar-oge:hover { background: rgba(214, 235, 255, .05); color: var(--metin); }
.kenar-oge[aria-current="page"] {
  background: var(--accent-zayif);
  border-left-color: var(--accent);
  color: var(--metin);
  padding-left: 16px;
}
.kenar-ikon { display: inline-flex; flex: none; }
.kenar-oge[aria-current="page"] .kenar-ikon { color: var(--accent); }
.kenar-oge[data-yonetim="1"] .kenar-ikon { opacity: .8; }

/* Saha alanları ile yönetim araçlarını ayıran çizgi. */
.kenar-ayrac {
  height: 1px; margin: 8px 14px;
  background: var(--cizgi); flex: none;
}

/* Genişletilmiş rayda ad satır içi metindir. */
.kenar-ad {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Daralmış rayda aynı öğe, ikonun sağında beliren balon olur. Ray
   dar olduğu için balon rayın dışına taşar — bu yüzden kap taşmayı
   kesmez ve balon üstte kalır. */
.kenar[data-genis="0"] .kenar-ad {
  position: absolute; left: calc(100% + 9px); top: 50%;
  z-index: 40;
  padding: 5px 10px;
  background: var(--panel);
  border: 1px solid var(--cizgi-kuvvetli);
  box-shadow: 0 8px 24px rgba(6, 10, 13, .45);
  color: var(--metin); font-size: 12.5px;
  opacity: 0; pointer-events: none;
  transform: translateY(-50%) translateX(-5px);
  transition: opacity .13s ease, transform .13s ease;
}
.kenar[data-genis="0"] .kenar-oge:hover .kenar-ad,
.kenar[data-genis="0"] .kenar-oge:focus-visible .kenar-ad {
  opacity: 1;
  transform: translateY(-50%) translateX(0);
}

/* Rayı genişletip daraltan düğme en altta: kullanılan bir şey değil,
   bir kez ayarlanan bir tercih. */
.kenar-genislet {
  display: flex; align-items: center; justify-content: center;
  flex: none; height: 34px;
  background: transparent;
  border: 0; border-top: 1px solid var(--cizgi);
  color: var(--soluk); cursor: pointer;
}
.kenar-genislet:hover { color: var(--metin); background: rgba(214, 235, 255, .05); }
.kenar-genislet-ikon {
  display: inline-flex;
  transition: transform .18s ease;
}
.kenar[data-genis="1"] .kenar-genislet-ikon { transform: rotate(180deg); }

@media (prefers-reduced-motion: reduce) {
  .kenar-ad, .kenar-genislet-ikon { transition: none; }
}

/* ────────────────────────────────────────────────────── genel bakış ─── */
.kpi-izgara {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px; margin-top: 20px;
}
/* Kutucuk tıklanabilir: sayının arkasındaki cihaz listesine götürür.
   button olduğu için tarayıcı varsayılanları burada sıfırlanır. */
.kpi {
  position: relative;
  width: 100%;
  display: block;
  border: 1px solid var(--cizgi);
  background: transparent;
  padding: 13px 16px 14px;
  color: inherit; font: inherit; text-align: left;
  cursor: pointer;
}
.kpi:hover { border-color: var(--cizgi-kuvvetli); background: rgba(214, 235, 255, .03); }
.kpi:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
.kpi .ad {
  font-family: var(--f-govde); font-size: 11.5px; font-weight: 600;
  letter-spacing: .01em; color: var(--orta); text-transform: none;
}
.kpi .deger-sar {
  margin-top: 9px; display: flex; align-items: baseline; gap: 7px;
}
.kpi .deger {
  font-family: var(--f-baslik); font-weight: 600; font-size: 32px; line-height: 1;
}
.kpi .birim { font-family: var(--f-mono); font-size: 11px; color: var(--orta); }
.kpi .cubuk { margin-top: 12px; }

.genel-izgara {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  gap: 18px; margin-top: 22px; align-items: start;
}
@media (max-width: 1000px) {
  .genel-izgara { grid-template-columns: 1fr; }
}

.kat-satir {
  width: 100%;
  min-height: 46px;
  display: grid;
  /* Çubuğun üst sınırı var: tek sütuna düşen geniş ekranda şerit sayfayı
     boydan boya geçince satırın sayısı gözden kaçıyordu. */
  grid-template-columns: minmax(0, 1fr) minmax(80px, 320px) 62px;
  align-items: center; gap: 16px;
  padding: 11px 4px;
  background: transparent;
  border: 0; border-bottom: 1px solid rgba(214, 235, 255, .09);
  color: var(--metin); cursor: pointer; text-align: left;
}
.kat-satir:hover { background: rgba(214, 235, 255, .04); }
.kat-satir .ad {
  font-family: var(--f-baslik); font-weight: 600; font-size: 15px;
  letter-spacing: 0; text-transform: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.kat-satir .bar { height: 6px; background: rgba(214, 235, 255, .1); display: block; }
.kat-satir .bar > i { display: block; height: 6px; }
@media (max-width: 620px) {
  .kat-satir { grid-template-columns: 1fr auto; }
  .kat-satir .bar { display: none; }
}

/* Sıradaki adımlar: her satır bir işi ve o işi yapacak düğmeyi taşır. */
.adim-satir {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: start; gap: 10px;
  padding: 11px 0; border-bottom: 1px solid var(--cizgi-hafif);
}
.adim-satir > .nokta { margin-top: 5px; }
.adim-satir .metin { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.adim-satir .ad { font-size: 12.5px; color: var(--acik); line-height: 1.4; }
.adim-satir .not {
  font-family: var(--f-mono); font-size: 10px; color: var(--soluk);
  line-height: 1.5;
}
.adim-dip {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding-top: 11px;
  font-family: var(--f-mono); font-size: 10.5px; color: var(--soluk);
}

.ozet-satir {
  display: grid; grid-template-columns: 1fr auto;
  align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid var(--cizgi-hafif);
}
.ozet-satir .sol { display: flex; align-items: center; gap: 9px; min-width: 0; }
.ozet-satir .sol span:last-child { font-size: 12.5px; color: var(--acik); }
.ozet-satir .deger { font-family: var(--f-mono); font-size: 11.5px; }

/* ────────────────────────────────────────────────────── IP / ön panel ── */
#v-ip { max-width: 1580px; margin: 0 auto; }

/* Başlık ile sağdaki eylem yığını üstten hizalanır. `flex-end` ile başlık
   iki satırlık eylem sütununun altına düşüyor, diğer işlem ekranlarındaki
   başlıkla aynı çizgide durmuyordu. */
.ip-sayfa-basi {
  align-items: flex-start;
  margin-bottom: 0;
  padding-top: 2px;
}

.ip-ust-eylem {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}
.ip-hazirlik {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--orta);
}
.ip-hazirlik i {
  width: 6px; height: 6px;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(66, 148, 224, .09);
}
.ip-hazirlik[data-durum="hazir"] i {
  background: var(--yesil);
  box-shadow: 0 0 0 3px rgba(63, 185, 80, .09);
}
.ip-hazirlik[data-durum="hata"] { color: #e8817f; }
.ip-hazirlik[data-durum="hata"] i {
  background: var(--kirmizi);
  box-shadow: 0 0 0 3px rgba(218, 54, 51, .1);
}
.ip-baslat-btn {
  min-height: 40px;
  padding: 9px 19px;
  box-shadow: 0 8px 22px rgba(6, 10, 13, .24);
}
.ip-bos-durum {
  min-height: 88px;
  margin-top: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: var(--f-mono);
  font-size: 11px;
}
.ip-yukleniyor > i {
  width: 13px; height: 13px;
  border: 1px solid var(--cizgi-kuvvetli);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: ip-don .75s linear infinite;
}
@keyframes ip-don { to { transform: rotate(360deg); } }

/* Solda tek koşu paneli, sağında iki switch'in ön paneli alt alta.
   Sağ sütun panelin genişliği kadardır; koşu paneli kalan yeri alır. */
.ip-izgara {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 480px;
  gap: 24px;
  margin-top: 24px;
  align-items: start;
}
.ip-panel-alani { min-width: 0; }

.ip-bolum-basi {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}
.ip-bolum-baslik {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  min-width: 0;
}
.ip-adim-no {
  width: 32px; height: 32px;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--accent-cizgi);
  background: var(--accent-zayif);
  color: var(--accent);
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .06em;
}
.ip-bolum-basi h3 { margin-top: 1px; }
.ip-bolum-basi p,
.ip-kart-basi p {
  margin: 5px 0 0;
  color: var(--orta);
  font-size: 11.5px;
  line-height: 1.45;
}
.ip-bolum-sayac {
  flex: none;
  padding: 4px 7px;
  border: 1px solid var(--cizgi);
  color: var(--orta);
  font-family: var(--f-mono);
  font-size: 9.5px;
  text-transform: uppercase;
}

/* Ayar kartı üç net katmandan oluşur: hedefler, korumalar ve özet. */
.ip-ayar-kart {
  position: sticky;
  top: 8px;
  min-width: 0;
  padding: 0;
  background:
    linear-gradient(145deg, rgba(66, 148, 224, .035), transparent 42%),
    var(--panel);
}
.ip-kart-basi {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 17px 19px;
  border-bottom: 1px solid var(--cizgi);
  background: rgba(214, 235, 255, .018);
}
.ip-kart-basi h3 { margin-top: 1px; }
.ip-form-bolum,
.ayar-bolum {
  min-width: 0;
  margin: 0;
  border: 0;
}
.ip-port-alani { padding: 18px 19px; }
.ip-alan-baslik {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 7px;
}
.ip-alan-sayac {
  color: var(--accent);
  font-family: var(--f-mono);
  font-size: 9.5px;
}
.ip-ayar-kart .alan {
  min-height: 39px;
  background: var(--derin);
}
.ip-ayar-kart #port-uyari { margin: 7px 0 0; }
.ip-alan-yardim {
  margin: 7px 0 0;
  color: var(--orta);
  font-family: var(--f-mono);
  font-size: 9.5px;
  line-height: 1.5;
}

.ayar-bolum {
  padding: 18px 19px;
  border-top: 1px solid var(--cizgi);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ip-alt-baslik { margin-bottom: 3px; }
.ip-alt-baslik p {
  margin: 5px 0 0;
  color: var(--orta);
  font-size: 11px;
  line-height: 1.45;
}
.ayar-satir {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  min-height: 45px;
  padding: 7px 9px;
  border: 1px solid var(--cizgi-hafif);
  background: rgba(11, 17, 22, .34);
}
.ayar-satir:hover { border-color: var(--cizgi); }
.ayar-satir .etiket {
  margin: 0;
  color: var(--orta);
  line-height: 1.4;
}
.ayar-satir select.alan { width: auto; min-width: 138px; max-width: 180px; }
.ip-kisa-alan { width: 82px; }
.ip-orta-alan { width: 148px; }
.ip-alan-hata {
  margin: -2px 0 2px;
  padding: 0 9px;
  color: #e8817f;
  font-family: var(--f-mono);
  font-size: 9.5px;
  line-height: 1.45;
}

/* Kanıt satırı: bulunduysa sakin, bulunamadıysa dikkat çeker. */
.ip-alan-yardim[data-durum="tamam"] { color: var(--yesil); }
.ip-alan-yardim[data-durum="uyari"] { color: var(--turuncu); }

.ayar-ozet {
  margin: 0;
  padding: 17px 19px 19px;
  border-top: 1px solid var(--cizgi);
  background: rgba(11, 17, 22, .28);
  color: var(--orta);
  font-family: var(--f-mono);
  font-size: 10.5px;
  line-height: 1.55;
}
.ip-ozet-basi {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}
.ip-hazir-rozet {
  border-color: var(--yesil-zayif);
  color: var(--yesil);
}
.ip-bekliyor-rozet { border-color: var(--turuncu-zayif); color: var(--turuncu); }
.ip-hata-rozet { border-color: var(--kirmizi-zayif); color: #e8817f; }
.ip-kosu-hatasi {
  margin: 0 0 8px;
  padding: 7px 8px;
  border-left: 2px solid var(--kirmizi);
  background: rgba(218, 54, 51, .06);
  color: #e8817f;
  font-family: var(--f-govde);
  font-size: 10.5px;
  line-height: 1.45;
}
.ayar-ozet .satir {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 14px;
  padding: 5px 0;
  border-bottom: 1px solid var(--cizgi-hafif);
}
.ayar-ozet .satir:last-child { border-bottom: 0; }
.ayar-ozet .satir.korunan { color: var(--turuncu); }

/* Test aracı: özetin altında kendi şeridinde, koşu düğmesinden uzakta. */
.ip-test-alani {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-top: 12px; padding-top: 12px;
  border-top: 1px solid var(--cizgi);
}
.ip-test-alani .btn {
  padding: 4px 10px;
  font-family: var(--f-mono); font-size: 10px; font-weight: 400;
  letter-spacing: .04em; text-transform: none;
}
.ayar-ozet b {
  max-width: 65%;
  font-weight: 400;
  color: var(--acik);
  text-align: right;
  overflow-wrap: anywhere;
}
.ayar-ozet b.vurgu { color: var(--accent); }
.ayar-ozet b.soluk { color: var(--orta); }

/* Kullanılabilir genişlikte paneller yan yana, dar alanda alt alta akar. */
/* Paneller her zaman alt alta: iki switch yan yana konunca ikisi de
   daralıyor, port haritası da okunmuyordu. */
.panel-yigin {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
}
.ip-panel-bos {
  min-height: 190px;
  padding: 24px;
  border: 1px dashed var(--cizgi-kuvvetli);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.ip-panel-bos p { margin: 6px 0 0; color: var(--orta); font-size: 12px; }

.on-panel {
  min-width: 0;
  /* Sütun genişliği port haritasına göre ayarlı (bkz. .ip-izgara); kart
     onu doldurur. Dar bırakınca harita sıkışıyor, geniş sütunda da 28
     port kutunun ortasında yüzüyordu. */
  width: auto;
  max-width: 100%;
  padding: 0;
  background:
    linear-gradient(180deg, rgba(214, 235, 255, .018), transparent 40%),
    var(--panel);
  transition: border-color .14s ease, background .14s ease, transform .14s ease;
}
/* İki panel görsel olarak eşit durur. Etkin switch'i çerçeve rengi, iç
   şerit ve rozetle ayrıca işaretlemek kartları zayıflatıyordu; koşunun
   hangi switch'te olduğu zaten koşu özetinde ve seçili portların mavi
   işaretlerinde okunuyor. */
.on-panel:hover { border-color: var(--cizgi-kuvvetli); }
.ip-switch-basi {
  min-height: 67px;
  padding: 14px 16px 12px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  border-bottom: 1px solid var(--cizgi-hafif);
}
.ip-switch-kimlik { min-width: 0; }
.ip-switch-ad { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ip-switch-ad i {
  width: 7px; height: 7px;
  flex: none;
  background: var(--cok-soluk);
}
.on-panel[data-aktif="1"] .ip-switch-ad i {
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(66, 148, 224, .1);
}
.ip-switch-ad h4 {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ip-switch-kimlik > .mono {
  display: block;
  margin: 5px 0 0 15px;
  color: var(--orta);
  font-size: 10.5px;
}
.ip-switch-rozetler {
  display: flex;
  justify-content: flex-end;
  gap: 5px;
  flex-wrap: wrap;
}
.ip-kaynak-rozet { color: var(--orta); }
.ip-kaynak-rozet.canli { border-color: var(--yesil-zayif); color: var(--yesil); }

/* Verinin kaç saniye önce okunduğu; 15 sn'yi geçince bayat sayılır. */
.ip-tazelik {
  font-family: var(--f-mono); font-size: 9.5px; color: var(--soluk);
  align-self: center;
}
.ip-tazelik[data-bayat="1"] { color: var(--turuncu); }

/* Ön panellerin otomatik yenilemesi — duraklatılabilir. */
.ip-bolum-eylem { display: flex; align-items: center; gap: 8px; flex: none; }
.ip-yenile-btn {
  padding: 3px 9px;
  font-family: var(--f-mono); font-size: 10px; font-weight: 400;
  letter-spacing: .04em; text-transform: none;
  border-color: var(--cizgi); color: var(--orta);
}
.ip-yenile-btn[aria-pressed="true"] {
  border-color: var(--yesil-zayif); color: var(--yesil);
}
.ip-switch-yonerge {
  margin: 11px 16px 0;
  color: var(--orta);
  font-size: 11px;
  line-height: 1.45;
}
/* Panelin okunamama sebebi ve kimlik uyarısı: kutu değil, tek satır not.
   İki switch'te aynı cümlenin iki kutusu paneli bastırıyordu. */
.ip-panel-not {
  margin: 9px 16px 0;
  padding-left: 9px;
  border-left: 2px solid var(--cizgi-kuvvetli);
  color: var(--orta);
  font-family: var(--f-mono); font-size: 10px; line-height: 1.5;
}
.ip-panel-not.uyari-ton {
  border-left-color: var(--turuncu); color: var(--turuncu);
}
.ip-kimlik-btn {
  padding: 3px 9px;
  font-family: var(--f-mono); font-size: 10px; font-weight: 400;
  letter-spacing: .04em; text-transform: none;
  border-color: var(--turuncu-zayif); color: var(--turuncu);
}
.ip-kimlik-btn:hover:not(:disabled) {
  background: rgba(210, 153, 34, .12); border-color: var(--turuncu);
}

/* Ön panel koyu bir cihaz kasası içinde, fiziksel port sırasını korur. */
.pm-kasa {
  margin: 14px 16px 0;
  padding: 14px 13px 10px;
  border: 1px solid var(--cizgi);
  background: var(--derin);
  box-shadow: inset 0 1px 12px rgba(0, 0, 0, .18);
}
.pm-sar { overflow-x: auto; padding-bottom: 2px; }
/* Izgara içeriği kadar geniştir ve kasanın ortasında durur. Eskiden
   `min-width:100%` ile kasayı boydan boya kaplıyor, portlar 500 piksellik
   kutunun ortasında yüzüyordu. */
.pm-izgara {
  width: max-content;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(var(--pm-sutun, 6), 52px) 12px 52px;
  gap: 4px 3px;
  align-items: center;
}
.pm-ayrac { height: 100%; border-left: 1px dashed var(--cizgi-kuvvetli); }
.pm-bos { min-height: 12px; }

.pm-port {
  min-height: 49px;
  width: 100%;
  padding: 3px 2px 2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--orta);
  cursor: pointer;
  font-family: var(--f-mono);
  font-size: 9.5px;
  transition: border-color .12s ease, background .12s ease, color .12s ease;
}
.pm-port svg { display: block; width: 36px; height: 36px; }
.pm-port .shell { fill: transparent; stroke: rgba(214, 235, 255, .38); stroke-width: 1.3; }
.pm-port .inner { fill: none; stroke: rgba(214, 235, 255, .28); stroke-width: 1; }
.pm-port .cross { fill: none; stroke: rgba(214, 235, 255, .28); stroke-width: .9; }
.pm-port .key { fill: rgba(214, 235, 255, .38); }
.pm-port .pin { fill: rgba(214, 235, 255, .42); }
.pm-port:hover:not(:disabled):not([aria-disabled="true"]) {
  border-color: var(--cizgi-kuvvetli);
  background: rgba(214, 235, 255, .04);
  color: var(--metin);
}
.pm-port:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
.pm-port[aria-disabled="true"] { cursor: not-allowed; }

/* Cihaz tanımlı değil: seçilemez, panelde yeri boş görünmesin diye durur. */
.pm-port.bos { opacity: .38; cursor: not-allowed; }

/* ── konnektörün RENGİ: portun o anki durumu ──
   Ayrım ve renkler Switch Yönetim Paneli ile aynı; aynı switch'e iki
   uygulamadan bakan kişi aynı şeyi görsün. */
.pm-port.feed .shell { stroke: var(--yesil); fill: rgba(63, 185, 80, .13); }
.pm-port.feed .inner, .pm-port.feed .cross { stroke: var(--yesil); }
.pm-port.feed .key, .pm-port.feed .pin { fill: var(--yesil); }

.pm-port.link .shell { stroke: var(--accent); fill: rgba(66, 148, 224, .12); }
.pm-port.link .inner, .pm-port.link .cross { stroke: var(--accent); }
.pm-port.link .key, .pm-port.link .pin { fill: var(--accent); }

.pm-port.off .shell { stroke: rgba(218, 54, 51, .6); fill: rgba(218, 54, 51, .08); }
.pm-port.off .inner, .pm-port.off .cross { stroke: rgba(218, 54, 51, .6); }
.pm-port.off .key { fill: rgba(218, 54, 51, .6); }
.pm-port.off .pin { fill: rgba(224, 92, 89, .55); }

/* Port açık ama PoE kapalı: hat çalışır, yalnız güç yok — pinler kırmızı. */
.pm-port.gucsuz .pin { fill: rgba(224, 92, 89, .88); }

/* ── ÇERÇEVE: portun koşudaki rolü ──
   Renk portun durumunu söylediği için rol çerçeveyle gösterilir; ikisi
   tek renge binince "açık mı, seçili mi" ayırt edilemiyordu. */
.pm-port.sec {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
  background: rgba(66, 148, 224, .06);
  color: var(--accent);
}

/* Bilgisayarın bağlı olduğu port: koşu buraya dokunursa bağlantı kesilir. */
.pm-port.pc {
  border-color: var(--turuncu);
  box-shadow: inset 0 0 0 1px var(--turuncu);
  color: var(--turuncu); cursor: not-allowed;
}

/* İki switch'i birbirine bağlayan port koşu dışında; kesik çerçeve. */
.pm-port.bag {
  border: 1px dashed rgba(214, 235, 255, .62);
  color: var(--acik); cursor: not-allowed;
}

.pm-alt {
  display: flex;
  gap: 10px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--cizgi-hafif);
  color: var(--orta);
  font-family: var(--f-mono);
  font-size: 9px;
}

.pm-ornek {
  display: block;
  width: 9px; height: 9px;
  flex: none;
  border: 1px solid rgba(214, 235, 255, .42);

/* ─────────────────────────────────────────────────── konfigürasyon ── */
/* Ortak ayarlar tam genişlikte, alanlar çok sütunlu; seçili cihazın tablosu

.cfg-izgara {

}
.cfg-grup-kart {
  display: grid;

  gap: 9px 12px;
}

.cfg-grup-kart .ayar-satir { margin: 0; }

/* Devralınan değer: kutuda duruyor ama kullanıcı yazmadı — DeviceMap ya da
   grup değeri. Girilen değerden ayırt edilebilmeli, yoksa kullanıcı kendi

/* Bölüm başlığı: UIC'te 20'yi aşan alan listesi başlıksız okunmuyor. */
.cfg-bolum {
  margin: 16px 0 2px;
  font-family: var(--f-baslik); font-size: 10.5px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; color: var(--orta);
  border-bottom: 1px solid var(--cizgi); padding-bottom: 5px;

.cfg-grup-kart .cfg-bolum:first-of-type { margin-top: 12px; }
.cfg-cihaz-alani { min-width: 0; }
.cfg-cihaz-basi {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px; flex-wrap: wrap;
}

/* Cihazlar seçilmez, listelenir: satıra tıklamak o cihazın ayar

.cfg-cihaz-listesi { display: flex; flex-direction: column; }
.cfg-cihaz-oge {

}

/* Cihaz penceresi: ayarlar ortada açılan diyalogda düzenlenir ve yalnız

}

@media (max-width: 900px) {

}

/* ─────────────────────────────────────────────────── yazılım yükleme ── */
/* İmaj cihaz başına seçiliyor: her satırda kendi yol ve sürüm kutusu var.
   Üstteki toplu alan yalnız kolaylık — değeri satırlara yazılır. */
.fw-toplu { margin-top: 16px; padding: 16px 18px 14px; }
.fw-toplu-basi p {
  margin: 5px 0 0;

}

.fw-toplu-alanlar .etiket { display: block; margin-bottom: 5px; }
.fw-alan-dar { flex: 0 1 150px; }

/* Satırdaki dosya hücresi: ad + seç/kaldır. Ad kırpılır, tam yol ipucu
   metninde durur — yol satıra sığmıyor ve elle yazılmıyor. */

.fw-durum { font-size: 11.5px; color: var(--orta); }
/* Dosyası seçilmiş satır soldaki şeritten okunur; "hangisi hazır"

.fw-satir[data-secili="1"] { box-shadow: inset 3px 0 0 var(--accent); }

}
.fw-onay-liste .satir {

}
.fw-onay-liste .satir b { color: var(--accent); font-weight: 500; }

/* ────────────────────────────────────────────────── kontrol listesi ─── */
/* Şablonun bütün sütunları yan yana durur; tablo kendi içinde yatay
   kayar, sayfa gövdesi kaymaz. */
.na-hucre {
  /* İçi boş gri kutucuk: "bu cihaz türünde kullanılmıyor". Metin
     yazılmıyor, anlamı zemin taşıyor (bkz. lejant). */
  background: #2a3339;
  height: 14px;
  align-self: center;
  display: block;
}

/* Satırın durumu solundaki şeritten de okunur. Kenarlık yerine iç gölge:
   çerçeve kalınlaşmadığı için başlık satırıyla hizası kaymıyor. */
#v-dog .tablo-satir[data-durum] {

}

/* ───────────────────────────────────────── ortak yerel gezinme ────── */
/* Ana menü bağlamı seçer; bu sekmeler yalnız açık alanın görünümünü
   değiştirir. Alt çizgi, adım sırası izlenimi oluşturmadan seçimi gösterir. */
.yerel-sekmeler,
.islem-sekme-listesi {
  display: flex;
  align-items: center;
  gap: 22px;
  min-width: 0;
  overflow-x: auto;
  border-bottom: 1px solid var(--cizgi);
}
.yerel-sekmeler { margin: 4px 0 16px; }
.islem-sekmeleri { margin: 2px 0 18px; }
.yerel-sekme,
.islem-sekmesi {
  position: relative;
  flex: none;
  min-height: 39px;
  padding: 7px 1px 9px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--orta);
  cursor: pointer;
  font-family: var(--f-govde);
  font-size: 13.5px;
  font-weight: 600;

.islem-sekmesi[data-aktif="1"] {

/* Sekme geçişi: yeni ekran tek karede yer değiştirmesin. Başlık ve sekme
   şeridi aynı yerde durduğu için geçiş bu olmadan fark edilmiyordu.
   Animasyon her ekran değişiminde app.js tarafından baştan tetiklenir. */
