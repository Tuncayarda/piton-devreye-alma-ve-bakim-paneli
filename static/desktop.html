.setting-summary .row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 14px;
  padding: 5px 0;
  border-bottom: 1px solid var(--line-soft);
}
.setting-summary .row:last-child { border-bottom: 0; }
.setting-summary .row.protected { color: var(--auth); }

.setting-summary b {
  max-width: 65%;
  font-weight: 400;
  color: var(--text-bright);
  text-align: right;
  overflow-wrap: anywhere;
}
.setting-summary b.accent-text { color: var(--accent); }

/* Panels sit side by side where there is room and stack when there is not. */
/* The panels always stack: putting two switches side by side narrowed both
   and made the port map unreadable. */
.panel-stack {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
}
.ip-panel-empty {
  min-height: 190px;
  padding: 24px;
  border: 1px dashed var(--line-strong);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.ip-panel-empty p { margin: 6px 0 0; color: var(--text-mid); font-size: var(--fs-base); }

.front-panel {
  min-width: 0;
  /* The column width is tuned to the port map (see .ip-grid) and the card
     fills it. Leaving it narrow squeezed the map, and in a wide column the
     28 ports floated in the middle of the box. */
  width: auto;
  max-width: 100%;
  padding: 0;
  background:
    linear-gradient(180deg, rgba(214, 235, 255, .018), transparent 40%),
    var(--panel);
  transition: border-color .14s ease, background .14s ease, transform .14s ease;
}
/* The two panels look equal. Marking the active switch with a border colour,
   an inner strip and a badge on top of that weakened the cards; which switch
   the run is on is already readable from the run summary and the blue marks
   on the selected ports. */
.front-panel:hover { border-color: var(--line-strong); }
.ip-switch-head {
  min-height: 67px;
  padding: 14px 16px 12px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  border-bottom: 1px solid var(--line-soft);
}
.ip-switch-identity { min-width: 0; }
.ip-switch-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ip-switch-name i {
  width: 7px; height: 7px;
  flex: none;
  background: var(--text-faint);
}
.front-panel[data-active="1"] .ip-switch-name i {
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(66, 148, 224, .1);
}
.ip-switch-name h4 {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ip-switch-identity > .mono {
  display: block;
  margin: 5px 0 0 15px;
  color: var(--text-mid);
  font-size: var(--fs-xs);
}
.ip-switch-badges {
  display: flex;
  justify-content: flex-end;
  gap: 5px;
  flex-wrap: wrap;
}
.ip-source-badge { color: var(--text-mid); }
.ip-source-badge.live { border-color: var(--ok-soft); color: var(--ok); }

/* How many seconds ago the data was read; past 15 s it counts as stale. */
.ip-freshness {
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
  align-self: center;
}
.ip-freshness[data-stale="1"] { color: var(--auth); }

/* The automatic refresh of the front panels — it can be paused. */
.ip-section-action { display: flex; align-items: center; gap: 8px; flex: none; }
.ip-refresh-btn {
  padding: 3px 9px;
  font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 400;
  letter-spacing: .04em; text-transform: none;
  border-color: var(--line); color: var(--text-mid);
}
.ip-refresh-btn[aria-pressed="true"] {
  border-color: var(--ok-soft); color: var(--ok);
}
.ip-switch-guidance {
  margin: 11px 16px 0;
  color: var(--text-mid);
  font-size: var(--fs-sm);
  line-height: 1.45;
}
/* Why the panel could not be read, plus the credentials warning: a one-line
   note, not a box. Two boxes with the same sentence for two switches
   overwhelmed the panel. */
.ip-panel-note {
  margin: 9px 16px 0;
  padding-left: 9px;
  border-left: 2px solid var(--line-strong);
  color: var(--text-mid);
  font-family: var(--font-mono); font-size: var(--fs-xs); line-height: 1.5;
}
.ip-panel-note.warning-tone {
  border-left-color: var(--auth); color: var(--auth);
}
.ip-credential-btn {
  padding: 3px 9px;
  font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 400;
  letter-spacing: .04em; text-transform: none;
  border-color: var(--auth-soft); color: var(--auth);
}
.ip-credential-btn:hover:not(:disabled) {
  background: rgba(210, 153, 34, .12); border-color: var(--auth);
}

/* The plan below is scanned by state badges rather than by fading rows. */
.ip-plan-section {
  margin-top: 28px;
  padding-top: 23px;
  border-top: 1px solid var(--line);
}
.ip-plan-metrics {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-mid);
}
.ip-plan-metrics span {
  padding: 4px 7px;
  border: 1px solid var(--line);
}
.ip-plan-metrics b { color: var(--text); font-weight: 500; }
.ip-plan-table { margin-top: 0; }
.ip-plan-table .table-head { background: #182129; }
.ip-plan-row { min-height: 43px; }
.ip-plan-row[data-actionable="1"] {
  box-shadow: inset 2px 0 0 rgba(66, 148, 224, .58);
}
.ip-plan-row[data-actionable="0"] { background: rgba(17, 26, 32, .62); }
.ip-plan-row[data-actionable="0"] .ip-device-name,
.ip-plan-row[data-actionable="0"] .ip-address { color: var(--text-dim); }
.ip-port-badge {
  width: fit-content;
  padding: 3px 6px;
  border: 1px solid var(--line);
  color: var(--text-bright);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
.ip-device-name { font-size: var(--fs-sm); }
.ip-group-name { font-size: var(--fs-sm); color: var(--text-mid); }
.ip-address { font-size: var(--fs-sm); }
.ip-target-ip { color: var(--accent); }
.ip-state-badge {
  width: fit-content;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 7px;
  border: 1px solid var(--line);
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  white-space: nowrap;
}
.ip-state-badge i { width: 5px; height: 5px; background: var(--text-faint); }
.ip-state-badge.included { border-color: var(--accent-line); color: var(--accent); }
.ip-state-badge.included i { background: var(--accent); }

@media (max-width: 900px) {
  .ip-grid { grid-template-columns: minmax(0, 1fr); }
  .ip-settings-card { position: static; }
  /* When it falls to one column the panel must not stretch the page; the map
     is already drawn for 480px. */
  .ip-panel-area { max-width: 480px; }
}

@media (max-width: 720px) {
  .ip-page-head { align-items: stretch; }
  .ip-action-bar { flex-direction: column; align-items: stretch; }
  .ip-action-bar .ip-start-btn { width: 100%; }
  .ip-readiness { align-self: flex-end; }
  .ip-start-btn { width: 100%; }
  .ip-grid { gap: 20px; margin-top: 20px; }
  .panel-stack { grid-template-columns: minmax(0, 1fr); }
  .ip-section-head { gap: 10px; }
  .ip-section-count { display: none; }
  .ip-plan-section { margin-top: 23px; padding-top: 20px; }
}

@media (max-width: 620px) {
  .ip-card-head,
  .ip-port-area,
  .setting-section,
  .setting-summary { padding-left: 15px; padding-right: 15px; }
  .setting-row { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .setting-row select.field,
  .ip-medium-field { width: 100%; max-width: none; }
  .ip-switch-head { flex-direction: column; }
  .ip-switch-badges { justify-content: flex-start; }
  .ip-plan-section > .ip-section-head { flex-direction: column; }
}

@media (prefers-reduced-motion: reduce) {
  .ip-loading > i { animation: none; }
}

.legend {
  display: flex; gap: 20px; flex-wrap: wrap; margin-top: 12px;
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
}
.legend i {
  display: inline-block; width: 8px; height: 8px; margin-right: 6px;
}

/* ─────────────────────────────────────────────── disclosures ─ */
.ip-collapsible > summary {
  list-style: none;
  cursor: pointer;
}
.ip-collapsible > summary::-webkit-details-marker { display: none; }
.ip-collapsible-summary::after {
  content: "+";
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 23px;
  height: 23px;
  flex: none;
  margin-left: auto;
  border: 1px solid var(--line);
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-md);
  font-weight: 400;
}
.ip-collapsible[open] > .ip-collapsible-summary::after { content: "−"; }
.ip-collapsible-summary:hover::after {
  border-color: var(--accent);
  color: var(--accent);
}
.ip-panel-tools {
  justify-content: flex-end;
  padding: 0 0 10px;
}
/* Factory-IP reset is intentionally separate from the primary assignment
   settings. It is rendered only for a plan whose backend declares support;
   the destructive button sits at the far end of a labelled maintenance card. */
.ip-factory-reset-card {
  margin-top: 18px;
  padding: 18px 19px;
  border-color: rgba(218, 54, 51, .28);
  background:
    linear-gradient(145deg, rgba(218, 54, 51, .035), transparent 45%),
    var(--panel);
}
.ip-factory-reset-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
}
.ip-factory-reset-head p,
.ip-factory-reset-actions p {
  margin: 5px 0 0;
  color: var(--text-mid);
  font-size: var(--fs-sm);
  line-height: 1.5;
}
.ip-factory-reset-address {
  flex: none;
  padding: 5px 8px;
  border: 1px solid rgba(218, 54, 51, .25);
  color: var(--danger-text);
  font-size: var(--fs-sm);
}
.ip-reset-scope {
  min-width: 0;
  margin: 16px 0 0;
  padding: 14px;
  border: 1px solid var(--line-soft);
}
.ip-reset-scope > legend { padding: 0 6px; }
.ip-reset-scope-options {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}
.ip-reset-scope-option {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 38px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  color: var(--text-mid);
  font-size: var(--fs-sm);
  cursor: pointer;
}
.ip-reset-scope-option[data-active="1"] {
  border-color: var(--accent-line);
  color: var(--text-bright);
  background: rgba(66, 148, 224, .055);
}
.ip-reset-scope-option input { accent-color: var(--accent); }
.ip-reset-external-set {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 150px;
  align-items: center;
  gap: 12px;
  margin-top: 11px;
}
.ip-reset-set-field { width: 150px; }
.ip-reset-scope > .ip-field-error { margin-top: 7px; padding-left: 0; }
.ip-factory-reset-actions {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  margin-top: 14px;
}
.ip-factory-reset-actions p { max-width: 700px; }
.ip-factory-reset-actions .btn { flex: none; }

/* The bench flow shares the maintenance card's shape but not its tone: it
   writes one address to one display, so it is ordinary work rather than a
   destructive step. */
.ip-manual-card {
  margin-top: 18px;
  padding: 18px 19px;
}
.ip-manual-card .setting-row { padding-left: 0; padding-right: 0; }
.ip-manual-card > .ip-field-help { margin: 4px 0 0; }

@media (max-width: 620px) {
  .ip-factory-reset-head,
  .ip-factory-reset-actions { align-items: stretch; flex-direction: column; }
  .ip-factory-reset-address { align-self: flex-start; }
  .ip-reset-external-set { grid-template-columns: minmax(0, 1fr); }
  .ip-reset-set-field { width: 100%; }
  .ip-factory-reset-actions .btn { width: 100%; }
}

/* The file behind "install software before assigning". The name can be long
   and the two buttons must stay reachable, so it wraps rather than pushing
   them off the row. */
.ip-preflash-file {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  flex-wrap: wrap;
  min-width: 0;
  font-size: var(--fs-sm);
}
.ip-preflash-file .mono { overflow-wrap: anywhere; }

/* Compartment LCD: every selected port has its own 10.1.1.x source and its own
   server-side APK selection. The compact list makes a missing file visible
   without turning the primary IP card into a second firmware table. */
.ip-lcd-source {
  padding: 10px 11px;
  border: 1px solid var(--line-soft);
  background: rgba(66, 148, 224, .035);
}
.ip-lcd-source .row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
  color: var(--text-mid);
  font-size: var(--fs-sm);
}
.ip-lcd-source .row b {
  color: var(--accent);
  font-size: var(--fs-xs);
  font-weight: 400;
  text-align: right;
}
.ip-apk-block {
  margin-top: 2px;
  padding: 12px;
  border: 1px solid var(--line);
  background: rgba(11, 17, 22, .42);
}
.ip-apk-head,
.ip-apk-controls,
.ip-apk-actions {
  display: flex;
  align-items: center;
  gap: 9px;
}
.ip-apk-head { justify-content: space-between; }
.ip-apk-controls {
  align-items: flex-end;
  justify-content: space-between;
  margin-top: 11px;
}
.ip-apk-version {
  display: grid;
  gap: 5px;
}
.ip-apk-version .label { margin: 0; }
.ip-apk-list {
  display: grid;
  gap: 4px;
  margin-top: 11px;
}
.ip-apk-row {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(115px, 1fr) minmax(145px, 1.3fr) auto;
  align-items: center;
  gap: 10px;
  min-height: 35px;
  padding: 6px 8px;
  border-left: 2px solid var(--line);
  background: rgba(214, 235, 255, .018);
  font-size: var(--fs-xs);
}
.ip-apk-row[data-selected="1"] { border-left-color: var(--ok); }
.ip-apk-row > :last-child {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  white-space: nowrap;
}
.ip-apk-error { margin: 9px 0 0; padding: 0; }

@media (max-width: 620px) {
  .ip-apk-controls { align-items: stretch; flex-direction: column; }
  .ip-apk-version,
  .ip-apk-version .field { width: 100%; }
  .ip-apk-actions { width: 100%; }
  .ip-apk-actions .btn { flex: 1; }
  .ip-apk-row { grid-template-columns: minmax(0, 1fr); gap: 3px; }
  .ip-apk-row > :last-child { white-space: normal; }
  .ip-lcd-source .row { align-items: flex-start; flex-direction: column; gap: 5px; }
  .ip-lcd-source .row b { text-align: left; }
}

/* static/css/switch.css */
/* The switch screen, and the faceplate both switch screens draw.
 *
 * THE .pm-* BLOCK BELOW USED TO LIVE IN ip.css. It moved here when the
 * drawing became shared (see static/js/components/front_panel.js): the IP
 * assignment screen and this one show the front of the same SICOM3028GPT, and
 * one of them owning the stylesheet for both was how the two drifted apart in
 * the first place. ip.css does NOT pull this file in — the desktop bundle
 * inlines every stylesheet anyway (tools/build_desktop_bundle.py), and a
 * cross-file include would only add a second load order to reason about.
 * (It would also not survive the bundler, which refuses one outright.)
 *
 * Colours come from base.css tokens throughout; nothing here hard-codes a
 * palette value that is not already a rgba() tint of one.
 */

/* The front panel sits in a dark chassis and keeps the physical port order. */
.pm-case {
  margin: 14px 16px 0;
  padding: 14px 13px 10px;
  border: 1px solid var(--line);
  background: var(--deep);
  box-shadow: inset 0 1px 12px rgba(0, 0, 0, .18);
}
.pm-wrap { overflow-x: auto; padding-bottom: 2px; }
/* The grid is as wide as its content and sits centred in the chassis. It used
   to fill the chassis edge to edge with `min-width:100%`, leaving the ports
   floating in the middle of a 500-pixel box. */
.pm-grid {
  width: max-content;
  margin: 0 auto;
  display: grid;
  /* The cell and connector sizes come from the caller — see PANEL_SIZES in
     components/front_panel.js. The IP screen stands two faceplates in a
     column and takes the compact one; the Switch screen has the full width
     and takes the large one. */
  grid-template-columns:
    repeat(var(--pm-columns, 6), var(--pm-cell, 52px))
    var(--pm-gap, 12px) var(--pm-cell, 52px);
  gap: 4px 3px;
  align-items: center;
}
/* A FLUID faceplate: the tracks share the chassis instead of huddling in the
   middle of it, and the connector grows with its track rather than staying a
   fixed dot in a widening cell — which is how this looked the first time the
   grid was stretched on its own. `--pm-cell` is the floor, so a narrow window
   scrolls `.pm-wrap` rather than squashing the ports. */
.pm-grid-fluid {
  width: 100%;
  grid-template-columns:
    repeat(var(--pm-columns, 6), minmax(var(--pm-cell, 52px), 1fr))
    var(--pm-gap, 12px) minmax(var(--pm-cell, 52px), 1fr);
}
.pm-grid-fluid .pm-port svg {
  width: 72%;
  height: auto;
  max-width: var(--pm-svg-max, 96px);
}
/* The number under the connector grows with it. At the panel-wide 11px beside
   a connector this size it read as a footnote, which is the wrong way round —
   the number is what the operator is looking for. */
.pm-grid-fluid .pm-port {
  gap: 3px;
  color: var(--text);
  font-size: var(--pm-label, var(--fs-xs));
}

.pm-divider { height: 100%; border-left: 1px dashed var(--line-strong); }
.pm-empty { min-height: 12px; }

.pm-port {
  min-height: 49px;
  width: 100%;
  padding: 3px 2px 2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-mid);
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  transition: border-color .12s ease, background .12s ease, color .12s ease;
}
.pm-port svg {
  display: block;
  width: var(--pm-svg, 36px);
  height: var(--pm-svg, 36px);
}
.pm-port .shell { fill: transparent; stroke: rgba(214, 235, 255, .38); stroke-width: 1.3; }
.pm-port .inner { fill: none; stroke: rgba(214, 235, 255, .28); stroke-width: 1; }
/* The X on an uplink's face. Its rules were lost when this block moved out of
   ip.css and the mark went with them; it is drawn again and it is coloured by
   the port's state like every other part of the connector. */
.pm-port .cross {
  fill: none; stroke: rgba(214, 235, 255, .28); stroke-width: .9;
  stroke-linecap: round;
}
.pm-port .key { fill: rgba(214, 235, 255, .38); }
.pm-port .pin { fill: rgba(214, 235, 255, .42); }
.pm-port:hover:not(:disabled):not([aria-disabled="true"]) {
  border-color: var(--line-strong);
  background: rgba(214, 235, 255, .04);
  color: var(--text);
}
.pm-port:focus-visible { outline-offset: -2px; }
.pm-port[aria-disabled="true"] { cursor: not-allowed; }

/* No device defined: normally not selectable, kept so its place is not a
   hole.  The LCD bench flow marks empty physical PoE ports separately because
   a test display may deliberately be patched into any of them. */
.pm-port.empty { opacity: .38; cursor: not-allowed; }
.pm-port.physical-target { opacity: .72; cursor: pointer; }
.pm-port.physical-target:hover:not([aria-disabled="true"]),
.pm-port.physical-target.selected { opacity: 1; }
.pm-port.physical-target[aria-disabled="true"] { cursor: not-allowed; }

/* ── the connector's COLOUR: the port's present state ──
   The distinction and the colours match the Switch Management Panel, so
   whoever looks at the same switch from two applications sees one thing. */
.pm-port.feed .shell { stroke: var(--ok); fill: rgba(63, 185, 80, .13); }
.pm-port.feed .inner, .pm-port.feed .cross { stroke: var(--ok); }
.pm-port.feed .key, .pm-port.feed .pin { fill: var(--ok); }

.pm-port.link .shell { stroke: var(--accent); fill: rgba(66, 148, 224, .12); }
.pm-port.link .inner, .pm-port.link .cross { stroke: var(--accent); }
.pm-port.link .key, .pm-port.link .pin { fill: var(--accent); }

.pm-port.off .shell { stroke: rgba(218, 54, 51, .6); fill: rgba(218, 54, 51, .08); }
.pm-port.off .inner, .pm-port.off .cross { stroke: rgba(218, 54, 51, .6); }
.pm-port.off .key { fill: rgba(218, 54, 51, .6); }
.pm-port.off .pin { fill: rgba(224, 92, 89, .55); }

/* Port up but PoE off: the line works, there is just no power — red pins. */
.pm-port.unpowered .pin { fill: rgba(224, 92, 89, .88); }

/* ── the BORDER: the port's role in the run ──
   The colour already says what state the port is in, so the role is shown
   with a border; folding both into one colour made "is it up, or is it
   selected?" impossible to tell. */
.pm-port.selected {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
  background: rgba(66, 148, 224, .06);
  color: var(--accent);
}

/* The port the computer is on: if the run touches it, the link is cut. */
.pm-port.pc {
  border-color: var(--auth);
  box-shadow: inset 0 0 0 1px var(--auth);
  color: var(--auth); cursor: not-allowed;
}

/* The port linking the two switches is out of the run; dashed border. */
.pm-port.link-port {
  border: 1px dashed rgba(214, 235, 255, .62);
  color: var(--text-bright); cursor: not-allowed;
}

.pm-footer {
  display: flex;
  gap: 10px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--line-soft);
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}

.pm-sample {
  display: block;
  width: 9px; height: 9px;
  flex: none;
  border: 1px solid rgba(214, 235, 255, .42);
  border-radius: 50%;
}
/* The role samples explain the border and the state samples the colour —
   the same split as on the panel. */
.pm-sample.selected {
  border-radius: 2px; border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.pm-sample.pc {
  border-radius: 2px; border-color: var(--auth);
  box-shadow: inset 0 0 0 1px var(--auth);
}
.pm-sample.link-port {
  border-radius: 2px; border-style: dashed;
  border-color: rgba(214, 235, 255, .62);
}
.pm-sample.feed { border-color: var(--ok); background: rgba(63, 185, 80, .35); }
.pm-sample.link { border-color: var(--accent); background: rgba(66, 148, 224, .3); }
.pm-sample.off { border-color: var(--failed); background: rgba(218, 54, 51, .35); }
.pm-sample.empty { opacity: .38; }
/* Linked, with the power switched off: on the panel the shell keeps its state
   colour and only the PINS go red, so the sample keeps its plain edge and
   carries the red inside it. Same name as the counter above the faceplate. */
.pm-sample.nopwr { box-shadow: inset 0 0 0 2px rgba(224, 92, 89, .88); }


/* The legend sits once below the section, not inside the panel cards. */
.panel-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 7px 13px;
  margin: 12px 0 0;
  padding: 11px 2px 0;
  border-top: 1px solid var(--line);
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
.panel-legend span { display: flex; align-items: center; gap: 6px; }


/* ── the screen ─────────────────────────────────────────────────────── */
.switch-discovery { margin-top: 16px; }
.switch-panel,
.switch-ports,
.switch-network { margin-top: 16px; }

.switch-scan-form {
  display: flex;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
  align-items: flex-end;
}
/* The scan form: a range, a mask and the two buttons, each labelled. They
   wrap together rather than each on its own line — on a narrow window the
   range keeps the room and the mask stays beside it. */
.switch-scan-label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.switch-scan-label:first-child { flex: 1 1 220px; }
.switch-range-field {
  width: 100%;
  min-width: 0;
  font-family: var(--font-mono);
}
.switch-prefix-field {
  width: 92px;
  font-family: var(--font-mono);
}
/* Aligned with the fields' boxes, not with their labels. */
.switch-scan-actions {
  display: flex;
  gap: 8px;
  align-self: flex-end;
}

.switch-row[data-selected="1"] { background: var(--accent-soft); }
.switch-row .btn-small { justify-self: start; }
.switch-row .muted { color: var(--text-dim); }
/* The boxes on the row. Narrower than a form field: they sit in a table
   column, and the whole row has to stay readable beside them. */
.switch-credential {
  width: 100%;
  min-width: 0;
  padding: 3px 7px;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
/* A switch still waiting for an account: the amber the rest of the panel
   uses for "needs credentials", carried on the row rather than on a badge
   crowded in beside the name. */
.switch-row[data-locked="1"] .switch-credential { border-color: var(--auth-soft); }
.switch-row[data-locked="1"] .switch-credential:focus { border-color: var(--auth); }

.switch-identity { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.switch-identity h3 {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.switch-identity .mono { color: var(--text-mid); font-size: var(--fs-xs); }

/* ── the faceplate's counters and selection bar ──────────────────────── */
.stat {
  display: flex;
  align-items: baseline;
  gap: 5px;
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
.stat b { color: var(--text); font-weight: 600; }
.stat.link b { color: var(--accent); }
.stat.feed b { color: var(--ok-text); }
.stat.nopwr b { color: var(--failed-text); }

.switch-selection {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 12px 16px 0;
  padding-top: 10px;
  border-top: 1px solid var(--line-soft);
}
.switch-selection-info {
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
.switch-selection[data-empty="0"] .switch-selection-info { color: var(--accent); }

/* ── the port tables ─────────────────────────────────────────────────── */
.switch-table-block { margin-top: 14px; }
.switch-table-block h4 {
  margin: 0 0 8px;
  color: var(--text-mid);
  font-size: var(--fs-sm);
}
.switch-port-row { cursor: pointer; }
/* The link column: square, then the word beside it. */
.switch-link-cell {
  display: flex; align-items: center; gap: 7px;
  min-width: 0;
}
.switch-port-row[aria-selected="true"] { background: var(--accent-soft); }
.switch-port-row .muted { color: var(--text-dim); }
/* An uplink has no PoE and no wattage. The cells stay, empty, so the four
   columns it does have line up with the same four in the PoE table above. */
.switch-port-row .muted:empty { min-height: 1px; }

/* The port's on/off button is a `.pill` — see components.css. It says what
   the port IS, not what pressing it does; the title attribute carries that. */

select.poe {
  width: 100%;
  min-width: 0;
  padding: 3px 6px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
select.poe.off { border-color: var(--failed-soft); color: var(--failed-text); }


/* ── the switch's own network, and the operations that end a session ─── */
.switch-network-current {
  display: flex;
  gap: 22px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.switch-field { display: flex; flex-direction: column; gap: 3px; }
.switch-field b { color: var(--text); font-size: var(--fs-sm); }

.switch-network-form { margin-top: 14px; }
.switch-network-fields {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.switch-network-fields .field { flex: 1 1 140px; min-width: 0; }
.switch-network-fields .field:first-child { font-family: var(--font-mono); }

.switch-lifecycle {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--line-soft);
}

/* ── the sign-in dialog ──────────────────────────────────────────────── */
.switch-auth-fields {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 12px 0 10px;
}
.switch-auth-fields .field { flex: 1 1 150px; min-width: 0; }



@media (max-width: 900px) {
  .pm-case { margin-left: 12px; margin-right: 12px; }
  .panel-legend { padding-left: 12px; padding-right: 12px; }
  .switch-selection { margin-left: 12px; margin-right: 12px; }
  .switch-network-current { gap: 14px; }
}
</style>
</head>

    <!-- Project identity. The train set is changed here without admin mode:
         a field user must be able to switch sets too. On a package that
         carries more than one project (VIP and Yatakli), the project name
         itself opens a menu — see js/app.js. -->
    <div class="project-bar">
      <button type="button" id="project-btn" data-i18n-title="topbar.projectDetails"
              title="Project details">
        <span class="dot" style="background:var(--accent)" aria-hidden="true"></span>
        <span id="project-name">—</span>
      </button>
      <span class="text-dim" aria-hidden="true">/</span>
      <!-- The set number is typed in: numbers like 49 and 112 are in use in
           the field, and no fixed list covered them all. -->
      <label class="set-field" for="set-picker">
        <span class="visually-hidden" data-i18n="topbar.trainSet">Train set</span>
        <span aria-hidden="true">SET</span>
        <input type="number" id="set-picker"
               data-i18n-title="topbar.changeTrainSet" title="Change the train set"
               inputmode="numeric" autocomplete="off" min="1" max="254" step="1">
      </label>
    </div>

    <span class="spacer"></span>

    <!-- A scan already runs by itself every minute; this button pulls that
         round forward (see js/app.js).

         Two labels sit on top of each other: the visible one changes with
         the state, while the width is always set by the longer one. Without
         that, the "Scan now" -> "Scanning…" switch grew the button and
         shifted the top bar. -->
    <button type="button" class="btn" id="refresh-btn"
            data-i18n-title="topbar.runNextScan" title="Run the next scan now">
      <span class="label-live" data-i18n="topbar.scanNow">Scan now</span>
      <span class="label-measure" aria-hidden="true"
            data-i18n="topbar.scanning">Scanning…</span>
    </button>

    <!-- Stops the AUTOMATIC rounds — both of them, not only the minute-long
         discovery: the light round reads over adb every two seconds and is
         the one that actually interrupts a session on a Compartment LCD.
         "Scan now" keeps working while paused, so the operator still decides
         when a device is read.

         Not written to disk (see js/core/store.js): a panel that came back
         paused would show yesterday's readings with nothing saying why.
         While it is paused the status text says so, in place of the usual

      groupError,
      factoryIp,
      factoryError,
      maskError,
      networkError,
      searchError,
      apkError,
      apkMissing,
      credentialError,
      waiting: panelWait || protectedWait,
      protectedError,

    $("#footer-version").textContent = `v${state.version}`;
    const refreshButton = $("#refresh-btn");
    refreshButton.disabled = !!state.scanRunning;
    $(".label-live", refreshButton).textContent = state.scanRunning ? t("topbar.scanning") : t("topbar.scanNow");
    const autoButton = $("#auto-btn");
    autoButton.setAttribute("aria-pressed", state.autoRefresh ? "false" : "true");
    $(".label-live", autoButton).textContent = state.autoRefresh ? t("topbar.pause") : t("topbar.paused");
    const compact = state.density === "compact";
    $("#app").dataset.density = compact ? "compact" : "comfortable";
    const densityButton = $("#density-btn");
    densityButton.setAttribute("aria-pressed", String(compact));
    $("#density-icon").firstElementChild.setAttribute("d", compact ? "M4 5h12M4 8.3h12M4 11.6h12M4 14.9h12" : "M4 6h12M4 10h12M4 14h12");
    alignSidePanel();
    render2();
    render3();
    render4();
    $("#panel-scrim").hidden = !(state.queueOpen || state.lockedOpen);
    for (const [name, [selector2]] of Object.entries(VIEWS)) {
      $(selector2).hidden = name !== state.view;
    }
    const [selector, renderView] = VIEWS[state.view] || VIEWS.overview;
    const viewChanged = lastView !== state.view;
    if (viewChanged || !(focusInScreenField() || focusInDropdown())) {
      preserveScroll(
        viewChanged ? null : $("#content"),
        () => renderView($(selector))
      );
    }
    if (viewChanged) {
      lastView = state.view;
      $("#content").scrollTop = 0;
      announceView();
      playTransition($(selector));
      onViewEntered(state.view);
    }
  }
  var VIEW_NAME = {
    overview: "nav.overview",
    devices: "nav.devices",
    ip: "tabs.networkAndIp",
    config: "tabs.deviceSettings",
    firmware: "tabs.firmware",
    network: "nav.network",
    adb: "nav.adb",
    switch: "nav.switch",
    checklist: "nav.verification",
    history: "nav.history",
    piscu: "nav.piscu",
    mqtt: "nav.mqtt",
    admin: "nav.project"
  };
  function announceView() {
    const name = t(VIEW_NAME[state.view] || "nav.overview");
    const title = $("#view-title");
    const status = $("#route-status");
    if (title) title.textContent = name;
    if (status) status.textContent = name;
    $("#content").focus();
  }
  var SHORTCUT_VIEWS = [
    "overview",
    "devices",
    "ip",
    "network",
    "adb",
    "switch",
    "checklist",
    "history"
  ];
  function shortcutViews() {
    const allowed = state.views || [];
    if (!allowed.length) return SHORTCUT_VIEWS;
    return SHORTCUT_VIEWS.filter((view) => allowed.includes(view));
  }
  var shortcutKeys = (views) => views.map((_, index) => String(index + 1));
  function shortcut(event) {
    if (isOpen() || event.metaKey || event.ctrlKey || event.altKey) {
      return;
    }
    const active = document.activeElement;
    if (active && active.matches(
      'input, textarea, select, [contenteditable="true"]'
    )) {
      return;
    }
    const views = shortcutViews();
    if (shortcutKeys(views).includes(event.key)) {
      const wanted = views[Number(event.key) - 1];
      if (wanted && wanted !== state.view) patch({ view: wanted });
      event.preventDefault();
      return;
    }
    if (event.key === "/") {
      if (state.view !== "devices") patch({ view: "devices" });
      const box = $("#device-search");
      if (box) box.focus();
      event.preventDefault();
      return;
    }
    if (event.key === "?") {
      shortcutHelp();
      event.preventDefault();
    }
  }
  function shortcutHelp() {
    const rows2 = shortcutViews().map((view, position) => [
      String(position + 1),
      t(VIEW_NAME[view])
    ]);
    rows2.push(["/", t("shortcuts.search")]);
    rows2.push(["Esc", t("shortcuts.close")]);
    show({
      title: t("shortcuts.title"),
      content: el("div", { class: "shortcut-list" }, rows2.map(
        ([key, label]) => el("div", { class: "row" }, [
          el("kbd", { text: key }),
          el("span", { text: label })
        ])
      )),
      actions: [el("button", {
        type: "button",
        class: "btn",
        text: t("detail.close"),
        onclick: () => close()
      })]
    });
  }
  function playTransition(root2) {
    if (!root2) return;
    root2.classList.remove("view-enter");
    void root2.offsetWidth;
    root2.classList.add("view-enter");
  }
  function focusInScreenField() {
    const active = document.activeElement;
    if (!active || !$("#content").contains(active)) return false;
    return active.matches(
      'input:not([type="checkbox"]):not([type="radio"]):not([type="button"]), textarea, [contenteditable="true"]'
    );
  }
  function focusInDropdown() {
    const active = document.activeElement;
    if (!active || !active.matches("select")) return false;
    return [$("#content"), $("#dialog-slot")].some(
      (root2) => root2 && root2.contains(active)
    );
  }
  function onViewEntered(name) {
    if (name === "checklist") refresh9();
    else if (name === "ip") refresh2();
    else if (name === "network") refresh3();
    else if (name === "adb") refresh4();
    else if (name === "switch") refresh6();
    else if (name === "config") refresh7();
    else if (name === "firmware") refresh8();
    else if (name === "piscu") refresh10();
    else if (name === "mqtt") refresh11();
  }
  async function refreshNow() {
    const running2 = writingRunInProgress(state.jobs);
    try {
      const job = await api.scan(state.setNo);
      patch({ openJob: job.id, scanRunning: true });
      if (job.new === false) {
        notify(t("topbar.scanAlreadyQueued"));
      } else {
        flash();
        if (running2) notify(t("topbar.scanQueued"));
      }
      await fetchJobs();
    } catch (e) {
      showError(e.message);
    } finally {
      scanLoop();
    }
  }
  var OVERLAY_PANEL_MAX = 1080;
  function alignSidePanel() {
    const button = $("#refresh-btn");
    const body = $(".body");
    if (!button || !body) return;
    if (globalThis.innerWidth > OVERLAY_PANEL_MAX) return;
    const width = Math.round(
      body.getBoundingClientRect().right - button.getBoundingClientRect().left
    );
    if (width > 0) {
      document.documentElement.style.setProperty("--side-panel", `${width}px`);
    }
  }
  function setUpSetPicker(force = false) {
    const picker2 = $("#set-picker");
    if (!picker2) return;
    const { min, max } = setLimits();
    picker2.min = String(min);
    picker2.max = String(max);
    if ((force || document.activeElement !== picker2) && picker2.value !== String(state.setNo)) {
      picker2.value = String(state.setNo);
    }
    const isLocked = manualScanRunning();
    picker2.disabled = isLocked;
    picker2.title = isLocked ? t("topbar.setLockedByScan") : t("topbar.changeTrainSet", { min, max });
  }
  function manualScanRunning() {
    return !!state.scanRunning && !automaticScanJob();
  }
  function setLimits() {
    const meta = state.meta || {};
    return { min: meta.setMin || 1, max: meta.setMax || 254 };
  }
  async function changeSet(value2) {
    const { min, max } = setLimits();
    const next = Number(String(value2).trim());
    if (!Number.isInteger(next) || next < min || next > max) {
      notify(t("topbar.setOutOfRange", { min, max }));
      setUpSetPicker(true);
      return;
    }
    if (next === state.setNo) return;
    if (manualScanRunning()) {
      notify(t("topbar.setLockedByScan"));
      setUpSetPicker(true);
      return;
    }
    const automatic = automaticScanJob();
    if (automatic) {
      try {
        await api.jobCancel(automatic.id);
      } catch {
      }
    }
    close2();
    patch({
      setNo: next,
      devices: [],
      locked: [],
      lastScan: null,
      ipState: null,
      configState: null,
      piscuState: null,
      checklistState: null,
      detailId: null
    });
    try {
      await loadInitialData();
      onViewEntered(state.view);
      showSuccess(t("topbar.setLoaded", { set: next }));
    } catch (e) {
      showError(e.message);
    }
    scanLoop(FIRST_SCAN_DELAY);
  }
  async function loadInitialData() {
    const meta = await api.project(state.setNo);
    patch({ meta, setNo: meta.setNo });
    await fetchState();
    await fetchJobs();
  }
  function applyEdition(body) {
    const wasAdmin = state.mode === "admin";
    patch({
      edition: body,
      mode: body.mode,
      views: body.views || [],
      projects: body.projects || []
    });
    if (!(state.views || []).includes(state.view)) {
      patch({ view: state.views[0] || "overview" });
    }
    if (wasAdmin !== (body.mode === "admin")) redrawEverything();
    return body;
  }
  async function enterAdmin() {
    try {
      applyEdition(await api.adminMode(true));
      showSuccess(t("adminkey.entered"));
    } catch (e) {
      showError(e.message);
    }
  }
  async function leaveAdmin() {
    try {
      applyEdition(await api.adminMode(false));
      notify(t("adminkey.left"));
    } catch (e) {
      showError(e.message);
    }
  }
  var adminKeyTimer = null;
  var declinedGeneration = -1;
  var askingAboutKey = false;
  function adminKeyLoop() {
    clearTimeout(adminKeyTimer);
    adminKeyTimer = setTimeout(async () => {
      try {
        const seen = await api.adminKey();
        const previous = state.adminKey;
        patch({ adminKey: seen });
        if (!previous || previous.generation !== seen.generation || previous.withoutKey !== seen.withoutKey) {
          await onKeyChanged(seen, previous);
        }
      } catch {
      }
      adminKeyLoop();
    }, ADMIN_KEY_INTERVAL);
  }
  async function onKeyChanged(seen, previous) {
    if (state.mode === "admin" && !seen.recognised && !seen.withoutKey) {
      try {
        applyEdition(await api.edition());
      } catch {
      }
      if (state.mode !== "admin") {
        const pulled = !!(previous && previous.recognised);
        notify(t(pulled ? "adminkey.removed" : "adminkey.closed"));
      }
      return;
    }
    if (state.mode === "admin" || !seen.recognised) {
      if (seen.present && !seen.recognised) {
        if (seen.reason === "denied") notify(t("adminkey.denied"));
        else if (previous) notify(t("adminkey.notRecognised"));
      }
      return;
    }
    if (seen.generation === declinedGeneration) return;
    await askAboutKey(seen, !previous);
  }
  async function askAboutKey(seen, atLaunch) {
    if (askingAboutKey) return;
    askingAboutKey = true;
    try {
      const yes = await ask({
        title: t(atLaunch ? "adminkey.launchTitle" : "adminkey.switchTitle"),
        body: t(
          atLaunch ? "adminkey.launchLead" : "adminkey.switchLead",
          { label: seen.label || t("adminkey.unlabelled") }
        ),
        confirm: t(atLaunch ? "adminkey.startAdmin" : "adminkey.switchNow"),
        cancel: t(atLaunch ? "adminkey.continueNormal" : "adminkey.notNow")
      });
      if (yes) await enterAdmin();
      else declinedGeneration = seen.generation;
    } finally {
      askingAboutKey = false;
    }
  }
  async function chooseProject() {
    const projects = state.projects || [];
    const current2 = projects.find((p) => p.current);
    const picked = await pick({
      title: t("topbar.projectSwitch"),
      cancel: t("locked.cancel"),
      options: projects.map((project) => ({
        value: project.key,
        label: project.label,
        // A project whose device list has not arrived yet (VIP today) is
        // listed with the reason rather than left out: it exists, and the
        // engineer asking for it deserves to be told why not.
        note: project.available ? "" : t("admin.projectUnavailable"),
        disabled: !project.available || project.key === (current2 || {}).key
      }))
    });
    if (!picked || current2 && picked === current2.key) return;
    try {
      applyEdition(await api.selectProject(picked));
    } catch (e) {
      showError(e.message);
      return;
    }
    close2();
    patch({
      devices: [],
      locked: [],
      lastScan: null,
      ipState: null,
      configState: null,
      piscuState: null,
      checklistState: null,
      detailId: null,
      jobs: []
    });
    try {
      await loadInitialData();
      onViewEntered(state.view);
      showSuccess(t("admin.projectSwitched", { project: state.meta.project }));
    } catch (e) {
      showError(e.message);
    }
    scanLoop(FIRST_SCAN_DELAY);
  }
  async function start3() {
    try {
      await load();
    } catch {
    }
    renderAll(redrawEverything);
    try {
      const version = await api.version();
      patch({ version: version.version });
      $("#footer-version").textContent = `v${version.version}`;
    } catch {
      showError(t("error.serviceUnreachable"));
    }
    try {
      applyEdition(await api.edition());
    } catch {
      showError(t("error.serviceUnreachable"));
    }
    $("#refresh-btn").addEventListener("click", refreshNow);
    $("#auto-btn").addEventListener("click", () => {
      const resuming = !state.autoRefresh;
      patch({ autoRefresh: resuming });
      if (resuming) scanLoop(0);
    });
    $("#density-btn").addEventListener("click", () => patch({
      density: state.density === "compact" ? "comfortable" : "compact"
    }));
    $("#queue-btn").addEventListener("click", toggle);
    $("#locked-btn").addEventListener("click", toggle2);
    $("#leave-admin-btn").addEventListener("click", leaveAdmin);
    $("#enter-admin-btn").addEventListener("click", enterAdmin);
    $("#project-btn").addEventListener("click", () => {
      if ((state.projects || []).length > 1) chooseProject();
      else if ((state.views || []).includes("admin")) patch({ view: "admin" });
    });
    globalThis.addEventListener("resize", alignSidePanel);
    $("#set-picker").addEventListener(
      "change",
      (e) => changeSet(e.target.value)
    );
    $("#set-picker").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        changeSet(e.target.value);
      } else if (e.key === "Escape") {
        setUpSetPicker(true);
        e.target.blur();
      }
    });
    for (const button of document.querySelectorAll("[data-close]")) {
      button.addEventListener("click", () => patch(
        button.dataset.close === "queue" ? { queueOpen: false } : { lockedOpen: false }
      ));
    }
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (isOpen()) return;
        if (state.detailId) {
          close2();
          return;
        }
        if (state.queueOpen || state.lockedOpen) {
          patch({ queueOpen: false, lockedOpen: false });
        }
        return;
      }
      shortcut(e);
    });
    onCredentialsAccepted(() => {
      fetchJobs();
      onViewEntered(state.view);
    });
    subscribe(render20);
    try {
      await loadInitialData();
    } catch (e) {
      showError(e.message);
    }
    jobLoop();
    lightLoop();
    scanLoop(FIRST_SCAN_DELAY);
    adminKeyLoop();
    render20();
    $("#content").focus();
    try {
      const seen = await api.adminKey();
      patch({ adminKey: seen });
      if (seen.recognised || seen.reason === "denied") {
        await onKeyChanged(seen, null);
      }
    } catch {
    }
  }
  globalThis.addEventListener("pagehide", () => {
    clearTimeout(lightTimer);
    clearTimeout(jobTimer);
    clearTimeout(scanTimer);
    clearTimeout(adminKeyTimer);
  });
  start3();
})();
</script>
</body>
</html>
