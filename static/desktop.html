<style>
/* static/css/base.css */
/* Commissioning and Maintenance Panel — tokens, reset and skeleton layout.
   The colours and typography come from the design file; this is their single
   source. */

:root {
  /* ground layers */
  --bg: #0e1317;
  --panel: #151d24;
  --panel-2: #111a20;
  --deep: #0b1116;

  /* accent and text
     ────────────────
     EVERY VALUE BELOW THAT CARRIES TEXT REACHES 4.5:1 on --bg and --panel.
     It is measured, not judged by eye, and `tests/test_frontend.py` fails the
     build if one of them drops under. The panel is read standing up in a
     depot, so this is a field requirement rather than a formality.

     --text-dim used to be #5d7185 (3.38:1) and is the most widely used
     secondary colour in the app — timestamps, hints, the footer, the "last
     scan" line — almost always at the smallest size. */
  --accent: #4294E0;
  --accent-soft: rgba(66, 148, 224, .10);
  --accent-line: rgba(66, 148, 224, .45);
  --text: #e6edf3;
  --text-bright: #a9bacb;
  --text-mid: #7f93a6;
  --text-dim: #71879c;
  /* Never used for text: two decorative fills only (see ip.css). */
  --text-faint: #3d4c5a;
  --brand: #8fa3b5;

  /* state colours — the green/amber/red/grey set.
     These paint dots, borders and port graphics, where contrast against the
     ground matters less than telling the four states apart. Red and grey are
     too dark to READ, so the same states have their own text values below and
     the two must not be swapped. */
  --ok: #3fb950;
  --auth: #d29922;
  --failed: #da3633;
  --unknown: #3d4c5a;
  --ok-soft: rgba(63, 185, 80, .45);
  --auth-soft: rgba(210, 153, 34, .45);
  --failed-soft: rgba(218, 54, 51, .45);

  /* the same states, as text. Green and amber already pass, so they point at
     the fill value and stay one colour; red and grey do not. */
  --ok-text: var(--ok);
  --auth-text: var(--auth);
  --failed-text: #e05c59;
  --unknown-text: var(--text-dim);
  /* The softer red of error sentences and invalid-field warnings — a whole
     paragraph in --failed-text reads as an alarm. */
  --danger-text: #e8817f;

  /* lines */
  --line: rgba(214, 235, 255, .14);
  --line-strong: rgba(214, 235, 255, .22);
  --line-soft: rgba(214, 235, 255, .07);
  --line-corner: #6b8299;

  /* typography — the design fonts when installed, otherwise the system */
  --font-heading: "Barlow Condensed", "Oswald", "Avenir Next Condensed",
              "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", "Menlo", monospace;

  /* THE TYPE SCALE — the only place a font size is chosen.
     ─────────────────────────────────────────────────────
     There used to be 125 font-size declarations across 22 distinct values,
     from 9px to 32px, in half-pixel steps, plus 49 more written inline in
     JavaScript. Eleven of those steps sat inside five pixels, so they carried
     no meaning: nothing on screen told 11px apart from 11.5px, and the
     smallest text was too small to read at arm's length.

     Eight steps, in rem so the browser's zoom and the operating system's own
     text-size setting both work. The floor is 11px: below that this stops
     being a tool you can use standing up.

     `tests/test_frontend.py` rejects any font-size in px outside this block
     and any inline font-size in the JavaScript. */
  --fs-xs: 0.6875rem;    /* 11px — badges, units, timestamps */
  --fs-sm: 0.75rem;      /* 12px — table cells, notes, help text */
  --fs-base: 0.8125rem;  /* 13px — the everyday reading size */
  --fs-md: 0.9375rem;    /* 15px — body default, dialog prose */
  --fs-lg: 1.125rem;     /* 18px — h3, card titles */
  --fs-xl: 1.375rem;     /* 22px — h2 on a narrow window */
  --fs-2xl: 1.75rem;     /* 28px — h2 */
  --fs-3xl: 2rem;        /* 32px — the big KPI figures */

  /* The column a side panel takes on a wide window. Fixed, because there it
     sets the content's width rather than the other way round (see app.js
     alignSidePanel). */
  --queue-width: 340px;
  --top-height: 50px;
  /* The footer carries the main-menu button too; at 30px it did not fit. */
  --footer-height: 36px;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--fs-md);
  line-height: 1.5;
  overflow: hidden;
}

h1, h2, h3, h4 {
  font-family: var(--font-heading);
  font-weight: 600;
  letter-spacing: 0;
  text-transform: none;
  line-height: 1.12;
  margin: 0;
}

h2 { font-size: var(--fs-2xl); }
h3 { font-size: var(--fs-lg); }
h4 { font-size: var(--fs-md); }

button { font: inherit; color: inherit; }
input, select { font: inherit; }

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
/* The content area is only a programmatic focus target (focus moves there
   on a screen change). It is not a keyboard-navigable element, so no ring is
   drawn — it showed up as one huge blue box at startup. */
#content:focus, #content:focus-visible { outline: none; }

/* "Skip to content" — the first thing Tab reaches. Off-screen until it has
   focus, because the alternative for a keyboard user is walking the top bar
   and the whole menu rail on every screen. */
.skip-link {
  position: absolute; left: 8px; top: -100px; z-index: 60;
  padding: 8px 12px;
  border: 1px solid var(--accent-line);
  background: var(--panel);
  color: var(--text);
  font-size: var(--fs-sm);
  text-decoration: none;
}
.skip-link:focus-visible { top: 8px; }

::selection { background: rgba(66, 148, 224, .35); }

/* scrollbars — a light bar on a dark ground is not distracting */
* {
  scrollbar-width: thin;
  scrollbar-color: #2a3339 transparent;
}
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-thumb { background: #2a3339; }
*::-webkit-scrollbar-track { background: transparent; }

/* screen reader text */
.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

[hidden] { display: none !important; }

/* ─────────────────────────────────────────── application skeleton ── */
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.top-bar {
  display: flex; align-items: center; gap: 10px;
  min-height: var(--top-height); flex: none;
  padding: 0 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.top-bar img.logo { height: 24px; display: block; }
.top-bar .divider { width: 1px; height: 22px; background: var(--line); flex: none; }
.top-bar .app-name {
  font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-base);
  letter-spacing: .18em; text-transform: uppercase; color: var(--brand);
  white-space: nowrap;
}
.top-bar .spacer { flex: 1; }
/* The mode badge is the same height as the icon buttons in the top bar; a
   small chip floated between the 30px buttons next to it. It is only ever
   shown in admin mode, so it is coloured like the thing it announces. */
#mode-badge {
  height: 30px; padding: 0 11px; flex: none;
  font-size: var(--fs-sm); color: var(--accent);
}
/* The key has been pulled out but a write is still running, so admin mode is
   held open until the queue clears (see panel/adminkey/watcher.py). The
   badge says so rather than changing silently under the user. */
#mode-badge[data-pending="1"] { color: var(--auth); }

.body {
  position: relative;
  display: flex;
  flex: 1;
  min-height: 0;
}

/* The main menu is a narrow icon rail: 56 pixels. Hovering an icon shows the
   name in a bubble beside it; whoever wants them permanently expands the rail
   (see views.css "icon rail"). The bubble spills outside the rail, so
   overflow is not clipped here. */
.sidebar {
  flex: none;
  z-index: 30;
  display: flex; flex-direction: column;
  width: 56px;
  background: var(--panel);
  border-right: 1px solid var(--line);
  transition: width .18s ease;
}
.sidebar[data-wide="1"] { width: 214px; }
@media (prefers-reduced-motion: reduce) { .sidebar { transition: none; } }

.content {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 20px 24px 28px;
}

.footer-bar {
  display: flex; align-items: center; gap: 14px;
  height: var(--footer-height); flex: none;
  padding: 0 18px;
  background: var(--panel);
  border-top: 1px solid var(--line);
  font-family: var(--font-body); font-size: var(--fs-sm); color: var(--text-dim);
}
.footer-bar .divider { width: 1px; height: 14px; background: var(--line); }

/* ── narrow screen ─────────────────────────────────────────────────── */
@media (max-width: 1080px) {
  /* The application name already appears in the window title. Hiding this
     text at the minimum desktop width stops the active job type from being
     clipped and the top-bar actions from overflowing. */
  .top-bar .app-name,
  .top-bar img.logo + .divider { display: none; }
  .content { padding: 16px 14px 24px; }
}

@media (max-width: 720px) {
  .top-bar { flex-wrap: wrap; padding: 6px 10px; min-height: auto; }
  h2 { font-size: var(--fs-xl); }
}

/* static/css/components.css */
/* Reused parts: buttons, cards, tables, badges, the credentials menu, the
   queue panel and the dialogs. */

/* ──────────────────────────────────────────────────────────── buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 14px;
  background: transparent;
  border: 1px solid var(--line-strong);
  border-radius: 0;
  color: var(--text);
  cursor: pointer;
  font-family: var(--font-body); font-weight: 600; font-size: var(--fs-base);
  letter-spacing: 0; text-transform: none;
  white-space: nowrap;
  transition: background .12s ease, border-color .12s ease;
}
.btn:hover:not(:disabled) { background: rgba(214, 235, 255, .06); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn-primary {
  background: var(--accent); border-color: var(--accent); color: var(--deep);
}
.btn-primary:hover:not(:disabled) { background: #59a3e8; }

.btn-danger { border-color: var(--failed-soft); color: var(--failed-text); }
.btn-danger:hover:not(:disabled) { background: rgba(218, 54, 51, .12); }

.btn-small { padding: 5px 11px; font-size: var(--fs-base); }

/* Fixed-width button: the two labels sit on top of each other in the same
   grid cell and the longer one sets the cell width. No pixel value is
   written — if the font is not installed the fallback kicks in and a fixed
   width no longer holds. */
#refresh-btn, #auto-btn { display: inline-grid; place-items: center; }
#refresh-btn > span, #auto-btn > span { grid-area: 1 / 1; }
#refresh-btn .label-measure, #auto-btn .label-measure { visibility: hidden; }

/* Pressed = paused, in the amber the panel already uses for "needs your
   attention" rather than the accent it uses for "on". Being paused is not a
   setting that is switched on, it is a state in which what is on screen is
   quietly ageing. */
#auto-btn[aria-pressed="true"] {
  border-color: var(--auth); color: var(--auth);
}

.btn-icon {
  width: 30px; height: 30px; padding: 0; flex: none;
  border-color: var(--line); color: var(--text-mid);
}
.btn-icon:hover:not(:disabled) { color: var(--text); border-color: var(--line-strong); }
.btn-icon[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

.btn-close {
  width: 24px; height: 24px; padding: 0; flex: none;
  border-color: var(--line); color: var(--text-mid);
  font-family: var(--font-body); font-size: var(--fs-base); letter-spacing: 0;
}

/* ────────────────────────────────────────────────────────── alanlar ──── */
.field {
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--line-strong);
  border-radius: 0;
  padding: 8px 10px;
  font-family: var(--font-mono); font-size: var(--fs-base);
}
.field:focus-visible { border-color: var(--accent); }
.field[aria-invalid="true"] { border-color: var(--failed); color: var(--failed-text); }

.label {
  font-family: var(--font-body); font-size: var(--fs-sm); font-weight: 600;
  letter-spacing: .01em; color: var(--text-mid); text-transform: none;
}

/* ──────────────────────────────────────────────────── corner marks ── */
.corner { position: relative; }
.corner::before, .corner::after {
  content: ""; position: absolute; width: 11px; height: 11px;
  pointer-events: none;
  background:
    linear-gradient(var(--line-corner), var(--line-corner)) center/100% 1px no-repeat,
    linear-gradient(var(--line-corner), var(--line-corner)) center/1px 100% no-repeat;
}
.corner::before { left: -6px; top: -6px; }
.corner::after { right: -6px; bottom: -6px; }

/* ──────────────────────────────────────────────────────────── kartlar ── */
.card {
  border: 1px solid var(--line);
  background: var(--panel);
  padding: 15px 17px 16px;
}

.card-head {
  display: flex; align-items: baseline; gap: 12px;
  margin-bottom: 13px; flex-wrap: wrap;
}
.card-head .spacer { flex: 1; }

.page-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; margin-bottom: 18px;
}
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
/* The single line under the heading: how fresh the numbers on the page are. */
.page-sub {
  margin-top: 5px;
  font-family: var(--font-body); font-size: var(--fs-base); color: var(--text-mid);
}
/* The checklist refreshes itself. When the data goes stale this line draws
   attention: producing an Excel from that view means a wrong document. */
.check-freshness[data-stale="1"] { color: var(--auth); }

/* The age of the data and the counters in the Excel confirmation. */
.dialog .summary-box {
  margin-top: 12px;
  padding: 2px 12px;
  border: 1px solid var(--line-soft);
  background: var(--deep);
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
}
.dialog .summary-box .summary-row:last-child { border-bottom: 0; }
.eyebrow {
  font-family: var(--font-body); font-size: var(--fs-sm); font-weight: 600;
  letter-spacing: .01em; color: var(--text-mid); text-transform: none;
}

/* ───────────────────────────────────────────────────── state colours ── */
.dot {
  width: 7px; height: 7px; flex: none; display: block;
  background: var(--unknown);
}
/* Two values per state, and they are not interchangeable. --state-colour
   paints dots, edges and port graphics; --state-text is what a WORD is
   written in. Red (#da3633) reaches only 3.7:1 on the panel and grey is
   darker still, so a row that says "Failed" in --state-colour could not be
   read — which is exactly the row somebody needs to read. */
[data-state="ok"] { --state-colour: var(--ok); --state-text: var(--ok-text); }
[data-state="auth"] { --state-colour: var(--auth); --state-text: var(--auth-text); }
[data-state="failed"] { --state-colour: var(--failed); --state-text: var(--failed-text); }
[data-state="unknown"] { --state-colour: var(--unknown); --state-text: var(--unknown-text); }
/* A running job: green means "finished" and queued grey reads as dormant.
   Running is blue — the accent colour already means "happening now". */
[data-state="busy"] { --state-colour: var(--accent); --state-text: var(--accent); }
/* A physical link, on the switch screen. The same blue as "busy" and a
   separate name on purpose: this is a cable that is up, not work in progress,
   and the two would have started drifting the first time either colour moved.
   It is the blue `.pm-port.link` paints the faceplate with, so the dot in the
   port table and the connector above it cannot disagree. */
[data-state="link"] { --state-colour: var(--accent); --state-text: var(--accent); }
.dot[data-state] { background: var(--state-colour); }
.state-text[data-state] { color: var(--state-text); }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 5px;
  border: 1px solid var(--line-strong);
  font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: .02em;
  color: var(--text-mid);
}

/* A small stated fact, coloured by whether it is a good one. Used as a button
   on the switch screen (the port's on/off control) and as a plain span on the
   ADB screen (whether the application came up), which is why it lives here
   rather than in either screen's stylesheet: it arrived in switch.css, and the
   ADB screen reaching across for `.pill ok` — a variant that did not exist —
   is how that was noticed. `justify-self` is for the switch table's grid row
   and is ignored everywhere else. */
.pill {
  padding: 3px 10px;
  justify-self: start;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
.pill.on, .pill.ok { border-color: var(--ok-soft); color: var(--ok-text); }
.pill.off { border-color: var(--failed-soft); color: var(--failed-text); }
/* Only the ones that are actually a control. The ADB screen's pill is a span
   stating a fact, and a hand cursor over it would promise a click. */
button.pill { cursor: pointer; }
button.pill:hover { border-color: var(--line-strong); }

.mono { font-family: var(--font-mono); }
.text-dim { color: var(--text-dim); }
.text-mid { color: var(--text-mid); }
.text-bright { color: var(--text-bright); }

/* Size utilities. They exist so a view never writes a size of its own: every
   screen used to set font-size inline, forty-nine times over ten files, which
   is how the scale reached twenty-two values (see the note in base.css). */
.t-xs { font-size: var(--fs-xs); }
.t-sm { font-size: var(--fs-sm); }
.t-base { font-size: var(--fs-base); }
/* A version the device really reported, as opposed to the dash that stands
   in for "not read yet" (see views/devices.js). */
.version-read { color: var(--ok-text); }

/* A single word used as a STATE — "Reachable", "Failed", the project name.
   The heading face, letter-spaced and upper case, so the cell reads as a
   label rather than as content. */
.state-label {
  font-family: var(--font-heading); font-weight: 600;
  font-size: var(--fs-base);
  letter-spacing: .08em; text-transform: uppercase;
}
.title-label {
  font-family: var(--font-heading); font-weight: 600;
  font-size: var(--fs-lg);
  letter-spacing: .06em; text-transform: uppercase;
}

/* ───────────────────────────────────────────────────────── tablolar ──── */
/* A grid-based table: column widths are tuned per screen, and it scrolls
   horizontally inside itself so rows do not break on a narrow screen. */
.table-wrap {
  overflow-x: auto;
  margin-top: 14px;
}

.table {
  min-width: var(--table-min, 900px);
}

.table-head, .table-row {
  display: grid;
  grid-template-columns: var(--table-columns);
  gap: 10px;
  align-items: center;
  padding: 9px 12px;
  border: 1px solid var(--line);
}

/* COMPACT ROWS — padding only.
   ──────────────────────────
   Roughly a third more rows on the screen, which is the whole point: forty
   devices in one view instead of twenty-eight. What does NOT change is the
   type size. The scale's floor is 11px because this panel is read standing
   up in a depot (see base.css), and packing more rows in is not a reason to
   go under it — the text stays exactly as legible, the whitespace goes.

   Set on #app, so it reaches the tables no `dataTable` builds too. */
[data-density="compact"] .table-head,
[data-density="compact"] .table-row {
  padding: 4px 12px;
}
[data-density="compact"] .confirm-list .row,
[data-density="compact"] .detail-row {
  padding-top: 3px;
  padding-bottom: 3px;
}

.table-head {
  background: var(--panel);
  border-bottom: 0;
  font-family: var(--font-body); font-size: var(--fs-sm); font-weight: 600;
  letter-spacing: .01em; color: var(--text-mid); text-transform: none;
  position: sticky; top: 0; z-index: 2;
}

.table-row {
  border-top: 0;
  background: var(--panel-2);
  text-align: left;
  width: 100%;
  font: inherit;
  color: var(--text);
}
button.table-row { cursor: pointer; }
button.table-row:hover { background: #16212a; }
button.table-row[aria-selected="true"] { background: var(--accent-soft); }


.table-row .truncate {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  min-width: 0;
}

.table-empty {
  border: 1px solid var(--line); border-top: 0;
  background: var(--panel-2);
  padding: 22px 12px; text-align: center;
  font-family: var(--font-body); font-size: var(--fs-base); color: var(--text-mid);
}

/* ───────────────────────────────────────────────────── target strip ── */
/* The group strip scrolls horizontally when it does not fit. The fade on the
   right edge says the list continues: a clipped last chip looked like the
   end, and users were not looking for the remaining groups. */
.chip-bar {
  display: flex; align-items: center; gap: 7px;
  flex-wrap: nowrap; overflow-x: auto;
  min-height: 44px; margin-top: 16px;
  padding: 6px 12px;
  border: 1px solid var(--line); background: var(--panel);
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
}
/* No fade is needed at the end, or when everything fits. */
.chip-bar[data-at-end="1"] { -webkit-mask-image: none; mask-image: none; }
.chip-bar .label { flex: none; margin-right: 4px; }

/* The operation target: a compact dropdown instead of a row of chips when
   only one can be chosen. The counts appear in the operation table; the
   picker's only job is the scope. */
.target-picker {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 18px;
}
.target-picker .label { margin: 0; color: var(--text-mid); }
.target-picker .field {
  width: auto;
  min-width: 190px;
  min-height: 35px;
  padding-top: 6px;
  padding-bottom: 6px;
}

.chip {
  flex: none;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 10px;
  background: transparent;
  border: 1px solid var(--line-strong);
  color: var(--text-bright);
  cursor: pointer;
  font-family: var(--font-body); font-weight: 600; font-size: var(--fs-base);
  letter-spacing: 0; text-transform: none;
  white-space: nowrap;
}
.chip .count { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim); }
.chip[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent); color: var(--deep);
}
/* The count sits ON the accent fill, so it is dark text on light.
   At 65% it measured 3.4:1 — de-emphasised past the point of being
   readable, which is not de-emphasis. 80% is the first step that
   clears 4.5:1 and still reads as quieter than the label. */
.chip[aria-pressed="true"] .count { color: rgba(11, 17, 22, .8); }

/* ──────────────────────────────────────────────────── progress bars ── */
.bar { height: 3px; background: rgba(214, 235, 255, .1); }
.bar > i { display: block; height: 3px; background: var(--accent); }

/* ─────────────────────────────────────────── credentials and queue ─── */
.count-badge {
  position: absolute; top: -7px; right: -7px;
  min-width: 17px; height: 17px; padding: 0 4px;
  display: flex; align-items: center; justify-content: center;
  background: var(--auth); color: var(--deep);
  font-family: var(--font-mono); font-size: var(--fs-xs);
}
.count-badge[data-kind="queue"] { background: var(--accent); }

/* A job was added to the queue — the panel does not open, so the news is
   given on the button. Three short pulses, then the button settles. */
#queue-btn[data-flash] {
  border-color: var(--accent);
  color: var(--accent);
  animation: queue-pulse .85s ease-out 3;
}
@keyframes queue-pulse {
  0%   { box-shadow: 0 0 0 0 rgba(66, 148, 224, .55); }
  70%  { box-shadow: 0 0 0 7px rgba(66, 148, 224, 0); }
  100% { box-shadow: 0 0 0 0 rgba(66, 148, 224, 0); }
}
/* For a user who asks for reduced motion, a flat accent replaces the pulse. */
@media (prefers-reduced-motion: reduce) {
  #queue-btn[data-flash] { animation: none; background: var(--accent-soft); }
}

/* The job queue and the credentials list.
   ───────────────────────────────────────
   On a wide window the panel TAKES ITS OWN COLUMN and the content beside it
   narrows: it is already a flex sibling of `.content` inside `.body`, so this
   is what happens naturally once it stops being positioned.

   It used to overlay instead, and because the queue opens itself every time a
   job starts, that was the ordinary state rather than an edge case: at
   1100px the "Start IP assignment" button sat underneath it, unreachable
   without closing the panel first, with nothing dimmed to say so.

   Below 1080px there is no room for two columns, so it goes back to
   overlaying — and then `.panel-scrim` dims what it covers, which is the part
   that was missing. */
.side-panel {
  flex: none;
  width: min(92vw, var(--queue-width, 340px));
  z-index: 30;
  background: var(--panel);
  border-left: 1px solid var(--line-strong);
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* Only drawn while the panel overlays, and it is not a control: closing is
   the × in the panel header or Escape, both already there. */
.panel-scrim {
  position: absolute; inset: 0;
  z-index: 29;
  background: rgba(6, 10, 13, .55);
}

@media (min-width: 1081px) { .panel-scrim { display: none; } }

@media (max-width: 1080px) {
  .side-panel {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: min(92vw, max(300px, var(--side-panel, 340px)));
    box-shadow: -14px 0 34px rgba(6, 10, 13, .55);
  }
}
.side-panel > header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
}
.side-panel > header .title {
  font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-lg);
  letter-spacing: 0; text-transform: none;
}
.side-panel > .list {
  flex: 1; overflow-y: auto;
  padding: 12px 14px 16px;
  display: flex; flex-direction: column; gap: 10px;
}

/* The job card has no coloured edge strip: the job's state is read from the
   dot in the heading, the percentage and the counters, and painting the card
   edge as well made the queue noisy. */
.job-card {
  border: 1px solid var(--line);
  background: var(--panel-2);
}

/* The running row is set apart by a thin border: the run works through the
   ports in order, so this border is on exactly one row at a time and is the
   calmest way to say "here, right now". A light sweeping across the row was
   tried and made the queue boil. The negative margin stops the border from
   shifting the text relative to the other rows. */
.job-row[data-row-state="running"] {
  border: 1px solid var(--accent-line);
  background: rgba(66, 148, 224, .06);
  padding: 6px 7px;
  margin: 0 -8px;
}
/* The only motion is on the dot: it answers "stalled, or still running?". */
.job-row[data-row-state="running"] .dot {
  animation: job-pulse 1.6s ease-in-out infinite;
}

@keyframes job-pulse {
  0%, 100% { opacity: 1;  box-shadow: 0 0 0 0 rgba(66, 148, 224, .45); }
  50%      { opacity: .45; box-shadow: 0 0 0 3px rgba(66, 148, 224, 0); }
}

@media (prefers-reduced-motion: reduce) {
  .job-row[data-row-state="running"] .dot { animation: none; }
}
/* The title button and the stop button share one row. `width:100%` used to
   be here, and with the title button asking for the whole width the stop
   button spilled outside the card (the queue panel is narrow). Now the title
   flexes and the stop button keeps its fixed width. */
.job-card-head { display: flex; align-items: stretch; min-width: 0; }
.job-card-head > .btn-close { align-self: center; margin-right: 9px; flex: none; }
.job-head {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 11px; flex: 1; min-width: 0;
  background: transparent; border: 0; cursor: pointer; text-align: left;
}
.job-head .name {
  display: block;
  font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-md);
  letter-spacing: 0; text-transform: none;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.job-head .sub {
  display: block; margin-top: 3px;
  font-family: var(--font-mono); font-size: var(--fs-xs);
}
/* The phase text ("Port 14 · writing the IP (3/6)"). One line: a long phase
   must not grow the card and push the other queued jobs down. */
.job-phase {
  display: block; margin-top: 2px;
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.job-counts {
  display: flex; gap: 9px; flex: none;
  font-family: var(--font-mono); font-size: var(--fs-xs);
}
/* Glyph and number read as one figure, so the pair must not be split by the
   gap between counts. */
.job-count { display: inline-flex; align-items: center; gap: 3px; }
.job-count svg { flex: none; }
/* A thin progress bar — flush with the bottom of the card, running job only. */
.job-bar { height: 2px; background: var(--line-soft); overflow: hidden; }
.job-bar i {
  display: block; height: 100%;
  background: var(--state-colour, var(--accent));
  transition: width .3s ease;
}
.job-rows { padding: 4px 11px 10px; }
.job-row {
  display: flex; gap: 9px; padding: 7px 0;
  border-bottom: 1px solid var(--line-soft);
}
.job-row .dot { margin-top: 5px; width: 6px; height: 6px; }
/* The class cannot be called ".body": that name is used by the application's
   main body, and its display:flex laid this row out side by side. */
.job-row .job-row-body { min-width: 0; flex: 1; }
/* A long file name ("..._set1.xlsx") spilled out of its box and over the
   state text on the right: the browser does not treat an underscore or a dot
   as a break opportunity, so breaking is asked for explicitly. */
.job-row .name {
  display: block; font-family: var(--font-mono); font-size: var(--fs-sm);
  overflow-wrap: anywhere;
}
.job-row .sub {
  display: block; margin-top: 2px;
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
  word-break: break-word;
}
/* The reason a row failed. Two lines at most: past that the queue stops
   being a list and becomes a log, which is what the log file is for. */
.job-row-reason {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  margin-top: 3px;
  font-size: var(--fs-xs);
  line-height: 1.45;
  color: var(--danger-text);
  overflow-wrap: anywhere;
}
.job-row[data-row-state="skipped"] .job-row-reason { color: var(--text-mid); }

.job-row .state {
  flex: none; align-self: flex-start;
  font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-sm);
  letter-spacing: .08em; text-transform: uppercase;
}

/* ---- the step accordion under a row ----
   Where a port is within the run ("searching for the device", "writing the
   IP") did not fit into a one-line note: each new step erased the previous
   one, and when the port failed, what happened when was lost. A row with
   steps turns into a button; the button's own appearance is reset and the row
   appearance
   .job-row'dan gelir. */
.job-row-btn {
  width: 100%; color: inherit; font: inherit;
  background: transparent;
  border-top: 0; border-left: 0; border-right: 0;
  text-align: left; cursor: pointer;
}
.job-row-btn:hover { background: rgba(255, 255, 255, .02); }
/* The only marker that a row expands; it turns downwards when open. */
.job-chevron {
  flex: none; align-self: center; width: 6px; height: 6px;
  margin-top: -3px;
  border-right: 1.5px solid var(--text-dim);
  border-bottom: 1.5px solid var(--text-dim);
  transform: rotate(-45deg);
  transition: transform .18s ease;
}
.job-row-btn[data-open="true"] .job-chevron {
  transform: rotate(45deg); margin-top: -2px;
}
@media (prefers-reduced-motion: reduce) {
  .job-chevron { transition: none; }
}

.job-steps {
  margin: 0 0 6px 3px; padding: 4px 0 4px 13px;
  border-left: 1px solid var(--line-soft);
}
.job-step { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
.job-step .dot { width: 5px; height: 5px; margin-top: 0; }
.job-step-text {
  flex: 1; min-width: 0;
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-mid);
  overflow-wrap: anywhere;
}
.job-step[data-row-state="warning"] .job-step-text { color: var(--auth); }
.job-step[data-row-state="failed"] .job-step-text { color: var(--failed); }
.job-step-time {
  flex: none; align-self: flex-start;
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
}

/* The two buttons under a generated file: open / show in folder. */
.file-actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.file-btn {
  gap: 5px; padding: 3px 8px;
  font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 400;
  letter-spacing: .04em; text-transform: none;
  border-color: var(--line); color: var(--text-mid);
}
.file-btn:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
.file-btn svg { flex: none; }

.locked-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 10px;
  width: 100%;
  padding: 10px 11px;
  background: var(--panel-2);
  border: 1px solid var(--auth-soft);
  color: var(--text);
  cursor: pointer; text-align: left;
}
.locked-row:hover { background: #1a232b; }
.locked-row .name {
  font-family: var(--font-mono); font-size: var(--fs-base);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.locked-row .sub {
  grid-column: 1 / -1;
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
  line-height: 1.5;
}

/* ────────────────────────────────────────────────────────── dialog ──── */
.backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(6, 10, 13, .62);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.backdrop.right { align-items: stretch; justify-content: flex-end; padding: 0; }

.dialog {
  width: min(430px, 100%);
  background: var(--panel);
  border: 1px solid var(--line-strong);
  padding: 20px 22px 22px;
  display: flex; flex-direction: column; gap: 14px;
  max-height: 92vh; overflow-y: auto;
}
.dialog h3 { font-size: var(--fs-lg); }
.dialog .description { font-size: var(--fs-base); color: var(--text-bright); }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }

/* dialog.pick — one row per choice. A row that cannot be chosen is dimmed
   and keeps its note, which is the only thing on the row that says why. */
.pick-list { display: flex; flex-direction: column; gap: 6px; }
.pick-item {
  display: flex; align-items: baseline; justify-content: space-between;
  /* Wraps rather than breaking a word: these rows carry drive names, and in
     a narrow column "DABP-KEY" was being split across two lines. The note
     drops underneath instead and the name keeps its full width. */
  flex-wrap: wrap;
  gap: 4px 12px; width: 100%; text-align: left;
  padding: 10px 12px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text);
  font-family: inherit; font-size: var(--fs-base);
  cursor: pointer;
}
.pick-item:hover:not(:disabled) { border-color: var(--accent-line); }
.pick-item:disabled { cursor: default; color: var(--text-dim); }
.pick-label { font-weight: 600; }
.pick-note {
  font-family: var(--font-mono); font-size: var(--fs-xs);
  color: var(--text-faint);
}

.warning {
  padding: 8px 10px;
  border: 1px solid var(--failed-soft);
  background: rgba(218, 54, 51, .08);
  color: var(--danger-text);
  font-size: var(--fs-base);
}
.info {
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  font-size: var(--fs-base); color: var(--text-bright);
}

.checkbox {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 11px;
  background: transparent;
  border: 1px solid var(--line-strong);
  color: var(--text); cursor: pointer; text-align: left; width: 100%;
}
.checkbox .box {
  width: 12px; height: 12px; flex: none;
  border: 1px solid var(--line-strong); display: block;
}
.checkbox[aria-pressed="true"] { border-color: var(--accent); }
.checkbox[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.checkbox span:last-child {
  font-family: var(--font-body); font-weight: 600; font-size: var(--fs-base);
  letter-spacing: 0; text-transform: none;
}

/* ────────────────────────────────────────────────────── device detail ── */
.detail {
  width: min(520px, 100%); height: 100%;
  background: var(--panel);
  border-left: 1px solid var(--line-strong);
  overflow-y: auto;
  padding: 20px 24px 30px;
}
.detail-block { margin-top: 20px; }
.detail-block > .head {
  display: flex; align-items: baseline; gap: 10px;
  padding-bottom: 7px; border-bottom: 1px solid var(--line);
}
.detail-block > .head .spacer { flex: 1; }
.detail-row {
  display: grid; grid-template-columns: 1fr 1.1fr; gap: 12px;
  padding: 7px 0; border-bottom: 1px solid rgba(214, 235, 255, .06);
}
.detail-row .name { font-size: var(--fs-base); color: var(--text-mid); }
.detail-row .value {
  font-family: var(--font-mono); font-size: var(--fs-base);
  word-break: break-word;
}

/* ───────────────────────────────────────────────────── toast strip ─── */
/* The strip stacks: several messages can be on screen at once and an error
   stays until it is dismissed (see components/toast.js). */
#toast {
  position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%);
  z-index: 70;
  display: flex; flex-direction: column; gap: 8px;
  max-width: min(560px, 92vw);
  font-size: var(--fs-base);
}
.toast-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 9px 14px;
  border: 1px solid var(--line-strong);
  background: var(--panel);
  box-shadow: 0 8px 26px rgba(6, 10, 13, .6);
}
.toast-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.toast-item[data-kind="error"] {
  border-color: var(--failed-soft); color: var(--danger-text);
}
.toast-item[data-kind="success"] {
  border-color: var(--ok-soft); color: var(--ok-text);
}
/* Only an error carries one — the others take themselves away. */
.toast-close { flex: none; margin: -2px -6px 0 0; }

/* The shortcut list, opened with `?`. */
.shortcut-list { display: flex; flex-direction: column; gap: 8px; }
.shortcut-list .row { display: flex; align-items: center; gap: 12px; }
.shortcut-list kbd {
  flex: none; min-width: 34px; padding: 3px 7px;
  border: 1px solid var(--line-strong);
  background: var(--deep);
  font-family: var(--font-mono); font-size: var(--fs-sm);
  text-align: center;
}

/* ─────────────────────────────────────────── top bar project strip ─── */
.project-bar {
  display: flex; align-items: center; gap: 7px; flex: none;
  padding: 3px 9px;
  border: 1px solid var(--line-strong);
  font-family: var(--font-mono); font-size: var(--fs-sm); letter-spacing: .04em;
  white-space: nowrap;
}
.project-bar > button {
  display: flex; align-items: center; gap: 7px;
  padding: 2px 2px;
  background: transparent; border: 0; color: var(--text);
  cursor: pointer; font: inherit;
}
.project-bar > button:hover { color: var(--accent); }

.set-field {
  display: inline-flex; align-items: center; gap: 5px;
  color: var(--text); cursor: pointer;
}
/* A project addressed in fixed form has no train set to pick. The separator
   goes with the box: on its own it would divide the project name from
   nothing. `display` is set explicitly here because `.set-field` carries one
   and an author rule beats the browser's own [hidden]. */
.project-bar[data-set-picker="0"] > .set-field,
.project-bar[data-set-picker="0"] > .text-dim { display: none; }
.set-field input {
  width: 44px;
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--line);
  border-radius: 0;
  padding: 1px 4px;
  font-family: var(--font-mono); font-size: var(--fs-sm);
  text-align: center;
}
.set-field input:hover { border-color: var(--line-strong); }
.set-field input:focus-visible { border-color: var(--accent); }
.set-field input:disabled { color: var(--text-dim); cursor: not-allowed; }
/* The spinner arrows squeeze the number; the set number is typed anyway. */
.set-field input::-webkit-outer-spin-button,
.set-field input::-webkit-inner-spin-button {
  -webkit-appearance: none; margin: 0;
}
.set-field input { -moz-appearance: textfield; appearance: textfield; }

/* ─────────────────────────────────────────────────── language picker ─── */
/* Two buttons rather than a dropdown: with two options a dropdown hides
   which one is active, and the active language is the thing a lost user is
   looking for. Each language names ITSELF (EN / TR), never translated. */
.language-picker {
  display: flex;
  flex: none;
  border: 1px solid var(--line-strong);
}
.language-btn {
  height: 30px;
  min-width: 34px;
  padding: 0 8px;
  border: 0;
  background: transparent;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  letter-spacing: .06em;
}
.language-btn + .language-btn { border-left: 1px solid var(--line); }
.language-btn:hover { color: var(--text); background: rgba(214, 235, 255, .05); }
.language-btn[aria-pressed="true"] {
  background: var(--accent-soft);
  color: var(--accent);
}

/* ── the right-click menu (components/context_menu.js) ───────────────────────────────────────── */
/* Above the panels (z-index 30) and below a modal dialog (50): the menu is
   a shortcut on top of the screen, not a question that blocks it. */
.pm-menu {
  position: fixed;
  z-index: 40;
  width: 268px;
  max-height: calc(100vh - 20px);
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--line-strong);
  box-shadow: 0 14px 38px rgba(0, 0, 0, .55);
}
.pm-menu-head { padding: 10px 13px 9px; border-bottom: 1px solid var(--line); }
.pm-menu-title { color: var(--text); font-size: var(--fs-base); font-weight: 600; }
.pm-menu-subtitle {
  margin-top: 3px;
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  line-height: 1.5;
}
.pm-menu-heading {
  padding: 9px 13px 4px;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: .06em;
}
.pm-menu-item {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 7px 13px;
  background: transparent;
  border: 0;
  color: var(--text);
  cursor: pointer;
  font-size: var(--fs-sm);
  text-align: left;
}
.pm-menu-item:hover { background: var(--accent-soft); }
.pm-menu-mark {
  flex: none;
  width: 8px;
  height: 8px;
  border: 1px solid var(--line-strong);
  background: transparent;
}
.pm-menu-item.is-selected { background: var(--accent-soft); }
.pm-menu-item.is-selected .pm-menu-mark {
  background: var(--accent);
  border-color: var(--accent);
}
.pm-menu-label { flex: 1; min-width: 0; }
/* What is already true of the selection — "3/8", or "all". */
.pm-menu-state {
  flex: none;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
.pm-menu-foot {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 8px;
  padding: 9px 13px;
  border-top: 1px solid var(--line);
}

/* static/css/views.css */
/* Screen-specific layouts. The shared parts live in components.css. */

/* ───────────────────────────────────────────────────────── icon rail ─── */
/* 56 pixels for five areas (eight in the admin role). On the collapsed rail
   the name appears as a bubble beside the icon; expand the rail and the same
   element becomes inline text. One marker only: the strip on the left edge of
   the selected area. */
.sidebar-list {
  display: flex; flex-direction: column; gap: 2px;
  padding: 10px 0; flex: 1; min-height: 0;
}
.sidebar-item {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  flex: none; height: 40px; padding: 0 12px 0 18px;
  background: transparent;
  border: 0; border-left: 2px solid transparent;
  color: var(--text-mid); cursor: pointer; text-align: left;
  font-family: var(--font-body); font-weight: 600; font-size: var(--fs-base);
  letter-spacing: 0; text-transform: none;
  transition: background .14s ease, color .14s ease;
}
.sidebar-item:hover { background: rgba(214, 235, 255, .05); color: var(--text); }
.sidebar-item[aria-current="page"] {
  background: var(--accent-soft);
  border-left-color: var(--accent);
  color: var(--text);
  padding-left: 16px;
}
.sidebar-icon { display: inline-flex; flex: none; }
.sidebar-item[aria-current="page"] .sidebar-icon { color: var(--accent); }
.sidebar-item[data-admin="1"] .sidebar-icon { opacity: .8; }

/* The line separating the field areas from the admin tools. */
.sidebar-divider {
  height: 1px; margin: 8px 14px;
  background: var(--line); flex: none;
}

/* On the expanded rail the name is inline text. */
.sidebar-name {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* On the collapsed rail the same element becomes a bubble to the right of
   the icon. The rail is narrow, so the bubble spills outside it — which is
   why the container does not clip overflow and the bubble stays on top. */
.sidebar[data-wide="0"] .sidebar-name {
  position: absolute; left: calc(100% + 9px); top: 50%;
  z-index: 40;
  padding: 5px 10px;
  background: var(--panel);
  border: 1px solid var(--line-strong);
  box-shadow: 0 8px 24px rgba(6, 10, 13, .45);
  color: var(--text); font-size: var(--fs-base);
  opacity: 0; pointer-events: none;
  transform: translateY(-50%) translateX(-5px);
  transition: opacity .13s ease, transform .13s ease;
}
.sidebar[data-wide="0"] .sidebar-item:hover .sidebar-name,
.sidebar[data-wide="0"] .sidebar-item:focus-visible .sidebar-name {
  opacity: 1;
  transform: translateY(-50%) translateX(0);
}

/* The button that expands and collapses the rail sits at the bottom: not
   something used, a preference set once. */
.sidebar-expand {
  display: flex; align-items: center; justify-content: center;
  flex: none; height: 34px;
  background: transparent;
  border: 0; border-top: 1px solid var(--line);
  color: var(--text-dim); cursor: pointer;
}
.sidebar-expand:hover { color: var(--text); background: rgba(214, 235, 255, .05); }
.sidebar-expand-icon {
  display: inline-flex;
  transition: transform .18s ease;
}
.sidebar[data-wide="1"] .sidebar-expand-icon { transform: rotate(180deg); }

@media (prefers-reduced-motion: reduce) {
  .sidebar-name, .sidebar-expand-icon { transition: none; }
}

/* ──────────────────────────────────────────────────────── overview ─── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px; margin-top: 20px;
}
/* The tile is clickable: it leads to the device list behind the number.
   Because it is a button, the browser defaults are reset here. */
.kpi {
  position: relative;
  width: 100%;
  display: block;
  border: 1px solid var(--line);
  background: transparent;
  padding: 13px 16px 14px;
  color: inherit; font: inherit; text-align: left;
  cursor: pointer;
}
.kpi:hover { border-color: var(--line-strong); background: rgba(214, 235, 255, .03); }
.kpi:focus-visible { outline-offset: -2px; }
.kpi .name {
  font-family: var(--font-body); font-size: var(--fs-sm); font-weight: 600;
  letter-spacing: .01em; color: var(--text-mid); text-transform: none;
}
.kpi .value-wrap {
  margin-top: 9px; display: flex; align-items: baseline; gap: 7px;
}
.kpi .value {
  font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-3xl); line-height: 1;
}
.kpi .unit { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text-mid); }
.kpi .bar { margin-top: 12px; }

.overview-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  gap: 18px; margin-top: 22px; align-items: start;
}
@media (max-width: 1080px) {
  .overview-grid { grid-template-columns: 1fr; }
}

.category-row {
  width: 100%;
  min-height: 46px;
  display: grid;
  /* The bar has a maximum width: on a wide screen that falls to one column,
     a strip running the full page width made the row's number easy to miss. */
  grid-template-columns: minmax(0, 1fr) minmax(80px, 320px) 62px;
  align-items: center; gap: 16px;
  padding: 11px 4px;
  background: transparent;
  border: 0; border-bottom: 1px solid rgba(214, 235, 255, .09);
  color: var(--text); cursor: pointer; text-align: left;
}
.category-row:hover { background: rgba(214, 235, 255, .04); }
.category-row .name {
  font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-md);
  letter-spacing: 0; text-transform: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.category-row .bar { height: 6px; background: rgba(214, 235, 255, .1); display: block; }
.category-row .bar > i { display: block; height: 6px; }
@media (max-width: 620px) {
  .category-row { grid-template-columns: 1fr auto; }
  .category-row .bar { display: none; }
}

/* Next steps: each row carries one task and the button that does it. */
.step-row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: start; gap: 10px;
  padding: 11px 0; border-bottom: 1px solid var(--line-soft);
}
.step-row > .dot { margin-top: 5px; }
.step-row .text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.step-row .name { font-size: var(--fs-base); color: var(--text-bright); line-height: 1.4; }
/* The running scan's progress, inside a check-summary row. A bar rather
   than a sentence: the page subtitle above already says how far the sweep
   has got, and the same words twice on an otherwise empty screen read as a
   fault rather than as waiting. Thicker than the shared 3px bar because
   here it is the row's subject, not a footnote to a number. */
.scan-progress { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
.scan-progress .bar { flex: 1; min-width: 0; height: 6px; }
.scan-progress .bar > i { height: 6px; }

.step-footer {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding-top: 11px;
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
}

.summary-row {
  display: grid; grid-template-columns: 1fr auto;
  align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid var(--line-soft);
}
.summary-row .left { display: flex; align-items: center; gap: 9px; min-width: 0; }
.summary-row .left span:last-child { font-size: var(--fs-base); color: var(--text-bright); }
.summary-row .value { font-family: var(--font-mono); font-size: var(--fs-sm); }

/* ─────────────────────────────────────────────────── configuration ── */
/* Shared settings run full width with the fields in several columns; the
   selected device's table sits below. The old narrow side panel made the
   fields an unnecessarily long list and left a large gap to its right on a
   narrow screen. */
.cfg-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px; margin-top: 18px; align-items: start;
}
.cfg-group-card {
  display: grid;
  grid-template-columns: repeat(3, minmax(210px, 1fr));
  gap: 9px 12px;
}
.cfg-group-card > h3,
.cfg-group-card > .cfg-section,
.cfg-group-card > .cfg-defaults,
.cfg-group-card > p { grid-column: 1 / -1; }
.cfg-group-card .setting-row { margin: 0; }
.cfg-field { width: 132px; }
/* An inherited value: it is in the box but the user did not type it — it
   comes from DeviceMap or from the group. It has to be distinguishable from
   an entered value, or the user thinks they typed it. */
/* The card footer: the saved state and the reset. */
.cfg-defaults {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; flex-wrap: wrap;
  margin-top: 16px; padding-top: 12px;
  border-top: 1px solid var(--line);
}
.cfg-saved-note {
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  line-height: 1.45;
}
.cfg-inherited { color: var(--text-mid); font-style: italic; }
.cfg-inherited:focus-visible { color: var(--text); font-style: normal; }
/* Section heading: on the UIC a list of 20+ fields is unreadable without one. */
.cfg-section {
  margin: 16px 0 2px;
  font-family: var(--font-heading); font-size: var(--fs-xs); font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; color: var(--text-mid);
  border-bottom: 1px solid var(--line); padding-bottom: 5px;
}
.cfg-group-card .cfg-section:first-of-type { margin-top: 12px; }
.cfg-device-area { min-width: 0; }
.cfg-device-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px; flex-wrap: wrap;
}

/* Devices are listed, not selected: clicking a row opens that device's
   settings window (see config.openDevice). */
.cfg-device-list { display: flex; flex-direction: column; }
.cfg-device-item {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto 12px;
  align-items: center; gap: 10px;
  width: 100%; padding: 10px 12px;
  background: transparent;
  border: 1px solid var(--line); border-bottom: 0;
  color: var(--text); cursor: pointer; text-align: left;
  transition: background .14s ease, border-color .14s ease;
}
.cfg-device-item:last-child { border-bottom: 1px solid var(--line); }
.cfg-device-item:hover { background: rgba(214, 235, 255, .04); }
.cfg-device-item[data-open="1"] {
  background: var(--accent-soft); border-color: var(--accent-line);
}
.cfg-item-name { font-size: var(--fs-base); }
.cfg-item-ip { font-size: var(--fs-sm); }
.cfg-item-chevron { color: var(--text-dim); font-size: var(--fs-md); line-height: 1; }

/* The device window: settings are edited in a centred dialog and applied to
   that device only. */
.cfg-window-body { display: flex; flex-direction: column; gap: 10px; }
.cfg-window-note {
  font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text-mid);
}
.cfg-window-body .table-wrap { margin-top: 0; }

@media (max-width: 900px) {
  .cfg-group-card { grid-template-columns: repeat(2, minmax(210px, 1fr)); }
}
@media (max-width: 620px) {
  .cfg-group-card { grid-template-columns: minmax(0, 1fr); }
  .cfg-device-item { grid-template-columns: auto minmax(0, 1fr) 12px; }
  .cfg-item-ip { display: none; }
}

/* ─────────────────────────────────────────────────────── MQTT stream ── */
.mqtt-grid {
  display: grid;
  grid-template-columns: minmax(0, 280px) minmax(0, 1fr);
  gap: 18px; margin-top: 18px; align-items: start;
}
@media (max-width: 900px) { .mqtt-grid { grid-template-columns: 1fr; } }

/* Prefixed with the screen it belongs to. Plain `.feed` collided with the
   `feed` STATE token of the port map (`.pm-port.feed`, `.pm-sample.feed`):
   the legend's "powering" swatch matched this rule too and came out as a
   9px-wide, 320px-tall bordered box. */
.mqtt-feed {
  border: 1px solid var(--line); background: var(--deep);
  padding: 14px 16px 16px; min-height: 320px;
  max-height: 60vh; overflow: auto;
}
.mqtt-feed-row {
  display: grid; grid-template-columns: 74px minmax(120px, 190px) minmax(0, 1fr);
  gap: 11px; padding: 5px 0;
  font-family: var(--font-mono); font-size: var(--fs-sm); line-height: 1.5;
}
.mqtt-feed-row .body {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--text-bright); display: block; min-width: 0;
}

/* ───────────────────────────────────────────────────────── admin ────── */
.project-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px; margin-top: 18px;
}
.admin-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 320px);
  gap: 18px; margin-top: 20px; align-items: start;
}
@media (max-width: 1080px) { .admin-grid { grid-template-columns: 1fr; } }

/* ─────────────────────────────────────────────────── firmware install ── */
/* The image is chosen per device: every row has its own path and version
   box. The bulk field at the top is a convenience only — its value is written
   into the rows. */
.fw-bulk { margin-top: 16px; padding: 16px 18px 14px; }
.fw-bulk-head p {
  margin: 5px 0 0;
  color: var(--text-mid); font-size: var(--fs-sm); line-height: 1.45;
}
.fw-bulk-fields {
  display: flex; align-items: flex-end; gap: 12px;
  flex-wrap: wrap; margin-top: 12px;
}
.fw-bulk-fields label { display: block; }
.fw-bulk-fields .label { display: block; margin-bottom: 5px; }
.fw-field-narrow { flex: 0 1 150px; }

/* The file cell in a row: name + select/remove. The name is clipped and the
   full path lives in the tooltip — the path does not fit the row and is never
   typed by hand. */
.fw-file {
  display: flex; align-items: center; gap: 7px; min-width: 0;
  font-size: var(--fs-sm);
}
.fw-file > span { flex: 1; min-width: 0; }
.fw-pick-btn { flex: none; padding: 3px 9px; font-size: var(--fs-sm); }
.fw-file .btn-close { width: 20px; height: 20px; }

/* The row inputs sit inside the table cell: they must not grow the row
   height, or a 15-device list no longer fits the screen. */
.fw-row .field {
  min-height: 0; padding: 5px 8px;
  font-size: var(--fs-sm); background: var(--deep);
}
.fw-row .field:disabled { color: var(--text-dim); cursor: not-allowed; }
.fw-device {
  display: flex; align-items: center; gap: 8px; min-width: 0;
}
.fw-state { font-size: var(--fs-sm); color: var(--text-mid); }
/* A row with a file selected is read from the strip on the left, so "which
   ones are ready" is visible without going through the list. */
.fw-row[data-selected="1"] { box-shadow: inset 3px 0 0 var(--accent); }
/* The list of what a write is about to touch, inside its confirmation.
   Named for the component rather than the screen: every confirmation shows
   the same thing (see components/confirm.js). The old `.fw-confirm-list`
   name is kept alongside it — the firmware screen's markup predates the
   shared component and reads the same. */
.confirm-list, .fw-confirm-list {
  margin-top: 10px; max-height: 240px; overflow-y: auto;
  font-family: var(--font-mono); font-size: var(--fs-sm);
}
.confirm-list .row, .fw-confirm-list .row {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 4px 0; border-bottom: 1px solid var(--line-soft);
}
.confirm-list .row b,
.fw-confirm-list .row b { color: var(--accent); font-weight: 500; }

/* The devices screen's search box, beside the state filter. `type=search`
   for the browser's own clear button — a field that filters a list wants a
   one-click way back to the whole list. */
.device-head-actions {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.device-search { width: min(280px, 42vw); }

/* How many rows are selected, and the way out of the selection. Only drawn
   when there IS one, so it does not compete with the search box on the
   ordinary visit; it reads like the switch screen's selection strip because
   it is the same act. */
.device-selection {
  display: flex; align-items: center; gap: 8px;
  padding-right: 12px;
  border-right: 1px solid var(--line);
  color: var(--accent);
  font-family: var(--font-mono); font-size: var(--fs-xs);
}

/* A sortable column heading. The heading text and the arrow are one button,
   and the arrow only appears on the column actually in use — an arrow on
   every heading reads as decoration rather than as state. */
.sort-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 0; border: 0; background: none;
  font: inherit; color: inherit; letter-spacing: inherit;
  text-align: left; cursor: pointer;
}
.sort-btn:hover { color: var(--text-bright); }
.sort-btn[aria-pressed="true"] { color: var(--accent); }
.sort-mark { font-size: var(--fs-xs); line-height: 1; }

.overview-column { display: flex; flex-direction: column; gap: 18px; }

/* The answer to "is the network ready", at the top of its own screen. */
.net-readiness {
  display: inline-flex; align-items: center; gap: 8px; flex: none;
  padding: 6px 12px;
  border: 1px solid var(--line-strong);
  font-size: var(--fs-sm);
}
.net-readiness[data-state="ok"] { border-color: var(--ok-soft); }
.net-readiness[data-state="auth"] { border-color: var(--auth-soft); }
.net-readiness[data-state="failed"] { border-color: var(--failed-soft); }

/* ─────────────────────────────────────────────────────── checklist ─── */
/* Every column of the template sits side by side; the table scrolls
   horizontally inside itself and the page body does not. */
.na-cell {
  /* An empty grey cell: "not used on this device type". No text is written;
     the ground carries the meaning (see the legend). */
  background: #2a3339;
  height: 14px;
  align-self: center;
  display: block;
}

/* The row's state is also read from the strip on its left. An inset shadow
   rather than a border: nothing thickens, so its alignment with the header
   row does not drift. */
#v-checklist .table-row[data-state] {
  box-shadow: inset 3px 0 0 var(--state-colour);
}

/* ──────────────────────────────────── shared local navigation ────── */
/* The main menu chooses the context; these tabs only change the view of the
   open area. The underline shows the selection without suggesting a sequence
   of steps. */
.local-tabs,
.action-tab-list {
  display: flex;
  align-items: center;
  gap: 22px;
  min-width: 0;
  overflow-x: auto;
  border-bottom: 1px solid var(--line);
}
.local-tabs { margin: 4px 0 16px; }
.action-tabs { margin: 2px 0 18px; }
.local-tab,
.action-tab {
  position: relative;
  flex: none;
  min-height: 39px;
  padding: 7px 1px 9px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--text-mid);
  cursor: pointer;
  font-family: var(--font-body);
  font-size: var(--fs-md);
  font-weight: 600;
  white-space: nowrap;
  transition: color .16s ease, border-bottom-color .2s ease;
}
.local-tab:hover,
.action-tab:hover { color: var(--text); }
.local-tab[aria-selected="true"],
.local-tab[aria-pressed="true"],
.action-tab.active,
.action-tab[data-active="1"] {
  border-bottom-color: var(--accent);
  color: var(--text);
}

/* The tab transition: the new screen must not swap in within a single frame.
   The heading and the tab strip stay put, so without this the change went
   unnoticed. app.js retriggers the animation on every screen change. */
@keyframes view-transition {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: none; }
}
.view.view-enter { animation: view-transition .2s ease-out both; }
@media (prefers-reduced-motion: reduce) {
  .view.view-enter { animation: none; }
  .local-tab, .action-tab { transition: none; }
}

/* ────────────────────────────────────── descriptions and empty states ─ */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 5px;
  min-height: 92px;
  margin-top: 14px;
  padding: 22px;
  border: 1px dashed var(--line-strong);
  background: rgba(214, 235, 255, .015);
  color: var(--text-mid);
  font-size: var(--fs-base);
  line-height: 1.5;
}
.empty-state strong { color: var(--text); font-size: var(--fs-md); }
.empty-state-success {
  border-color: var(--ok-soft);
  background: rgba(63, 185, 80, .035);
}
.empty-state-success strong { color: var(--ok); }

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-top: 24px;
}
.section-head p {
  max-width: 720px;
  margin: 5px 0 0;
  color: var(--text-mid);
  font-size: var(--fs-base);
  line-height: 1.5;
}

/* The raw source text in the device detail is kept apart from the ordinary
   information. */
.tech-detail {
  margin-top: 20px;
  border-top: 1px solid var(--line);
  color: var(--text-mid);
}
.tech-detail > summary {
  padding: 12px 0;
  cursor: pointer;
  font-size: var(--fs-base);
  font-weight: 600;
}
.tech-detail[open] > summary { color: var(--text); }

/* ──────────────────────────────────── verification and reports ──── */
.report-tabs { margin-top: 2px; }
.check-summary-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(155px, 1fr));
  gap: 10px;
}
/* Two rows, not three: the explanation under each number is gone, and the
   108px this used to reserve for it left the cards standing on dead space.
   The one card that still carries a line (how many devices are in scope —
   a count, not an explanation) puts it in an implicit third row. */
.check-summary-card {
  display: grid;
  grid-template-rows: auto auto;
  align-content: start;
  gap: 5px;
  min-height: 84px;
  padding: 13px 15px;
  border: 1px solid var(--line);
  background: var(--panel);
}
.check-summary-card .name {
  color: var(--text-bright);
  font-size: var(--fs-base);
  font-weight: 600;
}
.check-summary-card strong {
  font-family: var(--font-heading);
  font-size: var(--fs-2xl);
  line-height: 1;
}
.check-summary-card .note {
  align-self: end;
  color: var(--text-dim);
  font-size: var(--fs-sm);
}
/* A floor, not a height: a long finding still wraps onto a second line. The
   number matches the row height of every other table in the panel — the 48px
   it used to be came from the cells being two size steps larger than the
   device list beside it. */
.check-deviation-row { min-height: 39px; }
.device-summary {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.deviation-text {
  color: var(--text-bright);
  font-size: var(--fs-base);
  line-height: 1.45;
}
/* A device with nothing wrong is listed too, so that "everything here was
   checked" is visible; it is not the row anyone is looking for, so it does
   not read as loudly as a finding. */
.deviation-text[data-passed="1"] { color: var(--ok-text); }

@media (max-width: 900px) {
  .check-summary-grid { grid-template-columns: repeat(2, minmax(155px, 1fr)); }
}
@media (max-width: 620px) {
  .local-tabs,
  .action-tab-list { gap: 16px; }
  .check-summary-grid { grid-template-columns: minmax(0, 1fr); }
  .check-summary-card { min-height: 94px; }
  .section-head { align-items: flex-start; }
}

/* ─────────────────────────────────────────── the computer's network ──── */
/* The rows follow the technical card on the IP screen: label on the left,
   value right-aligned and monospaced, a hairline between them. Same shape,
   because they answer the same kind of question. */
.net-card { display: flex; flex-direction: column; gap: 2px; }
.net-card + .net-card { margin-top: 14px; }
.net-card > .eyebrow { margin: 9px 0 3px; }

.net-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line-soft);
  color: var(--text-mid);
  font-size: var(--fs-base);
}
.net-row:last-child { border-bottom: none; }
.net-row > b {
  max-width: 60%;
  color: var(--text-bright);
  font-size: var(--fs-sm);
  font-weight: 400;
  text-align: right;
  overflow-wrap: anywhere;
}

.net-label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.net-hint { color: var(--text-dim); font-size: var(--fs-sm); line-height: 1.4; }
.net-note {
  margin: 6px 0 0;
  color: var(--text-dim);
  font-size: var(--fs-sm);
  line-height: 1.5;
}

.net-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.net-card > .net-actions { margin-top: 14px; }

.net-input {
  padding: 5px 9px;
  border: 1px solid var(--line-strong);
  background: var(--panel-2);
  color: var(--text-bright);
  font-family: var(--font-mono);
  font-size: var(--fs-base);
  max-width: 260px;
}
.net-input[type="number"] { width: 90px; text-align: right; }
.net-accent { color: var(--accent); }

@media (max-width: 620px) {
  .net-row { align-items: flex-start; flex-direction: column; gap: 6px; }
  .net-row > b { max-width: 100%; text-align: left; }
}

/* The panel could not tell which adapter reaches the devices and is asking.
   Marked like a prompt, not like an error: nothing is broken, it just has a
   question that one click answers. */
.net-ask { border-color: var(--accent); }
.net-ask > .eyebrow { color: var(--accent); font-size: var(--fs-base); }

/* ─────────────────────────────────────────────────────────── ADB screen ── */
/* The bench tool. Cards down the page, in the order the work is done — the
   address list, the application, what to do to it, what to put on it, this
   computer's daemon, and what happened — rather than side by side. They used
   to be three, with the last one holding everything that was not a list; it
   was the card nobody could read. */

.adb-pool { margin-top: 16px; }
.adb-packages, .adb-actions, .adb-install,
.adb-server, .adb-status { margin-top: 16px; }

.adb-add { margin-top: 12px; }
.adb-add-fields { display: flex; gap: 8px; flex-wrap: wrap; }
.adb-ip-field { font-family: var(--font-mono); }

/* A text box with its name in front of it instead of inside it (see
   views/adb/fields.js). The tag and the box share one outline: the tag takes
   the left border and the box drops its own, so the pair reads as a single
   control rather than as a word that happens to sit near a field. */
.adb-field { display: flex; align-items: stretch; flex: 1 1 200px; min-width: 0; }
.adb-field-tag {
  display: flex; align-items: center; white-space: nowrap;
  padding: 0 10px;
  border: 1px solid var(--line-strong); border-right: 0;
  background: var(--panel);
  font-family: var(--font-body); font-size: var(--fs-sm); font-weight: 600;
  color: var(--text-mid);
}
.adb-field .field { flex: 1 1 auto; width: auto; min-width: 0; }

.adb-pool-tools {
  display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px;
}

/* The selectable row. `button.table-row[aria-selected="true"]` already paints
   the selected background; the row here is a div because it CONTAINS two
   buttons (the tick and the remove), and a button inside a button is not
   valid markup. So the selected background is repeated for this one case. */
.adb-row[data-selected="1"] { background: var(--accent-soft); }
.adb-tick {
  width: 22px; height: 22px; padding: 0; justify-content: center;
  border-color: var(--line);
}
.adb-row .btn-small { justify-self: start; }
/* The row's own buttons: restart this display, forget this address. */
.adb-row-actions { display: flex; gap: 6px; justify-self: start; }

.adb-search { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.adb-keyword { min-width: 0; }

.adb-package-list {
  display: flex; flex-direction: column; gap: 6px; margin-top: 12px;
}
.adb-package { align-items: flex-start; }
.adb-package .box { margin-top: 4px; }
.adb-package-text {
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
/* Found everywhere / found on some. The second is the whole reason the search
   answers per device (see views/adb/packages.js), so it is marked. */
.adb-package-note { color: var(--text-mid); font-size: var(--fs-sm); }
.adb-package-warn { color: var(--auth-text); font-size: var(--fs-sm); }

.adb-op-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.adb-op-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 0; border-top: 1px solid var(--line-soft);
  margin-top: 12px;
}
.adb-op-row > .label { flex: 0 0 140px; }
.adb-op-row > .mono, .adb-op-row > .adb-op-empty { flex: 1 1 160px; min-width: 0; }
.adb-op-empty { color: var(--text-dim); font-size: var(--fs-sm); }
/* A verdict the operator has to do something about. Amber rather than red:
   the autostart being absent or unparsed is a job to finish, not a fault in
   the device. */
.adb-op-row > .adb-op-bad {
  flex: 1 1 160px;
  min-width: 0;
  color: var(--auth-text);
  font-size: var(--fs-sm);
}
/* What the generated boot script logged, under its row. Monospaced and
   scrollable: these are the device's own words and are worth nothing
   reflowed. */
.adb-autostart-log {
  margin: 4px 0 0 140px;
  padding: 8px 10px;
  border-left: 2px solid var(--line);
  max-height: 150px;
  overflow-y: auto;
}
.adb-autostart-log p {
  margin: 2px 0;
  font-size: var(--fs-sm);
  color: var(--text-dim);
}

.adb-run-state { font-size: var(--fs-sm); }
.adb-run-row[data-state="ok"] .adb-run-state { color: var(--ok-text); }
.adb-run-row[data-state="failed"] .adb-run-state { color: var(--failed-text); }
.adb-run-row[data-state="unknown"] .adb-run-state {
  color: var(--unknown-text);
}
.adb-run-row[data-state="failed"] { box-shadow: inset 3px 0 0 var(--failed); }

/* The log of what has finished (views/adb/status.js). TWENTY ROWS AND THEN IT
   SCROLLS: a bench afternoon is a hundred lines, and a card that grows to
   hold all of them pushes everything else off the screen — including the
   buttons that write the next line. The header row is sticky, so scrolling
   does not leave six unlabelled columns. */
.adb-log-head {
  display: flex; align-items: baseline; gap: 10px;
  margin: 18px 0 0; padding-top: 12px;
  border-top: 1px solid var(--line);
}
.adb-log-head .spacer { flex: 1; }
.adb-log-count { font-size: var(--fs-sm); color: var(--text-dim); }
.adb-log {
  /* One row is 9px of padding twice, a 20px line and a 1px border; the extra
     row is the header sitting on top of them. */
  --adb-log-row: 40px;
  max-height: calc(21 * var(--adb-log-row));
  overflow-y: auto;
}

@media (max-width: 620px) {
  .adb-op-row > .label { flex: 1 1 100%; }
  .adb-autostart-log { margin-left: 0; }
  /* Half the screen is not worth a log on a phone-width window. */
  .adb-log { max-height: calc(11 * var(--adb-log-row)); }
}

/* static/css/ip.css */
/* The IP assignment screen: the switch front panel, the run
   settings card and the assignment plan.

   Split out of views.css because it was more than half of it. No
   selector here appears in views.css, so loading this file after it
   changes nothing in the cascade. */

#v-ip { max-width: 1580px; margin: 0 auto; }

/* The heading and the action stack on the right align at the top. With
   `flex-end` the heading dropped below a two-line action column and no longer
   sat on the same line as the headings of the other operation screens. */
.ip-page-head {
  align-items: flex-start;
  margin-bottom: 0;
  padding-top: 2px;
}

/* The run's action, at the foot of the form it belongs to. The readiness line
   sits with it: "why is this button disabled" and the button are one thing.

   It used to be `position: sticky; bottom: 0`, which pinned it to the bottom
   of the viewport while the card scrolled — and a bottom-pinned bar covers
   whatever is behind it. On this card that was the addressing rows and the
   job summary: the bar floated in the MIDDLE of the form, looking like a
   divider and hiding the very lines ("target", "mask to assign") the operator
   is about to act on. The form now ends where the button is. */
.ip-action-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-top: 4px;
  padding: 12px 18px;
  border-top: 1px solid var(--line);
  background: var(--panel);
}
.ip-action-bar .ip-start-btn { flex: none; }

/* The way out of the one error this screen cannot fix. */
.ip-network-link { align-self: flex-start; margin-top: -4px; }
.ip-readiness {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-mid);
}
.ip-readiness i {
  width: 6px; height: 6px;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(66, 148, 224, .09);
}
.ip-readiness[data-state="ready"] i {
  background: var(--ok);
  box-shadow: 0 0 0 3px rgba(63, 185, 80, .09);
}
.ip-readiness[data-state="error"] { color: var(--danger-text); }
.ip-readiness[data-state="error"] i {
  background: var(--failed);
  box-shadow: 0 0 0 3px rgba(218, 54, 51, .1);
}
.ip-start-btn {
  min-height: 40px;
  padding: 9px 19px;
  box-shadow: 0 8px 22px rgba(6, 10, 13, .24);
}
.ip-empty-state {
  min-height: 88px;
  margin-top: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
}
.ip-loading > i {
  width: 13px; height: 13px;
  border: 1px solid var(--line-strong);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: ip-spin .75s linear infinite;
}
@keyframes ip-spin { to { transform: rotate(360deg); } }

/* One run panel on the left, the front panels of the two switches stacked on
   its right. The right column is as wide as a panel; the run panel takes what
   is left. */
.ip-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 480px;
  gap: 24px;
  margin-top: 24px;
  align-items: start;
}
.ip-panel-area { min-width: 0; }

.ip-section-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}
.ip-section-title {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  min-width: 0;
}
.ip-section-head h3 { margin-top: 1px; }
.ip-section-head p,
.ip-card-head p {
  margin: 5px 0 0;
  color: var(--text-mid);
  font-size: var(--fs-sm);
  line-height: 1.45;
}
.ip-section-count {
  flex: none;
  padding: 4px 7px;
  border: 1px solid var(--line);
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  text-transform: uppercase;
}

/* The settings card has three clear layers: targets, protections, summary. */
.ip-settings-card {
  position: sticky;
  top: 8px;
  min-width: 0;
  padding: 0;
  background:
    linear-gradient(145deg, rgba(66, 148, 224, .035), transparent 42%),
    var(--panel);
}
.ip-card-head {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 17px 19px;
  border-bottom: 1px solid var(--line);
  background: rgba(214, 235, 255, .018);
}
.ip-card-head h3 { margin-top: 1px; }
.ip-form-section,
.setting-section {
  min-width: 0;
  margin: 0;
  border: 0;
}
.ip-switch-picker-area {
  padding: 18px 19px;
  border-bottom: 1px solid var(--line);
}
.ip-switch-picker-area > .label { display: block; margin-bottom: 7px; }
.ip-switch-picker-area > .field { width: 100%; }
.ip-port-area { padding: 18px 19px; }
.ip-field-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 7px;
}
.ip-field-count {
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
.ip-settings-card .field {
  min-height: 39px;
  background: var(--deep);
}
.ip-settings-card #port-warning { margin: 7px 0 0; }
.ip-field-help {
  margin: 7px 0 0;
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  line-height: 1.5;
}

.setting-section {
  padding: 18px 19px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ip-sub-head { margin-bottom: 3px; }
.ip-sub-head p {
  margin: 5px 0 0;
  color: var(--text-mid);
  font-size: var(--fs-sm);
  line-height: 1.45;
}
.setting-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  min-height: 45px;
  padding: 7px 9px;
  border: 1px solid var(--line-soft);
  background: rgba(11, 17, 22, .34);
}
.setting-row:hover { border-color: var(--line); }
.setting-row .label {
  margin: 0;
  color: var(--text-mid);
  line-height: 1.4;
}
.setting-row select.field { width: auto; min-width: 138px; max-width: 180px; }
.ip-medium-field { width: 148px; }
.ip-field-error {
  margin: -2px 0 2px;
  padding: 0 9px;
  color: var(--danger-text);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  line-height: 1.45;
}

/* Both `.ip-field-help[data-state=...]` rules were removed: nothing sets a
   data-state on that class, so neither ever matched. The evidence line's
   colour comes from the element it is rendered next to. */

.setting-summary {
  margin: 0;
  padding: 17px 19px 19px;
  border-top: 1px solid var(--line);
  background: rgba(11, 17, 22, .28);
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  line-height: 1.55;
}
.ip-ready-badge {
  border-color: var(--ok-soft);
  color: var(--ok);
}
.ip-waiting-badge { border-color: var(--auth-soft); color: var(--auth); }
.ip-error-badge { border-color: var(--failed-soft); color: var(--danger-text); }
.ip-run-error {
  margin: 0 0 8px;
  padding: 7px 8px;
  border-left: 2px solid var(--failed);
  background: rgba(218, 54, 51, .06);
  color: var(--danger-text);
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  line-height: 1.45;
}
