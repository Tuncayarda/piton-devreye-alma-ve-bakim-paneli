<style>
/* static/css/base.css */
/* Commissioning and Maintenance Panel — tokens, reset and skeleton layout.
   The colours and typography come from the design file; this is their single
   source. */

:root {
  /* ground layers */
  --bg: #0e1317;
  --panel: #151d24;
  --panel-2: #111a20;
  --deep: #0b1116;
  /* OPAQUE LIFTS — a row's hover, and a table head that sits above its
     rows. These cannot be a translucent `--raise-*`: the row already paints
     a ground of its own, so a raise would replace it rather than sit on it.
     Two steps, and there were five hand-mixed greys inside four of them. */
  --lift-1: #17212a;
  --lift-2: #1a232b;

  /* accent and text
     ────────────────
     EVERY VALUE BELOW THAT CARRIES TEXT REACHES 4.5:1 on --bg and --panel.
     It is measured, not judged by eye, and `tests/test_frontend.py` fails the
     build if one of them drops under. The panel is read standing up in a
     depot, so this is a field requirement rather than a formality.

     --text-dim used to be #5d7185 (3.38:1) and is the most widely used
     secondary colour in the app — timestamps, hints, the footer, the "last
     scan" line — almost always at the smallest size. */
  --accent: #4294E0;
  /* The accent one step brighter, for the primary button under the pointer. */
  --accent-hover: #59a3e8;
  --text: #e6edf3;
  --text-bright: #a9bacb;
  --text-mid: #7f93a6;
  --text-dim: #71879c;
  /* Never used for text: two decorative fills only (see ip.css). */
  --text-faint: #3d4c5a;
  --brand: #8fa3b5;

  /* state colours — the green/amber/red/grey set.
     These paint dots, borders and port graphics, where contrast against the
     ground matters less than telling the four states apart. Red and grey are
     too dark to READ, so the same states have their own text values below and
     the two must not be swapped. */
  --ok: #3fb950;
  --auth: #d29922;
  --failed: #da3633;
  --unknown: #3d4c5a;
  /* Darker than "unknown", and not a state at all: the ground of a cell that
     does not apply to this device type, and the scrollbar thumb. Nothing to
     find out here, as opposed to nothing found out yet. */
  --inert: #2a3339;

  /* the same states, as text. Green and amber already pass, so they point at
     the fill value and stay one colour; red and grey do not. */
  --ok-text: var(--ok);
  --auth-text: var(--auth);
  --failed-text: #e05c59;
  --unknown-text: var(--text-dim);
  /* The softer red of error sentences and invalid-field warnings — a whole
     paragraph in --failed-text reads as an alarm. */
  --danger-text: #e8817f;

  /* THE SURFACE RAMP — one light, three jobs.
     ─────────────────────────────────────────
     Everything that is not a state colour is this one value at some alpha:
     #d6ebff, the light the panel is lit by. There were fifteen alphas of it
     loose in the stylesheets and three of them were tokens, so two cards
     could carry different borders and nobody could say why. Fifteen became
     nine, and the nine are grouped by WHAT THEY DO, because that is the
     question somebody has when they come looking:

       --raise-*  a ground lifted off the one behind it (hover, a card head)
       --line-*   a border
       --glyph-*  a stroke or a fill inside a drawing (the port faceplate)

     Three steps each, and there is no fourth. `tests/test_frontend.py`
     rejects a bare rgba() anywhere outside this file. */
  --raise-1: rgba(214, 235, 255, .03);
  --raise-2: rgba(214, 235, 255, .06);
  --raise-3: rgba(214, 235, 255, .10);

  --line-soft: rgba(214, 235, 255, .07);
  --line: rgba(214, 235, 255, .14);
  --line-strong: rgba(214, 235, 255, .22);
  --line-corner: #6b8299;

  --glyph-soft: rgba(214, 235, 255, .28);
  --glyph: rgba(214, 235, 255, .40);
  --glyph-strong: rgba(214, 235, 255, .62);

  /* PAPER — the one surface not lit by the panel's own light.
     A QR code is drawn in black on white with a white margin around it, and
     both are part of the code: a quiet zone tinted to match its surroundings
     is a quiet zone a camera never finds. So this is white, in every theme,
     and it is a token rather than a literal only so that the rule holds —
     colours are chosen here (see components.css, .remote-qr). */
  --paper: #ffffff;

  /* THE STATE TINTS — the same ladder for every state colour.
     ────────────────────────────────────────────────────────
     A state colour is asked to do five things and they were being written
     out at whatever alpha looked right at the time — the accent alone had
     twelve. The steps here are the five jobs:

       --*-sheen  a tint nobody is meant to notice (a gradient, a hover)
       --*-wash   a ground behind words
       --*-edge   a quiet border, or the fill of a legend sample
       --*-line   a border that has to read as the colour
       --*-glyph  a stroke in a drawing, or a pulse

     Each colour declares only the steps it uses. */
  --accent-sheen: rgba(66, 148, 224, .06);
  --accent-wash: rgba(66, 148, 224, .10);
  --accent-edge: rgba(66, 148, 224, .30);
  --accent-line: rgba(66, 148, 224, .45);
  --accent-glyph: rgba(66, 148, 224, .60);
  /* The far end of a pulse. Written out rather than `transparent` so the
     ring fades through its own colour instead of through grey. */
  --accent-clear: rgba(66, 148, 224, 0);

  --ok-sheen: rgba(63, 185, 80, .06);
  --ok-wash: rgba(63, 185, 80, .10);
  --ok-edge: rgba(63, 185, 80, .30);
  --ok-line: rgba(63, 185, 80, .45);

  --auth-wash: rgba(210, 153, 34, .10);
  --auth-line: rgba(210, 153, 34, .45);

  --failed-sheen: rgba(218, 54, 51, .06);
  --failed-wash: rgba(218, 54, 51, .10);
  --failed-edge: rgba(218, 54, 51, .30);
  --failed-line: rgba(218, 54, 51, .45);
  --failed-glyph: rgba(218, 54, 51, .60);

  /* The pins of a port that is off, and of one that is up with no power.
     The lighter red of `--failed-text`, because at this size the fill IS
     the message (see switch.css). */
  --pin-off: rgba(224, 92, 89, .55);
  --pin-unpowered: rgba(224, 92, 89, .88);

  /* DEPTH — what is behind something, and what falls below it.
     `--sunk-*` are grounds pressed INTO a card; `--drop-*` are the shadows
     things cast; `--scrim` is what covers the page behind a dialog. */
  --sunk-1: rgba(11, 17, 22, .30);
  --sunk-2: rgba(11, 17, 22, .42);
  --sunk-3: rgba(17, 26, 32, .62);
  --drop-soft: rgba(6, 10, 13, .24);
  --drop: rgba(6, 10, 13, .45);
  --drop-strong: rgba(6, 10, 13, .60);
  --scrim: rgba(6, 10, 13, .55);

  /* typography — the design fonts when installed, otherwise the system */
  --font-heading: "Barlow Condensed", "Oswald", "Avenir Next Condensed",
              "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", "Menlo", monospace;

  /* THE TYPE SCALE — the only place a font size is chosen.
     ─────────────────────────────────────────────────────
     There used to be 125 font-size declarations across 22 distinct values,
     from 9px to 32px, in half-pixel steps, plus 49 more written inline in
     JavaScript. Eleven of those steps sat inside five pixels, so they carried
     no meaning: nothing on screen told 11px apart from 11.5px, and the
     smallest text was too small to read at arm's length.

     Eight steps, in rem so the browser's zoom and the operating system's own
     text-size setting both work. The floor is 11px: below that this stops
     being a tool you can use standing up.

     `tests/test_frontend.py` rejects any font-size in px outside this block
     and any inline font-size in the JavaScript. */
  --fs-xs: 0.6875rem;    /* 11px — badges, units, timestamps */
  --fs-sm: 0.75rem;      /* 12px — table cells, notes, help text */
  --fs-base: 0.8125rem;  /* 13px — the everyday reading size */
  --fs-md: 0.9375rem;    /* 15px — body default, dialog prose */
  --fs-lg: 1.125rem;     /* 18px — h3, card titles */
  --fs-xl: 1.375rem;     /* 22px — h2 on a narrow window */
  --fs-2xl: 1.75rem;     /* 28px — h2 */
  --fs-3xl: 2rem;        /* 32px — the big KPI figures */

  /* THE SPACING SCALE — the only place a margin, padding or gap is chosen.
     ─────────────────────────────────────────────────────────────────────
     The type scale above had a gate on it from the start; spacing did not,
     and it showed: 23 distinct pixel values across the five stylesheets,
     with 9, 10 and 11 all in use for the same job. Spacing sets a screen's
     rhythm more than type size does, and every value picked by hand is one
     more screen that agrees with nothing.

     Seven steps and a hairline, each value in the old set folded into the
     nearest one. In px, not rem, on purpose: this is the geometry of the
     chassis — borders, faceplates, table rows — and it must not move when
     the browser's text size does. Type scales, the frame does not.

     `--sp-0` is the hairline rather than a step: the 1–2px nudge INSIDE a
     badge or between a port graphic and its number, where 4px would read as
     a gap. Nothing at page level should use it. There is no rung above
     `--sp-7` because nothing on any screen needs one; the moment something
     does, it is added here and not at the site.

     `tests/test_frontend.py` rejects any positive px in a margin, padding or
     gap outside this block. Negative values stay literal — a `-1px` clip or
     a `-2px` optical nudge is a correction, not rhythm. */
  --sp-0: 2px;
  --sp-1: 4px;
  --sp-2: 6px;
  --sp-3: 8px;
  --sp-4: 12px;
  --sp-5: 16px;
  --sp-6: 24px;
  --sp-7: 32px;

  /* THE TWO RAILS, AND THE THREE WIDTHS THE LAYOUT ANSWERS TO.
     ─────────────────────────────────────────────────────────
     Every screen that puts a column of controls beside its content used to
     pick its own rail width and its own moment to give up on it: 1.35fr,
     320px, 420px, 280px, collapsing at 900, 1080, 1081 and 1180. Narrowing
     the window slowly, the application fell to one column four separate
     times — which is what makes a layout feel accidental rather than laid
     out.

     Two rails. A screen takes the wide one if the rail carries a table or a
     drawing, the narrow one if it carries a list of controls.

     And three widths, because a rail collapses at the width ITS OWN KIND
     collapses at:

       1180 — a wide rail no longer fits beside the content
        900 — a narrow rail no longer fits
        620 — one column of anything, and the small-window rules

     Media queries cannot read a custom property, so those three numbers are
     written out at each site. They are the only three in the stylesheets;
     `tests/test_frontend.py` checks that no fourth appears. */
  --rail: 320px;
  --rail-wide: 420px;
  /* The side panel is a narrow rail that happens to be pinned to the window
     rather than to a screen, so it collapses with the narrow ones. Fixed on
     a wide window, because there it sets the content's width rather than the
     other way round (see app.js alignSidePanel, whose OVERLAY_PANEL_MAX is
     the 900 below). */
  --queue-width: var(--rail);
  --top-height: 50px;
  /* The footer carries the main-menu button too; at 30px it did not fit. */
  --footer-height: 36px;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--fs-md);
  line-height: 1.5;
  overflow: hidden;
}

h1, h2, h3, h4 {
  font-family: var(--font-heading);
  font-weight: 600;
  letter-spacing: 0;
  text-transform: none;
  line-height: 1.12;
  margin: 0;
}

h2 { font-size: var(--fs-2xl); }
h3 { font-size: var(--fs-lg); }
h4 { font-size: var(--fs-md); }

button { font: inherit; color: inherit; }
input, select { font: inherit; }

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
/* The content area is only a programmatic focus target (focus moves there
   on a screen change). It is not a keyboard-navigable element, so no ring is
   drawn — it showed up as one huge blue box at startup. */
#content:focus, #content:focus-visible { outline: none; }

/* "Skip to content" — the first thing Tab reaches. Off-screen until it has
   focus, because the alternative for a keyboard user is walking the top bar
   and the whole menu rail on every screen. */
.skip-link {
  position: absolute; left: 8px; top: -100px; z-index: 60;
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid var(--accent-line);
  background: var(--panel);
  color: var(--text);
  font-size: var(--fs-sm);
  text-decoration: none;
}
.skip-link:focus-visible { top: 8px; }

::selection { background: var(--accent-edge); }

/* scrollbars — a light bar on a dark ground is not distracting */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--inert) transparent;
}
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-thumb { background: var(--inert); }
*::-webkit-scrollbar-track { background: transparent; }

/* screen reader text */
.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

[hidden] { display: none !important; }

/* ─────────────────────────────────────────── application skeleton ── */
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.top-bar {
  display: flex; align-items: center; gap: var(--sp-3);
  min-height: var(--top-height); flex: none;
  padding: 0 var(--sp-4);
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.top-bar img.logo { height: 24px; display: block; }
.top-bar .divider { width: 1px; height: 22px; background: var(--line); flex: none; }
.top-bar .app-name {
  font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-base);
  letter-spacing: .18em; text-transform: uppercase; color: var(--brand);
  white-space: nowrap;
}
.top-bar .spacer { flex: 1; }
/* ONE HEIGHT FOR EVERY CONTROL IN THE BAR. There were four in a fifty-pixel
   row: 33px text buttons, 30px icon buttons, a 30px project frame and 26px
   language buttons, which is what made a row of eight controls read as eight
   unrelated objects rather than as one bar. */
.top-bar .btn { height: 30px; padding-top: 0; padding-bottom: 0; }
/* The mode badge is the same height as the icon buttons in the top bar; a
   small chip floated between the 30px buttons next to it. It is only ever
   shown in admin mode, so it is coloured like the thing it announces. */
#mode-badge {
  height: 30px; padding: 0 var(--sp-4); flex: none;
  font-size: var(--fs-sm); color: var(--accent);
}
/* The key has been pulled out but a write is still running, so admin mode is
   held open until the queue clears (see panel/adminkey/watcher.py). The
   badge says so rather than changing silently under the user. */
#mode-badge[data-pending="1"] { color: var(--auth); }

.body {
  position: relative;
  display: flex;
  flex: 1;
  min-height: 0;
}

/* The main menu is a narrow icon rail: 56 pixels. Hovering an icon shows the
   name in a bubble beside it; whoever wants them permanently expands the rail
   (see views.css "icon rail"). The bubble spills outside the rail, so
   overflow is not clipped here. */
.sidebar {
  flex: none;
  z-index: 30;
  display: flex; flex-direction: column;
  width: 56px;
  background: var(--panel);
  border-right: 1px solid var(--line);
  transition: width .18s ease;
}
.sidebar[data-wide="1"] { width: 214px; }
@media (prefers-reduced-motion: reduce) { .sidebar { transition: none; } }

.content {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: var(--sp-5) var(--sp-6) var(--sp-6);
}

.footer-bar {
  display: flex; align-items: center; gap: var(--sp-4);
  height: var(--footer-height); flex: none;
  padding: 0 var(--sp-5);
  background: var(--panel);
  border-top: 1px solid var(--line);
  font-family: var(--font-body); font-size: var(--fs-sm); color: var(--text-dim);
}
.footer-bar .divider { width: 1px; height: 14px; background: var(--line); }

/* ── narrow screen ─────────────────────────────────────────────────── */
@media (max-width: 900px) {
  /* The application name already appears in the window title. Hiding this
     text once the narrow rail has gone stops the active job type from being
     clipped and the top-bar actions from overflowing. */
  .top-bar .app-name,
  .top-bar img.logo + .divider { display: none; }
  .content { padding: var(--sp-5) var(--sp-4) var(--sp-6); }
}

@media (max-width: 620px) {
  .top-bar { flex-wrap: wrap; padding: var(--sp-2) var(--sp-3); min-height: auto; }
  h2 { font-size: var(--fs-xl); }
}

/* static/css/components.css */
/* Reused parts: buttons, cards, tables, badges, the credentials menu, the
   queue panel and the dialogs. */

/* ──────────────────────────────────────────────────────────── buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4);
  background: transparent;
  border: 1px solid var(--line-strong);
  border-radius: 0;
  color: var(--text);
  cursor: pointer;
  font-family: var(--font-body); font-weight: 600; font-size: var(--fs-base);
  letter-spacing: 0; text-transform: none;
  white-space: nowrap;
  transition: background .12s ease, border-color .12s ease;
}
.btn:hover:not(:disabled) { background: var(--raise-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn-primary {
  background: var(--accent); border-color: var(--accent); color: var(--deep);
}
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

.btn-danger { border-color: var(--failed-line); color: var(--failed-text); }
.btn-danger:hover:not(:disabled) { background: var(--failed-wash); }

.btn-small { padding: var(--sp-1) var(--sp-4); font-size: var(--fs-base); }

/* A BUTTON THAT IS NOT A BOX. The way to a screen's other face, sitting in a
   sentence beside the words that introduce it — "no account yet? create
   one". Given a border it would read as a second thing to press next to the
   one thing to press, which is the choice the layout has already made for
   the reader. Underlined rather than merely coloured: colour alone is not a
   control, and this one is inside a line of prose where nothing else is. */
.btn-link {
  padding: 0; border: 0; background: transparent;
  color: var(--accent); cursor: pointer;
  font-family: var(--font-body); font-weight: 600; font-size: var(--fs-sm);
  text-decoration: underline; text-underline-offset: 2px;
}
.btn-link:hover:not(:disabled) { color: var(--accent-hover); }

/* CONTROLS THAT BELONG TOGETHER, DRAWN AS ONE. Two buttons with a gap
   between them are two decisions; two buttons sharing an edge are one
   control with two halves. The top bar had eight separate boxes in a row and
   now has five objects, which is the same thing said with less furniture.

   `-1px` rather than dropping a border: both halves keep their own width, so
   nothing shifts when one of them changes. The hovered or focused half is
   lifted so its border is the one drawn on the shared edge. */
.btn-group { display: flex; align-items: stretch; flex: none; }
/* Any two halves, not two buttons: the mode group joins a badge to the
   button that leaves the mode it names. */
.btn-group > * + * { margin-left: -1px; }
.btn-group > .btn:hover,
.btn-group > .btn:focus-visible { position: relative; z-index: 1; }

/* Fixed-width button: the two labels sit on top of each other in the same
   grid cell and the longer one sets the cell width. No pixel value is
   written — if the font is not installed the fallback kicks in and a fixed
   width no longer holds. */
#refresh-btn { display: inline-grid; place-items: center; }
#refresh-btn > span { grid-area: 1 / 1; }
#refresh-btn .label-measure { visibility: hidden; }

/* Paused, in the amber the panel already uses for "needs your attention"
   rather than the accent it uses for "on". Being paused is not a setting
   that is switched on, it is a state in which what is on screen is quietly
   ageing — so it is the whole control that is marked, not the half that was
   pressed: "Scan now" still works while the rounds are off, and the frame is
   what says the readings beside it have stopped renewing themselves. */
.scan-group[data-paused="1"] > .btn { border-color: var(--auth); }
.scan-group[data-paused="1"] > #auto-btn { color: var(--auth); }

.btn-icon {
  width: 30px; height: 30px; padding: 0; flex: none;
  border-color: var(--line); color: var(--text-mid);
}
.btn-icon:hover:not(:disabled) { color: var(--text); border-color: var(--line-strong); }
.btn-icon[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

.btn-close {
  width: 24px; height: 24px; padding: 0; flex: none;
  border-color: var(--line); color: var(--text-mid);
  font-family: var(--font-body); font-size: var(--fs-base); letter-spacing: 0;
}

/* ────────────────────────────────────────────────────────── alanlar ──── */
.field {
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--line-strong);
  border-radius: 0;
  padding: var(--sp-3);
  font-family: var(--font-mono); font-size: var(--fs-base);
}
/* A field that has to fit inside a table row, where the row's own padding
   is already carrying most of the space. */
.field-tight { padding: var(--sp-1) var(--sp-3); }
/* ONE EDGE, NOT TWO. The shared focus ring is two pixels wide and drawn one
   pixel OUTSIDE the box, which is right for a button sitting on the page's
   own ground — but a field already turns its border accent when it takes the
   keyboard, so the ring landed as a second blue frame with a dark line
   between the two: four pixels of blue around a box that had already said it
   has the keyboard. Brought inside and thinned: the border and the ring make
   one 2px edge, and it is still an outline, so a forced-colours mode still
   draws it. */
.field:focus-visible {
  border-color: var(--accent);
  outline-width: 1px;
  outline-offset: -1px;
}
.field[aria-invalid="true"] { border-color: var(--failed); color: var(--failed-text); }

/* THE NAME OF SOMETHING — a field's caption, a card's kicker, the word over
   a number. There were three of these, byte for byte the same rule under
   three names (`.label`, `.eyebrow`, `.kpi .name`), so whoever changed one
   changed a third of the screens and could not tell which third. */
.label {
  font-family: var(--font-body); font-size: var(--fs-sm); font-weight: 600;
  letter-spacing: .01em; color: var(--text-mid); text-transform: none;
}
/* And the small monospaced note that goes with a value: the "records" after
   a count, the address under a device's name. Two names for this one. */
.unit {
  font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text-mid);
}
/* A `<label>` that wraps its own caption and its box. Block, so the caption
   sits on the line above the input rather than beside it. `.label` itself
   stays inline: it is also used as a cell in a row. */
.field-label { display: block; }

/* ─────────────────────────────────────────────────── search boxes ── */
/* A magnifier inside the left edge of the box, and no placeholder — the
   reasoning is in js/components/search_field.js. It is a wrapper rather than
   a bare input because something has to hold the glass in place, and it is
   the wrapper the screens give a width to.

   The text clears the glass with `--sp-7` rather than a hand-picked number:
   the icon starts at `--sp-3` and is fifteen pixels wide, so anything under
   28 would run into it, and `--sp-7` is the first rung above that. */
.search-field { position: relative; display: block; }
.search-glass {
  position: absolute; left: var(--sp-3); top: 0; bottom: 0;
  display: flex; align-items: center;
  color: var(--text-mid); pointer-events: none;
}
.search-input { padding-left: var(--sp-7); }
/* The glass takes the focus colour with the border, so the box says it has
   the keyboard in the one place the eye is already looking. */
.search-field:focus-within .search-glass { color: var(--accent); }

/* ──────────────────────────────────────────────────── corner marks ── */
.corner { position: relative; }
.corner::before, .corner::after {
  content: ""; position: absolute; width: 11px; height: 11px;
  pointer-events: none;
  background:
    linear-gradient(var(--line-corner), var(--line-corner)) center/100% 1px no-repeat,
    linear-gradient(var(--line-corner), var(--line-corner)) center/1px 100% no-repeat;
}
.corner::before { left: -6px; top: -6px; }
.corner::after { right: -6px; bottom: -6px; }

/* ──────────────────────────────────────────────────────────── kartlar ── */
.card {
  border: 1px solid var(--line);
  background: var(--panel);
  padding: var(--sp-5);
}

/* THE HEAD OF A CARD, and there is one of it. Five names were doing this
   job — `.card-head`, `.fw-bulk-head`, `.ip-factory-reset-head` and, on the
   IP screen, two more — so a card's title row looked slightly different
   depending on which screen had built it. Every card title is an `h3` in
   here; a card with nothing to call itself simply has no head. */
.card-head {
  display: flex; align-items: baseline; gap: var(--sp-4);
  margin-bottom: var(--sp-4); flex-wrap: wrap;
}
.card-head .spacer { flex: 1; }
/* The sentence under a title, where a card has one. */
.card-head p {
  margin: var(--sp-1) 0 0;
  width: 100%;
  color: var(--text-mid); font-size: var(--fs-sm); line-height: 1.45;
}

.page-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: var(--sp-5); flex-wrap: wrap; margin-bottom: var(--sp-5);
}
.page-head .actions { display: flex; gap: var(--sp-3); flex-wrap: wrap; }
/* The single line under the heading: how fresh the numbers on the page are. */
.page-sub {
  margin-top: var(--sp-1);
  font-family: var(--font-body); font-size: var(--fs-base); color: var(--text-mid);
}
/* The checklist refreshes itself. When the data goes stale this line draws
   attention: producing an Excel from that view means a wrong document. */
.check-freshness[data-stale="1"] { color: var(--auth); }

/* The age of the data and the counters in the Excel confirmation. */
.dialog .summary-box {
  margin-top: var(--sp-4);
  padding: var(--sp-0) var(--sp-4);
  border: 1px solid var(--line-soft);
  background: var(--deep);
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
}
.dialog .summary-box .summary-row:last-child { border-bottom: 0; }

/* A NAMED NUMBER — the shape of both the overview's four counters and the
   check summary's four. They were written twice, on two screens, and had
   drifted apart in six places: two grid minimums (190 and 155), two gaps,
   two number sizes, two grounds, and a hover on one of them. Open the two
   screens side by side and the same object appeared at two sizes.

   One box here, and each screen says only what is true of it: the overview's
   is pressed to go somewhere and carries the biggest number on the page; the
   summary's is a figure and nothing else. That is now the ONLY difference,
   and it is the honest one — a thing you can press should not look like a
   thing you cannot. */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  /* The same join a table makes under its heading (`.table-wrap`). */
  gap: var(--sp-4); margin-top: var(--sp-4);
}
/* The name on the left, the figure on the right, on one baseline — the shape
   the panel already uses for a stated fact (`.step-footer`, `.summary-row`,
   every technical row on the network screen). Stacked, the box was a caption
   and a number against three hundred pixels of nothing. */
.stat {
  display: flex; flex-direction: row;
  align-items: baseline; justify-content: space-between;
  gap: var(--sp-4);
  width: 100%;
  padding: var(--sp-4) var(--sp-5);
  border: 1px solid var(--line);
  background: var(--panel);
  color: inherit; font: inherit; text-align: left;
}
.stat .value {
  font-family: var(--font-heading); font-weight: 600;
  font-size: var(--fs-2xl); line-height: 1;
}
/* The figure takes its state's colour — `--state-text` and not the fill,
   because red reaches 3.7:1 on the panel and a number is a word. This is why
   neither screen writes a colour of its own beside its figures any more. */
.stat[data-state] .value { color: var(--state-text); }
/* Pressable, and drawn so. `button` rather than a modifier class: the tag is
   already the truth about whether this goes anywhere. */
button.stat { cursor: pointer; }
button.stat:hover {
  border-color: var(--line-strong); background: var(--raise-1);
}
button.stat:focus-visible { outline-offset: -2px; }

/* WHAT A SCREEN SHOWS INSTEAD OF ITS CONTENT
   ──────────────────────────────────────────
   Three different sentences, and they were being said five different ways:
   a dashed box on two screens, a table's own empty row, an `.info` paragraph
   on four, and two the IP screen had built for itself. The same situation
   looked different depending on which screen the operator was standing on,
   which is exactly the thing a person cannot learn.

   They are three states and not one, and telling them apart is the point:

     .loading      nothing has arrived YET
     .empty-state  nothing is there
     .warning      it could not be read          (see `placeholder.js`)

   The last two were the same sentence on several screens, and they are not
   the same fact: one means the scan found nothing, the other means the scan
   did not happen. A table keeps `dataTable`'s own empty row — inside a table
   the empty state belongs in the grid, where the columns still line up. */
.loading {
  min-height: 88px;
  margin-top: var(--sp-5);
  display: flex; align-items: center; justify-content: center;
  gap: var(--sp-3);
  color: var(--text-mid);
  font-family: var(--font-mono); font-size: var(--fs-sm);
}
/* A turning mark, because a screen that is waiting and a screen that is
   broken look the same standing still — and behind a slow scan that wait is
   a minute long. Deliberately not a skeleton: a fake table drawn where the
   real one will be is a lie, and this is a tool for a depot. */
.loading > i {
  width: 13px; height: 13px;
  border: 1px solid var(--line-strong);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: placeholder-spin .75s linear infinite;
}
@keyframes placeholder-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .loading > i { animation: none; } }

/* Dashed, because the outline of the thing that is not there says more than
   a sentence about it does. */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--sp-1);
  min-height: 92px;
  margin-top: var(--sp-4);
  padding: var(--sp-6);
  border: 1px dashed var(--line-strong);
  background: var(--raise-1);
  color: var(--text-mid);
  font-size: var(--fs-base);
  line-height: 1.5;
}
.empty-state p { margin: 0; }
.empty-state .hint { color: var(--text-dim); font-size: var(--fs-sm); }
/* The same box standing in for a DRAWING rather than a list: a faceplate
   leaves a hole this size, and a 92px strip inside it reads as a fault. */
.empty-state-tall {
  min-height: 190px;
  align-items: center; justify-content: center; text-align: center;
}

/* ───────────────────────────────────────────────────── state colours ── */
.dot {
  width: 7px; height: 7px; flex: none; display: block;
  background: var(--unknown);
}
/* Two values per state, and they are not interchangeable. --state-colour
   paints dots, edges and port graphics; --state-text is what a WORD is
   written in. Red (#da3633) reaches only 3.7:1 on the panel and grey is
   darker still, so a row that says "Failed" in --state-colour could not be
   read — which is exactly the row somebody needs to read. */
[data-state="ok"] { --state-colour: var(--ok); --state-text: var(--ok-text); }
[data-state="auth"] { --state-colour: var(--auth); --state-text: var(--auth-text); }
[data-state="failed"] { --state-colour: var(--failed); --state-text: var(--failed-text); }
[data-state="unknown"] { --state-colour: var(--unknown); --state-text: var(--unknown-text); }
/* A running job: green means "finished" and queued grey reads as dormant.
   Running is blue — the accent colour already means "happening now". */
[data-state="busy"] { --state-colour: var(--accent); --state-text: var(--accent); }
/* A physical link, on the switch screen. The same blue as "busy" and a
   separate name on purpose: this is a cable that is up, not work in progress,
   and the two would have started drifting the first time either colour moved.
   It is the blue `.pm-port.link` paints the faceplate with, so the dot in the
   port table and the connector above it cannot disagree. */
[data-state="link"] { --state-colour: var(--accent); --state-text: var(--accent); }
.dot[data-state] { background: var(--state-colour); }
.state-text[data-state] { color: var(--state-text); }

.badge {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  padding: var(--sp-0) var(--sp-1);
  border: 1px solid var(--line-strong);
  font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: .02em;
  color: var(--text-mid);
}
/* A badge that reports a state rather than naming a thing. The border takes
   the state's own colour and the word takes the readable one — the same two
   values, for the same reason, as everywhere else `[data-state]` is used. */
.badge[data-state] {
  border-color: var(--state-colour);
  color: var(--state-text);
}

/* A small stated fact, coloured by whether it is a good one. Used as a button
   on the switch screen (the port's on/off control) and as a plain span on the
   ADB screen (whether the application came up), which is why it lives here
   rather than in either screen's stylesheet: it arrived in switch.css, and the
   ADB screen reaching across for `.pill ok` — a variant that did not exist —
   is how that was noticed. `justify-self` is for the switch table's grid row
   and is ignored everywhere else. */
.pill {
  padding: var(--sp-1) var(--sp-3);
  justify-self: start;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
.pill.on, .pill.ok { border-color: var(--ok-line); color: var(--ok-text); }
.pill.off { border-color: var(--failed-line); color: var(--failed-text); }
/* Only the ones that are actually a control. The ADB screen's pill is a span
   stating a fact, and a hand cursor over it would promise a click. */
button.pill { cursor: pointer; }
button.pill:hover { border-color: var(--line-strong); }

.mono { font-family: var(--font-mono); }
.text-dim { color: var(--text-dim); }
.text-mid { color: var(--text-mid); }
.text-bright { color: var(--text-bright); }

/* Size utilities. They exist so a view never writes a size of its own: every
   screen used to set font-size inline, forty-nine times over ten files, which
   is how the scale reached twenty-two values (see the note in base.css). */
.t-xs { font-size: var(--fs-xs); }
.t-sm { font-size: var(--fs-sm); }
.t-base { font-size: var(--fs-base); }
/* A version the device really reported, as opposed to the dash that stands
   in for "not read yet" (see views/devices.js). */
/* A version the device actually reported, against the dash that stands in
   for one it did not. It used to be written in the state green, which is a
   colour that means "reachable" everywhere else in the panel and means
   nothing about a version number — and on the device list it was the third
   green in a row that already had the state in its gutter and in its own
   column. Read or not read is the only distinction here, so brightness
   carries it. */
.version-read { color: var(--text-bright); }

/* LAYOUT UTILITIES — the same argument as the size utilities above.
   ────────────────────────────────────────────────────────────────
   Eighty inline `style:` strings in the views were laying elements out:
   twenty-one margins, twenty displays, fourteen gaps, eleven flex settings
   and three grid templates. A gap written there is invisible from the
   stylesheet, so whoever goes looking for it cannot find it — and, worse,
   the spacing scale cannot reach it. Every one of those eighty was a value
   chosen by hand.

   Deliberately utilities rather than a class per site. A `.overview-legend`
   and a `.admin-key-row` that both mean "a row with a gap" are two names for
   one idea, and naming each of the eighty would have bought nothing but the
   names. What these buy is that the JS spells its spacing in `--sp-*`
   without knowing it, so a change to the scale reaches the views as well
   (see base.css).

   `tests/test_frontend.py` rejects a layout property written inline. Colour,
   a percentage width and the `--table-columns` a screen computes stay there:
   those come from data, and data does not belong in a stylesheet. */
/* All three carry `min-width: 0`. Most of them are a table cell or a flex
   child, and without it a long device name refuses to shrink and pushes the
   columns beside it off the row instead of ellipsing inside its own. */
.row { display: flex; align-items: center; min-width: 0; }
/* Icon-and-two-lines: the icon should sit with the first line, not float in
   the middle of the block. */
.row-top { display: flex; align-items: flex-start; min-width: 0; }
.stack { display: flex; flex-direction: column; min-width: 0; }
.wrap { flex-wrap: wrap; }
/* In a column, a child stretches to the full width by default. This is for
   the one that should stay its own size — a badge, not a bar. */
.self-start { align-self: flex-start; }
/* Takes the leftover width AND is allowed to be narrower than its text —
   without `min-width: 0` a long device name pushes everything else out of
   the row instead of ellipsing. The two belong together often enough that
   splitting them only produced rows that had forgotten the second half. */
.grow { flex: 1; min-width: 0; }
.fixed { flex: none; }
/* Everything after it goes to the far end of the row. */
.push { margin-left: auto; }

/* A SEGMENTED CHOICE — one border around the group and none between, so
   three mutually exclusive filters read as one control rather than as three
   buttons that happen to be adjacent. The chosen one is filled: there are
   only ever a few, and which is on has to be readable at a glance. */
.segmented { display: flex; gap: var(--sp-0); border: 1px solid var(--line-strong); }
.segmented .btn {
  border: 0; letter-spacing: .02em; text-transform: none;
  font-family: var(--font-body);
}
.segmented .btn[aria-pressed="true"] {
  background: var(--accent); color: var(--deep);
}

/* A LIST ROW WITH A HAIRLINE UNDER IT — what a short list looks like when
   it is not worth a table: the broker's topics, the category definitions.
   Two screens had each written this themselves and neither had picked the
   same padding as the other. */
.rule-row {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-2) 0;
  border-bottom: 1px solid var(--line-soft);
}

.gap-1 { gap: var(--sp-1); }
.gap-2 { gap: var(--sp-2); }
.gap-3 { gap: var(--sp-3); }
.gap-4 { gap: var(--sp-4); }

/* `.mt-0` is not a step: it cancels one a component brings with it, the way
   `.table-wrap` carries the space that follows a heading. */
.mt-0 { margin-top: 0; }
.mt-1 { margin-top: var(--sp-1); }
.mt-2 { margin-top: var(--sp-2); }
.mt-3 { margin-top: var(--sp-3); }
.mt-4 { margin-top: var(--sp-4); }
.mt-5 { margin-top: var(--sp-5); }
.mb-3 { margin-bottom: var(--sp-3); }
.mb-4 { margin-bottom: var(--sp-4); }

/* A single word used as a STATE — "Reachable", "Failed", the project name.
   The heading face, letter-spaced and upper case, so the cell reads as a
   label rather than as content. */
.state-label {
  font-family: var(--font-heading); font-weight: 600;
  font-size: var(--fs-base);
  letter-spacing: .08em; text-transform: uppercase;
}

/* ───────────────────────────────────────────────────────── tablolar ──── */
/* A grid-based table: column widths are tuned per screen, and it scrolls
   horizontally inside itself so rows do not break on a narrow screen. */
.table-wrap {
  overflow-x: auto;
  margin-top: var(--sp-4);
}

.table {
  min-width: var(--table-min, 900px);
}

.table-head, .table-row {
  display: grid;
  grid-template-columns: var(--table-columns);
  gap: var(--sp-3);
  align-items: center;
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid var(--line);
}

.table-head {
  background: var(--panel);
  border-bottom: 0;
  font-family: var(--font-body); font-size: var(--fs-sm); font-weight: 600;
  letter-spacing: .01em; color: var(--text-mid); text-transform: none;
  position: sticky; top: 0; z-index: 2;
}

.table-row {
  border-top: 0;
  background: var(--panel-2);
  text-align: left;
  width: 100%;
  font: inherit;
  color: var(--text);
}
button.table-row { cursor: pointer; }
button.table-row:hover { background: var(--lift-1); }
button.table-row[aria-selected="true"] { background: var(--accent-wash); }


/* A CELL THAT ELLIPSES INSTEAD OF PUSHING ITS NEIGHBOUR OFF THE ROW.
   ─────────────────────────────────────────────────────────────────
   It was written `.table-row .truncate` and the JS writes `truncate` in
   forty-odd places, most of them not in a table: the MQTT feed, the PISCU
   lists, the confirmation dialog, the Excel preview's column headings. In
   every one of those it styled nothing at all, silently — a long topic ran
   straight through the payload beside it and a device name ran through the
   extension it was meant to sit next to, and the class that was supposed to
   stop it was right there in the markup.

   Scoping it to the table was never the point; the point is the cell. */
.truncate {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  min-width: 0;
}

.table-empty {
  border: 1px solid var(--line); border-top: 0;
  background: var(--panel-2);
  padding: var(--sp-6) var(--sp-4); text-align: center;
  font-family: var(--font-body); font-size: var(--fs-base); color: var(--text-mid);
}

/* ───────────────────────────────────────────────────── target strip ── */
/* A FILTER ROW, NOT A PANEL. It used to be a bordered box with a filled
   background, and every chip inside it was a bordered box too: a frame
   around six frames, which is what made a plain row of filters the loudest
   thing on the screen. The row carries no border of its own now — what
   separates it from the results is the space under it — and the chips stop
   competing with a container they are inside.

   It scrolls horizontally when it does not fit. The fade on the right edge
   says the list continues: a clipped last chip looked like the end, and
   users were not looking for the remaining groups. */
.chip-bar {
  display: flex; align-items: center; gap: var(--sp-2);
  flex-wrap: nowrap; overflow-x: auto;
  min-height: 36px; margin-top: var(--sp-5);
  /* A stencil, not a colour: opaque keeps the chip, transparent cuts it. */
  -webkit-mask-image: linear-gradient(to right, black calc(100% - 28px), transparent);
  mask-image: linear-gradient(to right, black calc(100% - 28px), transparent);
}
/* The word in front is a caption for the row, not one more thing in it, so
   it is dimmer than the chips rather than the same weight. */
.chip-bar .label { flex: none; margin-right: var(--sp-2); color: var(--text-dim); }

/* The operation target: a compact dropdown instead of a row of chips when
   only one can be chosen. The counts appear in the operation table; the
   picker's only job is the scope. */
.target-picker {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-3);
  margin: 0 0 var(--sp-5);
}
.target-picker .label { margin: 0; color: var(--text-mid); }
.target-picker .field {
  width: auto;
  min-width: 190px;
  min-height: 35px;
  padding-top: var(--sp-2);
  padding-bottom: var(--sp-2);
}

/* Quiet by default, and the borders are gone with the container's. A filter
   nobody has chosen is a place to go, not a thing to read: it sits on a
   raised ground and says so on hover instead of outlining itself. The
   1px inset shadow, not a border, is what the chosen one is drawn with —
   a border would move every other chip by a pixel as the choice changed. */
.chip {
  flex: none;
  display: inline-flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-4);
  background: var(--panel);
  border: 0;
  color: var(--text-mid);
  cursor: pointer;
  font-family: var(--font-body); font-weight: 600; font-size: var(--fs-base);
  letter-spacing: 0; text-transform: none;
  white-space: nowrap;
}
/* The raise is small and the COUNT brightens with it, which is not
   decoration: --text-dim measures 4.58:1 on the chip's own ground and 4.38:1
   on this one, so a hover that only lightened the background would push the
   number under the floor for as long as the pointer sat on it. */
.chip:hover { background: var(--lift-1); color: var(--text); }
.chip:hover .count { color: var(--text-mid); }
.chip .count { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim); }
/* CHOSEN, NOT SHOUTING. It was a solid accent block with dark text on it —
   an inversion of the whole scheme for one chip in six, and the brightest
   object on a screen whose subject is the table underneath. The accent now
   draws the outline and the word, and the fill only tints. */
.chip[aria-pressed="true"] {
  background: var(--accent-wash);
  box-shadow: inset 0 0 0 1px var(--accent-line);
  color: var(--accent);
}
.chip[aria-pressed="true"]:hover { background: var(--accent-wash); }
/* Full accent, and de-emphasised by SIZE alone. Every step down in opacity
   was measured against the tinted ground it sits on and every one failed:
   .85 gives 4.13:1 and .75 gives 3.50:1, against 5.16:1 at full strength.
   A number nobody can read is not a quiet number. */
.chip[aria-pressed="true"] .count { color: var(--accent); }

/* ─────────────────────────────────────────── credentials and queue ─── */
.count-badge {
  position: absolute; top: -7px; right: -7px;
  min-width: 17px; height: 17px; padding: 0 var(--sp-1);
  display: flex; align-items: center; justify-content: center;
  background: var(--auth); color: var(--deep);
  font-family: var(--font-mono); font-size: var(--fs-xs);
}
.count-badge[data-kind="queue"] { background: var(--accent); }

/* A job was added to the queue — the panel does not open, so the news is
   given on the button. Three short pulses, then the button settles. */
#queue-btn[data-flash] {
  border-color: var(--accent);
  color: var(--accent);
  animation: queue-pulse .85s ease-out 3;
}
@keyframes queue-pulse {
  0%   { box-shadow: 0 0 0 0 var(--accent-glyph); }
  70%  { box-shadow: 0 0 0 7px var(--accent-clear); }
  100% { box-shadow: 0 0 0 0 var(--accent-clear); }
}
/* For a user who asks for reduced motion, a flat accent replaces the pulse. */
@media (prefers-reduced-motion: reduce) {
  #queue-btn[data-flash] { animation: none; background: var(--accent-wash); }
}

/* The job queue and the credentials list.
   ───────────────────────────────────────
   On a wide window the panel TAKES ITS OWN COLUMN and the content beside it
   narrows: it is already a flex sibling of `.content` inside `.body`, so this
   is what happens naturally once it stops being positioned.

   It used to overlay instead, and because the queue opens itself every time a
   job starts, that was the ordinary state rather than an edge case: at
   1100px the "Start IP assignment" button sat underneath it, unreachable
   without closing the panel first, with nothing dimmed to say so.

   Below 1080px there is no room for two columns, so it goes back to
   overlaying — and then `.panel-scrim` dims what it covers, which is the part
   that was missing. */
.side-panel {
  flex: none;
  width: min(92vw, var(--queue-width, 340px));
  z-index: 30;
  background: var(--panel);
  border-left: 1px solid var(--line-strong);
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* Only drawn while the panel overlays, and it is not a control: closing is
   the × in the panel header or Escape, both already there. */
.panel-scrim {
  position: absolute; inset: 0;
  z-index: 29;
  background: var(--scrim);
}

@media (min-width: 901px) { .panel-scrim { display: none; } }

@media (max-width: 900px) {
  .side-panel {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: min(92vw, max(300px, var(--side-panel, 340px)));
    box-shadow: -14px 0 34px var(--drop-strong);
  }
}
.side-panel > header {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-4);
  border-bottom: 1px solid var(--line);
}
.side-panel > header .title {
  font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-lg);
  letter-spacing: 0; text-transform: none;
}
.side-panel > .list {
  flex: 1; overflow-y: auto;
  padding: var(--sp-4) var(--sp-4) var(--sp-5);
  display: flex; flex-direction: column; gap: var(--sp-3);
}

/* The job card has no coloured edge strip: the job's state is read from the
   dot in the heading, the percentage and the counters, and painting the card
   edge as well made the queue noisy. */
.job-card {
  border: 1px solid var(--line);
  background: var(--panel-2);
}

/* The running row is set apart by a thin border: the run works through the
   ports in order, so this border is on exactly one row at a time and is the
   calmest way to say "here, right now". A light sweeping across the row was
   tried and made the queue boil. The negative margin stops the border from
   shifting the text relative to the other rows. */
.job-row[data-row-state="running"] {
  border: 1px solid var(--accent-line);
  background: var(--accent-sheen);
  padding: var(--sp-2);
  margin: 0 -8px;
}
/* The only motion is on a dot, and it always answers the same question:
   still going, or stopped? The job list asks it of a run; the remote session
   dialog asks it of a square nobody has approved yet. */
.job-row[data-row-state="running"] .dot {
  animation: pulse 1.6s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1;  box-shadow: 0 0 0 0 var(--accent-line); }
  50%      { opacity: .45; box-shadow: 0 0 0 3px var(--accent-clear); }
}

@media (prefers-reduced-motion: reduce) {
  .job-row[data-row-state="running"] .dot { animation: none; }
}
/* The title button and the stop button share one row. `width:100%` used to
   be here, and with the title button asking for the whole width the stop
   button spilled outside the card (the queue panel is narrow). Now the title
   flexes and the stop button keeps its fixed width. */
.job-card-head { display: flex; align-items: stretch; min-width: 0; }
.job-card-head > .btn-close { align-self: center; margin-right: var(--sp-3); flex: none; }
.job-head {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4); flex: 1; min-width: 0;
  background: transparent; border: 0; cursor: pointer; text-align: left;
}
.job-head .name {
  display: block;
  font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-md);
  letter-spacing: 0; text-transform: none;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.job-head .sub {
  display: block; margin-top: var(--sp-1);
  font-family: var(--font-mono); font-size: var(--fs-xs);
}
/* The phase text ("Port 14 · writing the IP (3/6)"). One line: a long phase
   must not grow the card and push the other queued jobs down. */
.job-phase {
  display: block; margin-top: var(--sp-0);
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.job-counts {
  display: flex; gap: var(--sp-3); flex: none;
  font-family: var(--font-mono); font-size: var(--fs-xs);
}
/* Glyph and number read as one figure, so the pair must not be split by the
   gap between counts. */
.job-count { display: inline-flex; align-items: center; gap: var(--sp-1); }
.job-count svg { flex: none; }
/* A thin progress bar — flush with the bottom of the card, running job only. */
.job-card > .warning { margin: var(--sp-3) var(--sp-4); }
.job-bar { height: 2px; background: var(--line-soft); overflow: hidden; }
.job-bar i {
  display: block; height: 100%;
  background: var(--state-colour, var(--accent));
  transition: width .3s ease;
}
.job-rows { padding: var(--sp-1) var(--sp-4) var(--sp-3); }
.job-row {
  display: flex; gap: var(--sp-3); padding: var(--sp-2) 0;
  border-bottom: 1px solid var(--line-soft);
}
.job-row .dot { margin-top: var(--sp-1); width: 6px; height: 6px; }
/* The class cannot be called ".body": that name is used by the application's
   main body, and its display:flex laid this row out side by side. */
.job-row .job-row-body { min-width: 0; flex: 1; }
/* A long file name ("..._set1.xlsx") spilled out of its box and over the
   state text on the right: the browser does not treat an underscore or a dot
   as a break opportunity, so breaking is asked for explicitly. */
.job-row .name {
  display: block; font-family: var(--font-mono); font-size: var(--fs-sm);
  overflow-wrap: anywhere;
}
.job-row .sub {
  display: block; margin-top: var(--sp-0);
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
  word-break: break-word;
}
/* The reason a row failed. Two lines at most: past that the queue stops
   being a list and becomes a log, which is what the log file is for. */
.job-row-reason {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  margin-top: var(--sp-1);
  font-size: var(--fs-xs);
  line-height: 1.45;
  color: var(--danger-text);
  overflow-wrap: anywhere;
}
.job-row[data-row-state="skipped"] .job-row-reason { color: var(--text-mid); }

.job-row .state {
  flex: none; align-self: flex-start;
  font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-sm);
  letter-spacing: .08em; text-transform: uppercase;
}

/* ---- the step accordion under a row ----
   Where a port is within the run ("searching for the device", "writing the
   IP") did not fit into a one-line note: each new step erased the previous
   one, and when the port failed, what happened when was lost. A row with
   steps turns into a button; the button's own appearance is reset and the row
   appearance
   .job-row'dan gelir. */
.job-row-btn {
  width: 100%; color: inherit; font: inherit;
  background: transparent;
  border-top: 0; border-left: 0; border-right: 0;
  text-align: left; cursor: pointer;
}
.job-row-btn:hover { background: var(--raise-1); }
/* The only marker that a row expands; it turns downwards when open. */
.job-chevron {
  flex: none; align-self: center; width: 6px; height: 6px;
  margin-top: -3px;
  border-right: 1.5px solid var(--text-dim);
  border-bottom: 1.5px solid var(--text-dim);
  transform: rotate(-45deg);
  transition: transform .18s ease;
}
.job-row-btn[data-open="true"] .job-chevron {
  transform: rotate(45deg); margin-top: -2px;
}
@media (prefers-reduced-motion: reduce) {
  .job-chevron { transition: none; }
}

.job-steps {
  margin: 0 0 var(--sp-2) var(--sp-1); padding: var(--sp-1) 0 var(--sp-1) var(--sp-4);
  border-left: 1px solid var(--line-soft);
}
.job-step { display: flex; gap: var(--sp-3); align-items: center; padding: var(--sp-0) 0; }
.job-step .dot { width: 5px; height: 5px; margin-top: 0; }
.job-step-text {
  flex: 1; min-width: 0;
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-mid);
  overflow-wrap: anywhere;
}
.job-step[data-row-state="warning"] .job-step-text { color: var(--auth); }
.job-step[data-row-state="failed"] .job-step-text { color: var(--failed); }
.job-step-time {
  flex: none; align-self: flex-start;
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
}

/* The two buttons under a generated file: open / show in folder. */
.file-actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-2); flex-wrap: wrap; }
.file-btn {
  gap: var(--sp-1); padding: var(--sp-1) var(--sp-3);
  font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 400;
  letter-spacing: .04em; text-transform: none;
  border-color: var(--line); color: var(--text-mid);
}
.file-btn:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
.file-btn svg { flex: none; }

.locked-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: var(--sp-1) var(--sp-3);
  width: 100%;
  padding: var(--sp-3) var(--sp-4);
  background: var(--panel-2);
  border: 1px solid var(--auth-line);
  color: var(--text);
  cursor: pointer; text-align: left;
}
.locked-row:hover { background: var(--lift-2); }
.locked-row .name {
  font-family: var(--font-mono); font-size: var(--fs-base);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.locked-row .sub {
  grid-column: 1 / -1;
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
  line-height: 1.5;
}

/* ────────────────────────────────────────────────────────── dialog ──── */
.backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: var(--scrim);
  display: flex; align-items: center; justify-content: center;
  padding: var(--sp-5);
}
.backdrop.right { align-items: stretch; justify-content: flex-end; padding: 0; }

.dialog {
  width: min(430px, 100%);
  background: var(--panel);
  border: 1px solid var(--line-strong);
  padding: var(--sp-5) var(--sp-6) var(--sp-6);
  display: flex; flex-direction: column; gap: var(--sp-4);
  max-height: 92vh; overflow-y: auto;
}
.dialog h3 { font-size: var(--fs-lg); }
.dialog .description { font-size: var(--fs-base); color: var(--text-bright); }
.dialog .actions { display: flex; justify-content: flex-end; gap: var(--sp-3); }

/* dialog.pick — one row per choice. A row that cannot be chosen is dimmed
   and keeps its note, which is the only thing on the row that says why. */
.pick-list { display: flex; flex-direction: column; gap: var(--sp-2); }
.pick-item {
  display: flex; align-items: baseline; justify-content: space-between;
  /* Wraps rather than breaking a word: these rows carry drive names, and in
     a narrow column "DABP-KEY" was being split across two lines. The note
     drops underneath instead and the name keeps its full width. */
  flex-wrap: wrap;
  gap: var(--sp-1) var(--sp-4); width: 100%; text-align: left;
  padding: var(--sp-3) var(--sp-4);
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text);
  font-family: inherit; font-size: var(--fs-base);
  cursor: pointer;
}
.pick-item:hover:not(:disabled) { border-color: var(--accent-line); }
.pick-item:disabled { cursor: default; color: var(--text-dim); }
/* The row you are already on. Marked rather than greyed: disabled reads as
   "not available to you", which is the opposite of what is true of the open
   project — an undelivered one is what reads that way, and it does. */
.pick-item[aria-current="true"] {
  border-color: var(--ok-line);
  border-left: 3px solid var(--ok);
  background: var(--ok-sheen);
  cursor: default;
}
.pick-item[aria-current="true"] .pick-label { color: var(--ok); }
.pick-item[aria-current="true"] .pick-note { color: var(--ok-text); }
.pick-label { font-weight: 600; }
.pick-note {
  font-family: var(--font-mono); font-size: var(--fs-xs);
  color: var(--text-faint);
}

.warning {
  padding: var(--sp-3);
  border: 1px solid var(--failed-line);
  background: var(--failed-sheen);
  color: var(--danger-text);
  font-size: var(--fs-base);
}
.info {
  padding: var(--sp-3);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  font-size: var(--fs-base); color: var(--text-bright);
}

.checkbox {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  background: transparent;
  border: 1px solid var(--line-strong);
  color: var(--text); cursor: pointer; text-align: left; width: 100%;
}
.checkbox .box {
  width: 12px; height: 12px; flex: none;
  border: 1px solid var(--line-strong); display: block;
}
.checkbox[aria-pressed="true"] { border-color: var(--accent); }
.checkbox[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.checkbox span:last-child {
  font-family: var(--font-body); font-weight: 600; font-size: var(--fs-base);
  letter-spacing: 0; text-transform: none;
}

/* ────────────────────────────────────────────────────── device detail ── */
.detail {
  width: min(520px, 100%); height: 100%;
  background: var(--panel);
  border-left: 1px solid var(--line-strong);
  overflow-y: auto;
  padding: var(--sp-5) var(--sp-6) var(--sp-7);
}
.detail-block { margin-top: var(--sp-5); }
.detail-block > .head {
  display: flex; align-items: baseline; gap: var(--sp-3);
  padding-bottom: var(--sp-2); border-bottom: 1px solid var(--line);
}
.detail-block > .head .spacer { flex: 1; }
.detail-row {
  display: grid; grid-template-columns: 1fr 1.1fr; gap: var(--sp-4);
  padding: var(--sp-2) 0; border-bottom: 1px solid var(--line-soft);
}
.detail-row .name { font-size: var(--fs-base); color: var(--text-mid); }
.detail-row .value {
  font-family: var(--font-mono); font-size: var(--fs-base);
  word-break: break-word;
}

/* ───────────────────────────────────────────────────── toast strip ─── */
/* The strip stacks: several messages can be on screen at once and an error
   stays until it is dismissed (see components/toast.js). */
#toast {
  position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%);
  z-index: 70;
  display: flex; flex-direction: column; gap: var(--sp-3);
  max-width: min(560px, 92vw);
  font-size: var(--fs-base);
}
/* A BAND IN THE GUTTER AND A MARK IN FRONT, and the sentence left in the
   panel's ordinary text. It used to be the other way round: the frame took
   the state's colour and so did every word inside it, so an error was two
   lines of red — heavier to read than plain text, and the only thing telling
   anybody which kind of message this was.

   The band is the same three-pixel inset the device, verification and
   assignment lists are all read by, which is why it is drawn as a shadow
   rather than a border: nothing thickens, so the three boxes in the stack
   stay exactly the same width. */
.toast-item {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: start; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid var(--line-strong);
  background: var(--panel);
  color: var(--text-bright);
  box-shadow: inset 3px 0 0 var(--state-colour),
              0 8px 26px var(--drop-strong);
}
.toast-text { min-width: 0; overflow-wrap: anywhere; line-height: 1.45; }
/* `--state-text` and not the fill: red reaches 3.7:1 on the panel, and this
   is the one part of the message that has to be seen at a glance. */
.toast-mark {
  display: flex; align-items: center; flex: none;
  height: 1.45em;
  color: var(--state-text);
}
/* Only an error carries one — the others take themselves away. Frameless:
   a bordered box inside a bordered box, for a control that is only ever
   pressed to make something go away. */
.toast-close {
  flex: none; border-color: transparent; color: var(--text-mid);
}
.toast-close:hover:not(:disabled) {
  border-color: var(--line); color: var(--text);
}

/* It arrives from the edge it is anchored to. Short enough not to delay the
   message, long enough that a strip which has just gained a line does not
   look as though it always had one. */
@keyframes toast-enter {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
.toast-item[data-enter="1"] { animation: toast-enter .16s ease-out both; }
@media (prefers-reduced-motion: reduce) {
  .toast-item[data-enter="1"] { animation: none; }
}

/* The shortcut list, opened with `?`. */
.shortcut-list { display: flex; flex-direction: column; gap: var(--sp-3); }
.shortcut-list .row { display: flex; align-items: center; gap: var(--sp-4); }
.shortcut-list kbd {
  flex: none; min-width: 34px; padding: var(--sp-1) var(--sp-2);
  border: 1px solid var(--line-strong);
  background: var(--deep);
  font-family: var(--font-mono); font-size: var(--fs-sm);
  text-align: center;
}

/* ─────────────────────────────────────────── top bar project strip ─── */
.project-bar {
  display: flex; align-items: center; gap: var(--sp-2); flex: none;
  padding: var(--sp-1) var(--sp-3);
  border: 1px solid var(--line-strong);
  font-family: var(--font-mono); font-size: var(--fs-sm); letter-spacing: .04em;
  white-space: nowrap;
}
.project-bar > button {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-0);
  background: transparent; border: 0; color: var(--text);
  cursor: pointer; font: inherit;
}
.project-bar > button:hover { color: var(--accent); }

.set-field {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  color: var(--text); cursor: pointer;
}
/* A project addressed in fixed form has no train set to pick. The separator
   goes with the box: on its own it would divide the project name from
   nothing. `display` is set explicitly here because `.set-field` carries one
   and an author rule beats the browser's own [hidden]. */
.project-bar[data-set-picker="0"] > .set-field,
.project-bar[data-set-picker="0"] > .text-dim { display: none; }
.set-field input {
  width: 44px;
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--line);
  border-radius: 0;
  padding: var(--sp-0) var(--sp-1);
  font-family: var(--font-mono); font-size: var(--fs-sm);
  text-align: center;
}
.set-field input:hover { border-color: var(--line-strong); }
.set-field input:focus-visible { border-color: var(--accent); }
.set-field input:disabled { color: var(--text-dim); cursor: not-allowed; }
/* The spinner arrows squeeze the number; the set number is typed anyway. */
.set-field input::-webkit-outer-spin-button,
.set-field input::-webkit-inner-spin-button {
  -webkit-appearance: none; margin: 0;
}
.set-field input { -moz-appearance: textfield; appearance: textfield; }

/* ─────────────────────────────────────────────────── language picker ─── */
/* Two buttons rather than a dropdown: with two options a dropdown hides
   which one is active, and the active language is the thing a lost user is
   looking for. Each language names ITSELF (EN / TR), never translated. */
.language-picker {
  display: flex;
  flex: none;
  border: 1px solid var(--line-strong);
}
.language-btn {
  height: 30px;
  min-width: 34px;
  padding: 0 var(--sp-3);
  border: 0;
  background: transparent;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  letter-spacing: .06em;
}
.language-btn + .language-btn { border-left: 1px solid var(--line); }
.language-btn:hover { color: var(--text); background: var(--raise-2); }
.language-btn[aria-pressed="true"] {
  background: var(--accent-wash);
  color: var(--accent);
}

/* ── the right-click menu (components/context_menu.js) ───────────────────────────────────────── */
/* Above the panels (z-index 30) and below a modal dialog (50): the menu is
   a shortcut on top of the screen, not a question that blocks it. */
.pm-menu {
  position: fixed;
  z-index: 40;
  width: 268px;
  max-height: calc(100vh - 20px);
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--line-strong);
  box-shadow: 0 14px 38px var(--drop-strong);
}
.pm-menu-head { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line); }
.pm-menu-title { color: var(--text); font-size: var(--fs-base); font-weight: 600; }
.pm-menu-subtitle {
  margin-top: var(--sp-1);
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  line-height: 1.5;
}
.pm-menu-heading {
  padding: var(--sp-3) var(--sp-4) var(--sp-1);
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: .06em;
}
.pm-menu-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  padding: var(--sp-2) var(--sp-4);
  background: transparent;
  border: 0;
  color: var(--text);
  cursor: pointer;
  font-size: var(--fs-sm);
  text-align: left;
}
.pm-menu-item:hover { background: var(--accent-wash); }
.pm-menu-mark {
  flex: none;
  width: 8px;
  height: 8px;
  border: 1px solid var(--line-strong);
  background: transparent;
}
.pm-menu-item.is-selected { background: var(--accent-wash); }
.pm-menu-item.is-selected .pm-menu-mark {
  background: var(--accent);
  border-color: var(--accent);
}
.pm-menu-label { flex: 1; min-width: 0; }
/* What is already true of the selection — "3/8", or "all". */
.pm-menu-state {
  flex: none;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
.pm-menu-foot {
  display: flex;
  justify-content: flex-end;
  gap: var(--sp-3);
  margin-top: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-top: 1px solid var(--line);
}

/* TWO WAYS IN, TWO COLUMNS, ONE RULE BETWEEN THEM.

   The dialog used to be a single narrow column, because there was one thing
   in it. There are two now — an account and a square — and a stack would
   have made the reader scroll past the one they had in order to find out the
   other existed. So: what needs nobody else on the left, what needs somebody
   else on the right, and a hairline saying they are alternatives rather than
   steps.

   THE RIGHT-HAND COLUMN IS THE FIXED ONE. Its width is the square's, which
   is a whole number of modules and cannot be negotiated with (see app.js
   PAIR_SIDE); the account takes what is left, which is comfortably more
   than two fields and a button need. */
.remote-ways { display: flex; align-items: stretch; gap: var(--sp-6); }
/* A column: its heading, then the one thing under it. */
.remote-way { display: flex; flex-direction: column; gap: var(--sp-5); }

/* THE NAME OF A WAY IN — and the only thing telling the two columns apart.
   Everything below it is drawn the same on both sides, on purpose: two ways
   in that look alike and are labelled read as alternatives, while two drawn
   differently read as a main way and a fallback, which is not true of
   either of these.

   Condensed caps in the accent, a step above the field captions under it and
   nothing like them in colour: this is a signpost, read before anything
   beneath it, rather than another label in the form. */
.remote-way-head {
  font-family: var(--font-heading); font-size: var(--fs-md);
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--accent);
}

/* THE COLUMN, AND THE ONE FACE OF IT ON SHOW. Signing in, asking for an
   account and the sentence that follows a new one replace each other inside
   this box (app.js showSignIn/showSignUp/showSignedUp) — heading and all,
   because a column headed "sign in with an account" over a four-field
   "create an account" form is a heading that has stopped describing what is
   under it. The rule and the width belong to the box and the layout belongs
   to whichever face is in it, so no swap can move the divider. */
.remote-account { flex: 1 1 0; min-width: 0;
                  border-inline-end: 1px solid var(--line);
                  padding-inline-end: var(--sp-6); }
.remote-account-pane { flex: 1 1 auto; min-width: 0;
                       display: flex; flex-direction: column;
                       gap: var(--sp-4); }
.remote-account .warning, .remote-account .info { margin: 0; }

/* A SIGN-IN FIELD IS PROSE, NOT A MACHINE VALUE. Everywhere else in the
   panel a field holds an address, a port or a serial, and monospace is what
   makes those checkable character by character; a name and an e-mail are
   read as words. So this column's boxes take the body face at reading size,
   with the ground lifted off the dialog and the border stepped back — the
   box is found by its fill rather than by its outline, which is what stops
   two large fields from drawing two large frames. */
.remote-account .field {
  background: var(--raise-3); border-color: var(--line-soft);
  padding: var(--sp-4);
  font-family: var(--font-body); font-size: var(--fs-md);
}
.remote-account .field:focus-visible { border-color: var(--accent); }
/* The caption on its own line above the box it names. */
.remote-account .field-label .label { display: block;
                                      margin-block-end: var(--sp-2); }

/* THE ONE THING TO PRESS IN THE COLUMN, drawn as one. Full width under the
   fields it answers, condensed caps at heading size, and the accent running
   across it: this is the end of the form, and a button that ends a form is
   not the same object as the "Refresh" beside a table.

   The gradient is the one flourish in the dialog and it is spent here on
   purpose — everything around it is flat. */
.remote-submit {
  width: 100%;
  padding: var(--sp-4);
  background: linear-gradient(90deg, var(--accent), var(--accent-hover));
  font-family: var(--font-heading); font-size: var(--fs-lg);
  letter-spacing: .08em; text-transform: uppercase;
}
.remote-submit:hover:not(:disabled) {
  background: linear-gradient(90deg, var(--accent-hover), var(--accent-hover));
}

/* The line under the button: a quiet sentence and the way to this column's
   other face. The link is a link because the column already has its one
   thing to press — two buttons of equal weight under two fields turn an
   answer back into a question. */
.remote-aside { display: flex; flex-wrap: wrap; align-items: baseline;
                gap: var(--sp-2); margin: 0;
                color: var(--text-dim); font-size: var(--fs-sm); }

/* The square's column. Fixed to the plate's width, so nothing in it moves
   when the service answers. */
.remote-pair { flex: 0 0 var(--remote-width); }

/* A window too narrow to hold the square beside anything. The rule turns
   with the layout: down the middle becomes across it, and the columns keep
   their order — the account is still the first thing read.

   620 BECAUSE THAT IS ONE OF THE THREE WIDTHS THIS DESIGN ANSWERS TO, not
   because it is where these two columns start to feel tight. A dialog that
   picked its own number would be a fifth place the application changes
   shape as a window is narrowed (see the note in base.css). Between here
   and the dialog's full 720 the account column simply gives ground, which
   is what it has room to do. */
@media (max-width: 620px) {
  .remote-ways { flex-direction: column; }
  .remote-account { border-inline-end: 0; padding-inline-end: 0;
                    padding-block-end: var(--sp-5);
                    border-block-end: 1px solid var(--line); }
  .remote-pair { flex: 0 0 auto; margin-inline: auto; }
}
/* NOTHING HERE IS SIZED BY WHAT ARRIVES. The dialog opened at one width and
   changed to another the moment the service answered: the column took its
   own width while the square was still being asked for and then shrank onto
   the square's edges — seventy pixels of movement, under the operator's
   hands.

   One number instead, `--remote-width`, set once by the window before the
   request goes out (see app.js PAIR_SIDE) — the square's plate and the
   status line are both that wide from the first frame. The floor here
   reserves the same height for the spinner that the square and its status
   row will take, so the column does not grow either. */
.remote-square { display: flex; flex-direction: column; gap: var(--sp-3);
                 align-items: stretch; text-align: center;
                 justify-content: center;
                 min-height: calc(var(--remote-width) + var(--sp-3)
                                  + var(--sp-7)); }
/* WHITE, IN BOTH THEMES. Black on white is what a camera is looking for, in
   a dark panel as much as a light one, so this plate does not follow the
   theme.

   A WINDOW ONTO THE PICTURE, not the picture. The service draws the four
   modules of quiet zone the standard asks for; on screen that is a fifth of
   the square, so two of them are cropped away and the image is pulled up and
   left behind this box (app.js squareBox).

   The plate is a fixed square and the code is CENTRED in it rather than
   filling it. A code is drawn in whole modules, so its side lands wherever
   the module count puts it — 259 pixels for the version 4 this service
   sends — and a plate that took that number would be a different size for a
   different code, which is the movement this dialog exists without now. What
   is left over is white, and white around a code is quiet zone: the one
   thing a decoder is glad to have more of. */
.remote-qr { position: relative; overflow: hidden;
             width: var(--remote-width); height: var(--remote-width);
             max-width: 100%;
             margin-inline: auto; background: var(--paper); }
.remote-qr img { position: absolute; display: block; }
/* One row under the square, ending where it ends: what the panel is doing,
   and which request it is doing it for. */
.remote-status { display: flex; align-items: center;
                 justify-content: space-between; gap: var(--sp-3);
                 width: var(--remote-width); max-width: 100%;
                 margin-inline: auto;
                 color: var(--text-dim); font-size: var(--fs-sm); }
.remote-status-live { display: flex; align-items: center; gap: var(--sp-2);
                      min-width: 0; }
.remote-status .dot { animation: pulse 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .remote-status .dot { animation: none; }
}
.remote-pair-failed { display: flex; flex-direction: column;
                      gap: var(--sp-2); align-items: center; }
.remote-pair-failed .warning { margin: 0; }

/* static/css/views.css */
/* Screen-specific layouts. The shared parts live in components.css. */

/* ───────────────────────────────────────────────────────── icon rail ─── */
/* 56 pixels for five areas (eight in the admin role). On the collapsed rail
   the name appears as a bubble beside the icon; expand the rail and the same
   element becomes inline text. One marker only: the strip on the left edge of
   the selected area. */
.sidebar-list {
  display: flex; flex-direction: column; gap: var(--sp-0);
  padding: var(--sp-3) 0; flex: 1; min-height: 0;
}
.sidebar-item {
  position: relative;
  display: flex; align-items: center; gap: var(--sp-4);
  flex: none; height: 40px; padding: 0 var(--sp-4) 0 var(--sp-5);
  background: transparent;
  border: 0; border-left: 2px solid transparent;
  color: var(--text-mid); cursor: pointer; text-align: left;
  font-family: var(--font-body); font-weight: 600; font-size: var(--fs-base);
  letter-spacing: 0; text-transform: none;
  transition: background .14s ease, color .14s ease;
}
.sidebar-item:hover { background: var(--raise-2); color: var(--text); }
.sidebar-item[aria-current="page"] {
  background: var(--accent-wash);
  border-left-color: var(--accent);
  color: var(--text);
  padding-left: var(--sp-5);
}
.sidebar-icon { display: inline-flex; flex: none; }
.sidebar-item[aria-current="page"] .sidebar-icon { color: var(--accent); }
.sidebar-item[data-admin="1"] .sidebar-icon { opacity: .8; }

/* The line separating the field areas from the admin tools. */
.sidebar-divider {
  height: 1px; margin: var(--sp-3) var(--sp-4);
  background: var(--line); flex: none;
}

/* On the expanded rail the name is inline text. */
.sidebar-name {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* On the collapsed rail the same element becomes a bubble to the right of
   the icon. The rail is narrow, so the bubble spills outside it — which is
   why the container does not clip overflow and the bubble stays on top. */
.sidebar[data-wide="0"] .sidebar-name {
  position: absolute; left: calc(100% + 9px); top: 50%;
  z-index: 40;
  padding: var(--sp-1) var(--sp-3);
  background: var(--panel);
