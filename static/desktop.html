  border: 1px solid var(--line-strong);
  box-shadow: 0 8px 24px var(--drop);
  color: var(--text); font-size: var(--fs-base);
  opacity: 0; pointer-events: none;
  transform: translateY(-50%) translateX(-5px);
  transition: opacity .13s ease, transform .13s ease;
}
.sidebar[data-wide="0"] .sidebar-item:hover .sidebar-name,
.sidebar[data-wide="0"] .sidebar-item:focus-visible .sidebar-name {
  opacity: 1;
  transform: translateY(-50%) translateX(0);
}

/* The button that expands and collapses the rail sits at the bottom: not
   something used, a preference set once. */
.sidebar-expand {
  display: flex; align-items: center; justify-content: center;
  flex: none; height: 34px;
  background: transparent;
  border: 0; border-top: 1px solid var(--line);
  color: var(--text-dim); cursor: pointer;
}
.sidebar-expand:hover { color: var(--text); background: var(--raise-2); }
.sidebar-expand-icon {
  display: inline-flex;
  transition: transform .18s ease;
}
.sidebar[data-wide="1"] .sidebar-expand-icon { transform: rotate(180deg); }

@media (prefers-reduced-motion: reduce) {
  .sidebar-name, .sidebar-expand-icon { transition: none; }
}

/* ──────────────────────────────────────────────────────── overview ─── */
/* THE HEADING IS THE ANSWER, so it is a step larger than every other screen's.
   Elsewhere an `h2` names the screen and the content below it does the
   talking; here the heading IS the content — one sentence saying how much of
   the train set is answering — and the strip beneath is that sentence drawn.
   The screen's name is on the menu rail and in the hidden `h1`, which is
   where a name belongs. */
.overview-head h2 { font-size: var(--fs-3xl); }

/* THE SWEEP STRIP — the whole device list as one bar.
   ──────────────────────────────────────────────────
   A device is in exactly one of the four states and the four add up to the
   list, so a scan is a PARTITION, not four independent shares. It used to be
   drawn as four bars, each a percentage of the total, one under each counter:
   reading "how much is left" meant adding three of them up, and every
   category row below drew a single amber bar whenever the count was anything
   short of all — six rows, six identical ambers, and no way to tell 88% from
   64%.

   It is the only thing on the screen that is not inside a box, and the only
   large area of colour on it. That is deliberate and it is the whole budget:
   everything around it — the counters, the cards, the rows — stays quiet so
   that this is what is seen from across the workshop.

   The ground is `--sunk-2`, a channel pressed into the panel rather than a
   surface laid on it, and the 2px between segments lets that ground through
   so the partition reads as parts rather than as one gradient. */
.sweep {
  position: relative;
  display: flex; gap: var(--sp-0);
  height: 12px;
  margin-top: var(--sp-5);
  background: var(--sunk-2);
}
/* Quarters, so "about two thirds" can be read off a bar that carries no
   numbers.

   NOTCHED AT THE EDGES, NOT CUT THROUGH. A hairline running the full height
   severs the strip: three of them at even spacing and the eye stops seeing
   one bar with a scale on it and starts seeing four equal blocks — which is
   the one thing this strip must not say, because its blocks are the states
   and they are never equal. The scoring marks the top and bottom three
   pixels and leaves the middle whole, the way a rule is scored along the
   edge of a gauge. */
.sweep::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px),
                              var(--sunk-3) calc(25% - 1px) 25%)
      top / 100% 3px repeat-x,
    repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px),
                              var(--sunk-3) calc(25% - 1px) 25%)
      bottom / 100% 3px repeat-x;
}
.sweep-part { display: block; min-width: 3px; }
.sweep-part[data-state] { background: var(--state-colour); }

/* The counters under the strip are `.stat` and nothing else: four states,
   four segments, one order, and a figure in the colour of its own segment —
   which is the only thing tying the two rows together. No legend swatch and
   no rule down the side of the box, because the order and the colour already
   say it. The shape and the state colour both live on `.stat` itself (see
   components.css), so this screen and the verification summary cannot drift
   into two sizes of the same object again. */

/* The only screen whose two columns were a RATIO rather than a rail, so it
   was the only one whose right-hand column changed width with the window
   while every other screen's stayed put. The check summary and the recent
   jobs are a rail: capped, and the category list takes what is left. */
.overview-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, var(--rail-wide));
  gap: var(--sp-5); margin-top: var(--sp-6); align-items: start;
}
@media (max-width: 1180px) {
  .overview-grid { grid-template-columns: 1fr; }
}

/* THE SAME INSTRUMENT, ONE LEVEL DOWN. Each row carries the strip from the
   top of the page over its own category, so the set and its parts are read
   the same way.

   The name column is capped rather than elastic. It used to take `1fr` and
   the strip a fixed 320: on a wide window the names ended wherever their
   own length put them, the strips started at six different places, and
   comparing one category with another — which is the entire job of this
   card — meant comparing bars that did not line up. Capped, they all start
   at the same x and share one width. */
.category-row {
  width: 100%;
  min-height: 46px;
  display: grid;
  grid-template-columns: minmax(0, 210px) minmax(0, 1fr) 62px;
  align-items: center; gap: var(--sp-5);
  padding: var(--sp-4) var(--sp-1);
  background: transparent;
  border: 0; border-bottom: 1px solid var(--line-soft);
  color: var(--text); cursor: pointer; text-align: left;
}
.category-row:last-child { border-bottom: 0; }
.category-row:hover { background: var(--raise-2); }
.category-name {
  display: flex; flex-direction: column; gap: var(--sp-0); min-width: 0;
}
.category-row .name {
  font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-md);
  letter-spacing: 0; text-transform: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* The types the category covers, in the panel's monospaced face because it
   is a list of identifiers rather than a sentence. */
.category-row .types {
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* No scale on the small ones: three hairlines across a six-pixel bar is not
   a scale anybody can read, and it makes the strip look broken. The quarters
   belong to the one at the top of the page. */
.category-row .sweep { height: 6px; margin-top: 0; }
.category-row .sweep::after { content: none; }
.category-count { text-align: right; }
@media (max-width: 620px) {
  .category-row { grid-template-columns: 1fr auto; }
  .category-row .sweep { display: none; }
}

/* Next steps: each row carries one task and the button that does it. */
.step-row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: start; gap: var(--sp-3);
  padding: var(--sp-4) 0; border-bottom: 1px solid var(--line-soft);
}
.step-row > .dot { margin-top: var(--sp-1); }
.step-row .text { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
.step-row .name { font-size: var(--fs-base); color: var(--text-bright); line-height: 1.4; }

.step-footer {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--sp-3); padding-top: var(--sp-4);
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
}

.summary-row {
  display: grid; grid-template-columns: 1fr auto;
  align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) 0; border-bottom: 1px solid var(--line-soft);
}
.summary-row .left { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
.summary-row .left span:last-child { font-size: var(--fs-base); color: var(--text-bright); }
.summary-row .value { font-family: var(--font-mono); font-size: var(--fs-sm); }

/* THE LAST SIX JOBS, on the overview. Three columns, not six sentences: the
   row used to read "Configuration · 12 devices — Completed" with the outcome
   glued to the end of a name of any length, so the six outcomes — the only
   part anybody scans this list for — finished at six different places down
   the column. They are one column now, against the right edge, and the dot
   that used to say the same thing in a colour beside the time is gone.

   The time keeps the monospaced face so the six line up on the colon; the
   job's own name does not, because it is prose and reads better as prose. */
.overview-job-row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: baseline; gap: var(--sp-4);
  padding: var(--sp-3) 0;
  border-bottom: 1px solid var(--line-soft);
}
.overview-job-row:last-child { border-bottom: 0; padding-bottom: 0; }
.overview-job-row .time {
  font-family: var(--font-mono); font-size: var(--fs-xs);
  color: var(--text-dim);
}
.overview-job-row .title {
  font-size: var(--fs-base); color: var(--text-bright);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.overview-job-row .outcome { font-size: var(--fs-sm); font-weight: 600; }

/* ─────────────────────────────────────────────────── configuration ── */
/* Shared settings run full width with the fields in several columns; the
   selected device's table sits below. The old narrow side panel made the
   fields an unnecessarily long list and left a large gap to its right on a
   narrow screen. */
.cfg-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--sp-5); margin-top: var(--sp-5); align-items: start;
}
.cfg-group-card {
  display: grid;
  grid-template-columns: repeat(3, minmax(210px, 1fr));
  gap: var(--sp-3) var(--sp-4);
}
.cfg-group-card > .card-head,
.cfg-group-card > .cfg-section,
.cfg-group-card > .cfg-defaults,
.cfg-group-card > p { grid-column: 1 / -1; }
.cfg-group-card .setting-row { margin: 0; }
.cfg-field { width: 132px; }
/* An inherited value: it is in the box but the user did not type it — it
   comes from DeviceMap or from the group. It has to be distinguishable from
   an entered value, or the user thinks they typed it. */
/* The card footer: the saved state and the reset. */
.cfg-defaults {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--sp-3); flex-wrap: wrap;
  margin-top: var(--sp-5); padding-top: var(--sp-4);
  border-top: 1px solid var(--line);
}
.cfg-saved-note {
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  line-height: 1.45;
}
.cfg-inherited { color: var(--text-mid); font-style: italic; }
.cfg-inherited:focus-visible { color: var(--text); font-style: normal; }
/* Section heading: on the UIC a list of 20+ fields is unreadable without one. */
.cfg-section {
  margin: var(--sp-5) 0 var(--sp-0);
  font-family: var(--font-heading); font-size: var(--fs-xs); font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; color: var(--text-mid);
  border-bottom: 1px solid var(--line); padding-bottom: var(--sp-1);
}
.cfg-group-card .cfg-section:first-of-type { margin-top: var(--sp-4); }
.cfg-device-area { min-width: 0; }
.cfg-device-head {
  display: flex; align-items: center; gap: var(--sp-3);
  margin-bottom: var(--sp-4); flex-wrap: wrap;
}

/* Devices are listed, not selected: clicking a row opens that device's
   settings window (see config.openDevice). */
.cfg-device-list { display: flex; flex-direction: column; }
.cfg-device-item {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto 12px;
  align-items: center; gap: var(--sp-3);
  width: 100%; padding: var(--sp-3) var(--sp-4);
  background: transparent;
  border: 1px solid var(--line); border-bottom: 0;
  color: var(--text); cursor: pointer; text-align: left;
  transition: background .14s ease, border-color .14s ease;
}
.cfg-device-item:last-child { border-bottom: 1px solid var(--line); }
.cfg-device-item:hover { background: var(--raise-2); }
.cfg-device-item[data-open="1"] {
  background: var(--accent-wash); border-color: var(--accent-line);
}
.cfg-item-name { font-size: var(--fs-base); }
.cfg-item-ip { font-size: var(--fs-sm); }
.cfg-item-chevron { color: var(--text-dim); font-size: var(--fs-md); line-height: 1; }

/* The device window: settings are edited in a centred dialog and applied to
   that device only. */
.cfg-window-body { display: flex; flex-direction: column; gap: var(--sp-3); }
.cfg-window-body .table-wrap { margin-top: 0; }

@media (max-width: 900px) {
  .cfg-group-card { grid-template-columns: repeat(2, minmax(210px, 1fr)); }
}
@media (max-width: 620px) {
  .cfg-group-card { grid-template-columns: minmax(0, 1fr); }
  .cfg-device-item { grid-template-columns: auto minmax(0, 1fr) 12px; }
  .cfg-item-ip { display: none; }
}

/* ─────────────────────────────────────────────────────── MQTT stream ── */
.mqtt-grid {
  display: grid;
  grid-template-columns: minmax(0, var(--rail)) minmax(0, 1fr);
  gap: var(--sp-5); margin-top: var(--sp-5); align-items: start;
}
@media (max-width: 900px) { .mqtt-grid { grid-template-columns: 1fr; } }

/* Prefixed with the screen it belongs to. Plain `.feed` collided with the
   `feed` STATE token of the port map (`.pm-port.feed`, `.pm-sample.feed`):
   the legend's "powering" swatch matched this rule too and came out as a
   9px-wide, 320px-tall bordered box. */
.mqtt-feed {
  border: 1px solid var(--line); background: var(--deep);
  padding: var(--sp-4) var(--sp-5) var(--sp-5); min-height: 320px;
  max-height: 60vh; overflow: auto;
}
.mqtt-feed-row {
  display: grid; grid-template-columns: 74px minmax(120px, 190px) minmax(0, 1fr);
  gap: var(--sp-4); padding: var(--sp-1) 0;
  font-family: var(--font-mono); font-size: var(--fs-sm); line-height: 1.5;
}
/* The topic is what the rows are scanned by, so it keeps the accent; the
   payload is the content and reads in the ordinary bright text. Both ellipse
   rather than running into what is beside them — the rule that was here
   before named a class (`.body`) that this screen has never written, so
   nothing was clipped and a long topic ran straight through its payload. */
.mqtt-topic { color: var(--accent); }
.mqtt-feed-row .payload { color: var(--text-bright); }

/* ──────────────────────────────────────────────────────────── PISCU ──── */
/* Two short lists laid out as grids rather than tables: fixed shape, a
   handful of rows, not worth the table machinery. The column templates are
   named here so a list's header and its rows cannot drift apart — written
   inline they were spelled out twice, once each. */
.piscu-clients { grid-template-columns: minmax(0, 1fr) 104px minmax(0, 110px); }
.piscu-extensions {
  grid-template-columns: 64px minmax(0, 1fr) 96px minmax(0, 130px);
}
/* The number the project says a device should answer on: the accent, because
   it is what the row is looked up by. The PISCU screen and the project's
   device–port table both show it, so it is one class and one colour rather
   than the same `color:var(--accent)` written into two screens' rows. */
.sip-extension { color: var(--accent); }
.piscu-row {
  display: grid; gap: var(--sp-3); padding: var(--sp-2) 0;
  border-bottom: 1px solid var(--line-soft);
  font-family: var(--font-mono);
}
/* The line over the extensions: the same columns without the rule, because
   it is a caption for the rows rather than one of them. */
.piscu-head { display: grid; gap: var(--sp-3); padding-bottom: var(--sp-2); }

/* ───────────────────────────────────── project and device list ────── */
/* THE PAGE IS THE MAP, AND THE MAP IS A CABINET OF SWITCHES.
   ─────────────────────────────────────────────────────────
   It used to be one flat table of every device in the DeviceMap, 110 rows
   of it on Gaziray, with the switch nowhere on the screen. Port numbers
   restart at 1 on every switch, so the port column read 1,2,3,4,5,7,8…17,
   then 1 again — and the only thing that said which cabinet a row belonged
   to was the suffix somebody had put in the device's NAME. The file itself
   is written as switches with devices hanging off their ports; the screen
   was the one place that shape had been thrown away.

   So the switch is a BAND across the ledger and its devices are the rows
   under it. The gaps in the port column (6 and 12 missing on Ska1_1) are
   free ports, and they are visible now because the numbers are read against
   one switch instead of eight. */
.admin-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, var(--rail));
  gap: var(--sp-5); margin-top: var(--sp-5); align-items: start;
}
@media (max-width: 900px) { .admin-grid { grid-template-columns: 1fr; } }

/* The rail: what this copy is loaded with. The category census always, and
   on a build that can open somebody else's train or mint a service key,
   those two cards under it. They used to sit in a row ABOVE the tables,
   which pushed the one thing the screen is for off the bottom of the
   window on the only builds that had them. */
.map-rail { display: grid; gap: var(--sp-5); }

/* THE LEDGER SCROLLS, THE PAGE DOES NOT.
   `.table-wrap` is already a scroll container — `overflow-x: auto` makes it
   one on both axes — so `position: sticky` inside it has never had the page
   to resolve against. Giving it a height of its own is what makes the
   column head and the switch bands pin, and it also means the census beside
   it does not scroll away from the rows it counts.

   180px is what stands above and below the ledger and never moves: the
   content area's padding, the page head, and the card's own frame and
   title. The floor keeps a short window showing rows rather than a slot. */
.map-wrap {
  max-height: calc(100vh - var(--top-height) - var(--footer-height) - 180px);
  min-height: 240px;
  overflow-y: auto;
}

/* The band is a row of the table, so it carries one cell and lays that cell
   out — a screen reader is told about one thing here, not three. */
.map-band {
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid var(--line); border-top: 0;
  background: var(--lift-2);
  /* Under the column head, which is sticky at the top of the same box. */
  position: sticky; top: 35px; z-index: 1;
}
.map-band-line {
  display: flex; align-items: baseline; gap: var(--sp-4); flex-wrap: wrap;
}
.map-band .name {
  font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-md);
  letter-spacing: .04em; color: var(--text);
}
/* The switch's own record — the address it answers on and how it is read.
   It is a device like the rest and it used to have a row of its own, with
   an em dash where its port would be; a switch has no port on itself. */
.map-band .meta {
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-mid);
}
.map-band .ports {
  margin-left: auto;
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
}

/* The port is the row's own reference and the column the ledger is read
   down, so it leads the row and the digits line up on the right. */
.map-port {
  font-family: var(--font-mono); font-size: var(--fs-sm);
  color: var(--text-mid); text-align: right;
}
/* The device name is what the row IS. It was the smallest and dimmest thing
   on the row while the type beside it was set in --text-bright. */
.map-name {
  font-family: var(--font-mono); font-size: var(--fs-base); color: var(--text);
}
.map-method {
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
  letter-spacing: .04em;
}

/* WHAT THE MAP HOLDS, AND THE FILTER OVER IT, AS ONE OBJECT.
   The card was a static glossary — six codes and the types behind them,
   in a rail beside a table four thousand pixels long. It says how many of
   each are in this map now, and pressing a row is how the ledger is cut
   down to them; the definition stays where it was rather than retreating
   into a tooltip. Pressed is drawn the way a chip is (components.css), so
   "this filter is on" is one signal across the panel. */
/* THE DEFINITION SITS UNDER THE NAME, NOT BESIDE IT. Side by side they fit
   the three-letter codes this card used to show (ANN, VIDEO, NET); they do
   not fit the category names it shows now, which are two words in either
   language. Those wrapped onto a second line and pushed the types they were
   meant to explain into the count. Stacked, the row holds a name of any
   length without anybody having measured it. */
.census-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--sp-0) var(--sp-3); width: 100%;
  padding: var(--sp-2) var(--sp-3);
  background: transparent; border: 0; cursor: pointer; text-align: left;
  color: var(--text-mid);
}
.census-row:hover { background: var(--lift-1); color: var(--text); }
.census-row[aria-pressed="true"] {
  background: var(--accent-wash);
  box-shadow: inset 0 0 0 1px var(--accent-line);
  color: var(--accent);
}
/* Placed rather than flowed. Auto-placement reads the DOM in order, and the
   types below span both columns, so the count was pushed onto a third line
   of its own — the name, its definition and its figure each on a line. The
   DOM order stays name → definition → count, which is the order it should
   be read out in. */
.census-row .name {
  grid-column: 1; grid-row: 1;
  font-family: var(--font-body); font-weight: 600; font-size: var(--fs-base);
  color: inherit;
}
/* The whole width of the row, under both cells above it: a type list is a
   caption for the name, and it is the one thing here that may be clipped. */
.census-row .types {
  grid-column: 1 / -1; grid-row: 2; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
}
.census-row .count {
  grid-column: 2; grid-row: 1; justify-self: end;
  font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text-bright);
}
.census-row[aria-pressed="true"] .types,
.census-row[aria-pressed="true"] .count { color: var(--accent); }

/* The search box sits in the page head beside the project name. The rail
   width is what stops it stretching across half the bar on a wide window. */
.map-search { width: var(--rail); max-width: 100%; }

/* ─────────────────────────────────────────────────── firmware install ── */
/* The image is chosen per device: every row has its own path and version
   box. The bulk field at the top is a convenience only — its value is written
   into the rows. */
.fw-bulk { margin-top: var(--sp-5); padding: var(--sp-5) var(--sp-5) var(--sp-4); }
.fw-bulk-fields {
  display: flex; align-items: flex-end; gap: var(--sp-4);
  flex-wrap: wrap; margin-top: var(--sp-4);
}
.fw-bulk-fields label { display: block; }
.fw-bulk-fields .label { display: block; margin-bottom: var(--sp-1); }
.fw-field-narrow { flex: 0 1 150px; }

/* The file cell in a row: name + select/remove. The name is clipped and the
   full path lives in the tooltip — the path does not fit the row and is never
   typed by hand. */
.fw-file {
  display: flex; align-items: center; gap: var(--sp-2); min-width: 0;
  font-size: var(--fs-sm);
}
.fw-file > span { flex: 1; min-width: 0; }
.fw-pick-btn { flex: none; padding: var(--sp-1) var(--sp-3); font-size: var(--fs-sm); }
.fw-file .btn-close { width: 20px; height: 20px; }

/* The row inputs sit inside the table cell: they must not grow the row
   height, or a 15-device list no longer fits the screen. */
.fw-row .field {
  min-height: 0; padding: var(--sp-1) var(--sp-3);
  font-size: var(--fs-sm); background: var(--deep);
}
.fw-row .field:disabled { color: var(--text-dim); cursor: not-allowed; }
.fw-device {
  display: flex; align-items: center; gap: var(--sp-3); min-width: 0;
}
.fw-state { font-size: var(--fs-sm); color: var(--text-mid); }
/* A row with a file selected is read from the strip on the left, so "which
   ones are ready" is visible without going through the list. */
.fw-row[data-selected="1"] { box-shadow: inset 3px 0 0 var(--accent); }
/* The list of what a write is about to touch, inside its confirmation.
   Named for the component rather than the screen: every confirmation shows
   the same thing (see components/confirm.js). The old `.fw-confirm-list`
   name is kept alongside it — the firmware screen's markup predates the
   shared component and reads the same. */
.confirm-list, .fw-confirm-list {
  margin-top: var(--sp-3); max-height: 240px; overflow-y: auto;
  font-family: var(--font-mono); font-size: var(--fs-sm);
}
.confirm-list .row, .fw-confirm-list .row {
  display: flex; justify-content: space-between; gap: var(--sp-4);
  padding: var(--sp-1) 0; border-bottom: 1px solid var(--line-soft);
}
.confirm-list .row b,
.fw-confirm-list .row b { color: var(--accent); font-weight: 500; }

/* The devices screen's search box, beside the state filter. `type=search`
   for the browser's own clear button — a field that filters a list wants a
   one-click way back to the whole list. */
.device-head-actions {
  display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap;
}
.device-search { width: min(320px, 46vw); }

/* THE TWO FILTER ROWS LINE UP. Category and State are the same control in
   two rows, and the word in front of each is what tells them apart — but
   `.chip-bar .label` sizes itself to its own text, so "Category" and "State"
   pushed their chips to two different left edges and the pair read as two
   unrelated strips. A floor under the caption puts both rows of chips on one
   column; in rem, so it holds when the operating system's text size changes.
   A longer word in another language simply pushes past it. */
#v-devices .chip-bar .label { min-width: 4.5rem; }

/* THE NORMAL STATE IS NOT NEWS. "Reachable" is most of a healthy set, and in
   the state green it made a column of forty rows that the eye had to read
   past to find the two that matter. The strip in the gutter already says a
   row is fine; the word here only has to be legible. The states that need
   somebody keep their colour, because those are the rows being looked for. */
#v-devices .state-text[data-state="ok"],
#v-checklist .state-text[data-state="ok"] { color: var(--text-mid); }

/* How many rows are selected, and the way out of the selection. Only drawn
   when there IS one, so it does not compete with the search box on the
   ordinary visit; it reads like the switch screen's selection strip because
   it is the same act. */
.device-selection {
  display: flex; align-items: center; gap: var(--sp-3);
  padding-right: var(--sp-4);
  border-right: 1px solid var(--line);
  color: var(--accent);
  font-family: var(--font-mono); font-size: var(--fs-xs);
}

/* A sortable column heading. The heading text and the arrow are one button,
   and the arrow only appears on the column actually in use — an arrow on
   every heading reads as decoration rather than as state. */
.sort-btn {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  padding: 0; border: 0; background: none;
  font: inherit; color: inherit; letter-spacing: inherit;
  text-align: left; cursor: pointer;
}
.sort-btn:hover { color: var(--text-bright); }
.sort-btn[aria-pressed="true"] { color: var(--accent); }
.sort-mark { font-size: var(--fs-xs); line-height: 1; }

.overview-column { display: flex; flex-direction: column; gap: var(--sp-5); }

/* A HEADING THAT IS AN ANSWER, with the state it reports in front of it.
   The network screen asks it first — is this computer ready to reach the
   devices — and the MQTT and PISCU screens ask their own version of the same
   question, so the shape is named for what it does rather than for the first
   screen that wanted it. */
.verdict { display: flex; align-items: center; gap: var(--sp-4); }
.verdict .dot { width: 10px; height: 10px; }

/* ─────────────────────────────────────────────────────── checklist ─── */
/* Every column of the template sits side by side; the table scrolls
   horizontally inside itself and the page body does not. */
.na-cell {
  /* An empty grey cell: "not used on this device type". No text is written;
     the ground carries the meaning (see the legend). */
  background: var(--inert);
  height: 14px;
  align-self: center;
  display: block;
}

/* The row's state is also read from the strip on its left. An inset shadow
   rather than a border: nothing thickens, so its alignment with the header
   row does not drift.

   The device list is read the same way. It used to mark the state with a
   seven-pixel dot in front of the name and again, in the heading face and
   upper case, in a column two thirds of the way across — the quiet encoding
   too small to scan and the loud one too far from the eye's path down the
   left edge. One strip, in the gutter, on both of the panel's long lists. */
#v-checklist .table-row[data-state],
#v-devices .table-row[data-state] {
  box-shadow: inset 3px 0 0 var(--state-colour);
}

/* ──────────────────────────────────── shared local navigation ────── */
/* The main menu chooses the context; these tabs only change the view of the
   open area. The underline shows the selection without suggesting a sequence
   of steps. */
.local-tabs,
.action-tab-list {
  display: flex;
  align-items: center;
  gap: var(--sp-6);
  min-width: 0;
  overflow-x: auto;
  border-bottom: 1px solid var(--line);
}
.local-tabs { margin: var(--sp-1) 0 var(--sp-5); }

/* THE OPERATIONS TAB ROW CARRIES THE SCREEN'S OWN CONTROLS.
   ────────────────────────────────────────────────────────
   The rule under the tabs runs the whole width, so it belongs to the row and
   not to the list of tabs inside it; the list keeps the layout it shares with
   `.local-tabs` and gives the border up. `flex-end` is what keeps the active
   tab's two-pixel underline sitting on that rule rather than floating above
   it when the controls beside it are taller. */
.action-tabs {
  display: flex; align-items: flex-end; gap: var(--sp-5); flex-wrap: wrap;
  margin: var(--sp-0) 0 var(--sp-5);
  border-bottom: 1px solid var(--line);
}
/* THE TABS ARE NEVER THE THING THAT GIVES WAY. With a plain `flex: 1 1 260px`
   the controls beside them squeezed the list until the third tab was cut off
   mid-word — and a clipped tab is not a tab, it is a bug the operator has to
   discover by scrolling something that shows no scrollbar. The floor is the
   list's own content width, capped at the row so the list itself can still
   scroll on a window narrower than three tabs; the controls wrap under it
   before any of that happens. */
.action-tab-list {
  flex: 1 1 auto; min-width: min(100%, max-content);
  border-bottom: 0;
}
.action-tab-actions {
  display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  flex: none; margin-left: auto;
  padding-bottom: var(--sp-2);
}
/* The picker brings its own bottom margin for the row it used to be. */
.action-tab-actions .target-picker { margin: 0; }
.local-tab,
.action-tab {
  position: relative;
  flex: none;
  min-height: 39px;
  padding: var(--sp-2) var(--sp-0) var(--sp-3);
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--text-mid);
  cursor: pointer;
  font-family: var(--font-body);
  font-size: var(--fs-md);
  font-weight: 600;
  white-space: nowrap;
  transition: color .16s ease, border-bottom-color .2s ease;
}
.local-tab:hover,
.action-tab:hover { color: var(--text); }
.local-tab[aria-selected="true"],
.local-tab[aria-pressed="true"],
.action-tab.active,
.action-tab[data-active="1"] {
  border-bottom-color: var(--accent);
  color: var(--text);
}

/* The tab transition: the new screen must not swap in within a single frame.
   The heading and the tab strip stay put, so without this the change went
   unnoticed. app.js retriggers the animation on every screen change. */
@keyframes view-transition {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: none; }
}
.view.view-enter { animation: view-transition .2s ease-out both; }
@media (prefers-reduced-motion: reduce) {
  .view.view-enter { animation: none; }
  .local-tab, .action-tab { transition: none; }
}

/* ─────────────────────────────────────────────── descriptions ─────── */

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--sp-5);
  margin-top: var(--sp-6);
}
.section-head p {
  max-width: 720px;
  margin: var(--sp-1) 0 0;
  color: var(--text-mid);
  font-size: var(--fs-base);
  line-height: 1.5;
}

/* The raw source text in the device detail is kept apart from the ordinary
   information. */
.tech-detail {
  margin-top: var(--sp-5);
  border-top: 1px solid var(--line);
  color: var(--text-mid);
}
.tech-detail > summary {
  padding: var(--sp-4) 0;
  cursor: pointer;
  font-size: var(--fs-base);
  font-weight: 600;
}
.tech-detail[open] > summary { color: var(--text); }

/* ──────────────────────────────────── verification and reports ──── */
.report-tabs { margin-top: var(--sp-0); }
/* The check summary is four `.stat` boxes in a `.stat-grid`; both live in
   components.css now. The category bar above them carries no bottom margin,
   and the grid brings the same top spacing a table does, so the bar's border
   no longer sits on the cards' and the two read as separate blocks. */
/* A floor, not a height: a long finding still wraps onto a second line. The
   number matches the row height of every other table in the panel — the 48px
   it used to be came from the cells being two size steps larger than the
   device list beside it. */
.check-deviation-row { min-height: 39px; }
.deviation-text {
  color: var(--text-bright);
  font-size: var(--fs-base);
  line-height: 1.45;
}
/* A device with nothing wrong is listed too, so that "everything here was
   checked" is visible; it is not the row anyone is looking for, so it does
   not read as loudly as a finding — which is what the state green it used to
   be written in did do, seven times down a column whose subject is the rows
   that are NOT fine. The strip in the gutter says the device answered. */
.deviation-text[data-passed="1"] { color: var(--text-mid); }

@media (max-width: 620px) {
  .local-tabs,
  .action-tab-list { gap: var(--sp-5); }
  .section-head { align-items: flex-start; }
}

/* ─────────────────────────────────────────── the computer's network ──── */
/* The rows follow the technical card on the IP screen: label on the left,
   value right-aligned and monospaced, a hairline between them. Same shape,
   because they answer the same kind of question. */
/* Both cards side by side while there is room for two of them; the tracks
   collapse to one on a narrow window without a width of their own, the way
   `.stat-grid` does. */
.net-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: var(--sp-5); margin-top: var(--sp-5); align-items: start;
}
.net-card { display: flex; flex-direction: column; gap: var(--sp-0); }
.net-card > .label { margin: var(--sp-4) 0 var(--sp-1); }

.net-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-5);
  padding: var(--sp-3) 0;
  border-bottom: 1px solid var(--line-soft);
  color: var(--text-mid);
  font-size: var(--fs-base);
}
.net-row:last-child { border-bottom: none; }
/* The value, and it is the thing the row exists for — an address, an adapter
   name. It used to be set a step SMALLER than the caption beside it, which
   is the wrong way round on a screen whose whole content is these values. */
.net-row > b {
  max-width: 60%;
  color: var(--text-bright);
  font-size: var(--fs-base);
  font-weight: 400;
  text-align: right;
  overflow-wrap: anywhere;
}

.net-label { display: flex; flex-direction: column; gap: var(--sp-0); min-width: 0; }
.net-hint { color: var(--text-dim); font-size: var(--fs-sm); line-height: 1.4; }
.net-note {
  margin: var(--sp-2) 0 0;
  color: var(--text-dim);
  font-size: var(--fs-sm);
  line-height: 1.5;
}

.net-actions { display: flex; align-items: center; gap: var(--sp-3); flex: none; }
.net-card > .net-actions { margin-top: var(--sp-4); }

.net-input {
  padding: var(--sp-1) var(--sp-3);
  border: 1px solid var(--line-strong);
  background: var(--panel-2);
  color: var(--text-bright);
  font-family: var(--font-mono);
  font-size: var(--fs-base);
  max-width: 260px;
}
.net-input[type="number"] { width: 90px; text-align: right; }
.net-accent { color: var(--accent); }

@media (max-width: 620px) {
  .net-row { align-items: flex-start; flex-direction: column; gap: var(--sp-2); }
  .net-row > b { max-width: 100%; text-align: left; }
}

/* The panel could not tell which adapter reaches the devices and is asking.
   Marked like a prompt, not like an error: nothing is broken, it just has a
   question that one click answers.

   It takes the whole row, and so does what follows it. A screen that cannot
   work until somebody answers a question should not put that question in a
   column beside the readings it is waiting on — the point of asking is that
   it is the loudest thing here. */
.net-ask,
.net-ask ~ .net-card { grid-column: 1 / -1; }
.net-ask { border-color: var(--accent); }
.net-ask > .card-head h3 { color: var(--accent); }

/* ─────────────────────────────────────────────────────────── ADB screen ── */
/* The bench tool. Cards down the page, in the order the work is done — the
   address list, the application, what to do to it, what to put on it, this
   computer's daemon, and what happened — rather than side by side. They used
   to be three, with the last one holding everything that was not a list; it
   was the card nobody could read. */

/* Two columns: the tables on the left, the controls on the right (see
   views/adb/index.js for which card goes where and why). Stacked full width,
   the daemon's two buttons had the same fourteen hundred pixels as the
   device table, and the screen ran to three times its own height.

   The rail is capped rather than proportional: past about 420px these rows
   are a label and a short value with empty space after them, and a wider
   rail only takes width off the tables that can use it. */
.adb-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, var(--rail-wide));
  gap: var(--sp-5); margin-top: var(--sp-5); align-items: start;
}
.adb-column { display: flex; flex-direction: column; gap: var(--sp-5); min-width: 0; }
/* The gap owns the spacing now; the per-card margins would double it. */
.adb-grid .adb-pool, .adb-grid .adb-packages, .adb-grid .adb-actions,
.adb-grid .adb-install, .adb-grid .adb-server,
.adb-grid .adb-status { margin-top: 0; }

/* In the rail a label beside its value leaves a third of the row for a file
   name. Same treatment the narrow window already gets, applied because the
   COLUMN is narrow rather than the screen — which a media query cannot ask
   about. */
.adb-grid .adb-op-row > .label { flex: 1 1 100%; }
.adb-grid .adb-autostart-log { margin-left: 0; }

/* One column again before the rail squeezes the device table below the
   520px it is laid out for. */
@media (max-width: 1180px) {
  .adb-grid { grid-template-columns: minmax(0, 1fr); }
}

.adb-pool { margin-top: var(--sp-5); }
.adb-packages, .adb-actions, .adb-install,
.adb-server, .adb-status { margin-top: var(--sp-5); }

.adb-add { margin-top: var(--sp-4); }
.adb-add-fields { display: flex; gap: var(--sp-3); flex-wrap: wrap; }
.adb-ip-field { font-family: var(--font-mono); }

/* A text box with its name in front of it instead of inside it (see
   views/adb/fields.js). The tag and the box share one outline: the tag takes
   the left border and the box drops its own, so the pair reads as a single
   control rather than as a word that happens to sit near a field. */
.adb-field { display: flex; align-items: stretch; flex: 1 1 200px; min-width: 0; }
.adb-field-tag {
  display: flex; align-items: center; white-space: nowrap;
  padding: 0 var(--sp-3);
  border: 1px solid var(--line-strong); border-right: 0;
  background: var(--panel);
  font-family: var(--font-body); font-size: var(--fs-sm); font-weight: 600;
  color: var(--text-mid);
}
.adb-field .field { flex: 1 1 auto; width: auto; min-width: 0; }

.adb-pool-tools {
  display: flex; gap: var(--sp-3); flex-wrap: wrap; margin: var(--sp-4) 0 var(--sp-1);
}

/* The selectable row. `button.table-row[aria-selected="true"]` already paints
   the selected background; the row here is a div because it CONTAINS two
   buttons (the tick and the remove), and a button inside a button is not
   valid markup. So the selected background is repeated for this one case. */
.adb-row[data-selected="1"] { background: var(--accent-wash); }
.adb-tick {
  width: 22px; height: 22px; padding: 0; justify-content: center;
  border-color: var(--line);
}
.adb-row .btn-small { justify-self: start; }
/* The row's own buttons: restart this display, forget this address. */
.adb-row-actions { display: flex; gap: var(--sp-2); justify-self: start; }

.adb-search { display: flex; gap: var(--sp-3); margin-top: var(--sp-4); flex-wrap: wrap; }
.adb-keyword { min-width: 0; }

.adb-package-list {
  display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-4);
}
.adb-package { align-items: flex-start; }
.adb-package .box { margin-top: var(--sp-1); }
.adb-package-text {
  display: flex; flex-direction: column; gap: var(--sp-0); min-width: 0;
}
/* Found everywhere / found on some. The second is the whole reason the search
   answers per device (see views/adb/packages.js), so it is marked. */
.adb-package-note { color: var(--text-mid); font-size: var(--fs-sm); }
.adb-package-warn { color: var(--auth-text); font-size: var(--fs-sm); }

.adb-op-bar { display: flex; gap: var(--sp-3); flex-wrap: wrap; margin-top: var(--sp-1); }
.adb-op-row {
  display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  padding: var(--sp-3) 0; border-top: 1px solid var(--line-soft);
  margin-top: var(--sp-4);
}
/* The label column of an operation row. The log under the row indents to
   the same measure so its lines start where the values above them do; one
   token, because two literals drifted apart the first time either moved. */
.adb-actions { --adb-label: 140px; }
.adb-op-row > .label { flex: 0 0 var(--adb-label); }
.adb-op-row > .mono, .adb-op-row > .adb-op-empty { flex: 1 1 160px; min-width: 0; }
.adb-op-empty { color: var(--text-dim); font-size: var(--fs-sm); }
/* A verdict the operator has to do something about. Amber rather than red:
   the autostart being absent or unparsed is a job to finish, not a fault in
   the device. */
.adb-op-row > .adb-op-bad {
  flex: 1 1 160px;
  min-width: 0;
  color: var(--auth-text);
  font-size: var(--fs-sm);
}
/* What the generated boot script logged, under its row. Monospaced and
   scrollable: these are the device's own words and are worth nothing
   reflowed. */
.adb-autostart-log {
  margin: var(--sp-1) 0 0 var(--adb-label);
  padding: var(--sp-3);
  border-left: 2px solid var(--line);
  max-height: 150px;
  overflow-y: auto;
}
.adb-autostart-log p {
  margin: var(--sp-0) 0;
  font-size: var(--fs-sm);
  color: var(--text-dim);
}

.adb-run-state { font-size: var(--fs-sm); }
.adb-run-row[data-state="ok"] .adb-run-state { color: var(--ok-text); }
.adb-run-row[data-state="failed"] .adb-run-state { color: var(--failed-text); }
.adb-run-row[data-state="unknown"] .adb-run-state {
  color: var(--unknown-text);
}
.adb-run-row[data-state="failed"] { box-shadow: inset 3px 0 0 var(--failed); }

/* The log of what has finished (views/adb/status.js). TWENTY ROWS AND THEN IT
   SCROLLS: a bench afternoon is a hundred lines, and a card that grows to
   hold all of them pushes everything else off the screen — including the
   buttons that write the next line. The header row is sticky, so scrolling
   does not leave six unlabelled columns. */
.adb-log-head {
  display: flex; align-items: baseline; gap: var(--sp-3);
  margin: var(--sp-5) 0 0; padding-top: var(--sp-4);
  border-top: 1px solid var(--line);
}
.adb-log-head .spacer { flex: 1; }
.adb-log-count { font-size: var(--fs-sm); color: var(--text-dim); }
.adb-log {
  /* One row is `--sp-3` of padding twice, a 20px line and a 1px border; the
     extra row is the header sitting on top of them. */
  --adb-log-row: 38px;
  max-height: calc(21 * var(--adb-log-row));
  overflow-y: auto;
}

@media (max-width: 620px) {
  .adb-op-row > .label { flex: 1 1 100%; }
  .adb-autostart-log { margin-left: 0; }
  /* Half the screen is not worth a log on a phone-width window. */
  .adb-log { max-height: calc(11 * var(--adb-log-row)); }
}

/* static/css/ip.css */
/* The IP assignment screen: the switch front panel, the run
   settings card and the assignment plan.

   Split out of views.css because it was more than half of it. No
   selector here appears in views.css, so loading this file after it
   changes nothing in the cascade. */

#v-ip { max-width: 1580px; margin: 0 auto; }

/* The run's action, at the foot of the form it belongs to. The readiness line
   sits with it: "why is this button disabled" and the button are one thing.

   It used to be `position: sticky; bottom: 0`, which pinned it to the bottom
   of the viewport while the card scrolled — and a bottom-pinned bar covers
   whatever is behind it. On this card that was the addressing rows and the
   job summary: the bar floated in the MIDDLE of the form, looking like a
   divider and hiding the very lines ("target", "mask to assign") the operator
   is about to act on. The form now ends where the button is. */
.ip-action-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  margin-top: var(--sp-1);
  padding: var(--sp-4) var(--sp-5);
  border-top: 1px solid var(--line);
  background: var(--panel);
}
.ip-action-bar .ip-start-btn { flex: none; }

/* The way out of the one error this screen cannot fix. */
.ip-network-link { align-self: flex-start; margin-top: -4px; }
.ip-readiness {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-mid);
}
.ip-readiness i {
  width: 6px; height: 6px;
  background: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-wash);
}
.ip-readiness[data-state="ready"] i {
  background: var(--ok);
  box-shadow: 0 0 0 3px var(--ok-sheen);
}
.ip-readiness[data-state="error"] { color: var(--danger-text); }
.ip-readiness[data-state="error"] i {
  background: var(--failed);
  box-shadow: 0 0 0 3px var(--failed-wash);
}
.ip-start-btn {
  min-height: 40px;
  padding: var(--sp-3) var(--sp-5);
  box-shadow: 0 8px 22px var(--drop-soft);
}

/* One run panel on the left, the front panels of the two switches stacked on
   its right. The right column is as wide as a panel; the run panel takes what
   is left. */
.ip-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 480px;
  gap: var(--sp-6);
  margin-top: var(--sp-6);
  align-items: start;
}
.ip-panel-area { min-width: 0; }

.ip-section-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-5);
  margin-bottom: var(--sp-4);
}
.ip-section-title {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-4);
  min-width: 0;
}
.ip-section-head h3 { margin-top: var(--sp-0); }
.ip-section-head p,
.ip-section-count {
  flex: none;
  padding: var(--sp-1) var(--sp-2);
  border: 1px solid var(--line);
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}

/* The settings card has three clear layers: targets, protections, summary. */
.ip-settings-card {
  position: sticky;
  top: 8px;
  min-width: 0;
  padding: 0;
  background:
    linear-gradient(145deg, var(--accent-sheen), transparent 42%),
    var(--panel);
}
/* THE BANDED HEAD — the second and last card anatomy. An IP card carries no
   padding of its own (its areas are separated by full-width rules), so its
   title sits in a band that reaches both edges rather than inside the card's
   inset like `.card-head` does. Kept apart from `.card-head` on purpose, and
   it is the only card head that is. */
.ip-card-head {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-4);
  padding: var(--sp-5);
  border-bottom: 1px solid var(--line);
  background: var(--raise-1);
}
.ip-card-head h3 { margin-top: var(--sp-0); }
.ip-form-section,
.setting-section {
  min-width: 0;
  margin: 0;
  border: 0;
}
.ip-switch-picker-area {
  padding: var(--sp-5);
  border-bottom: 1px solid var(--line);
}
.ip-switch-picker-area > .label { display: block; margin-bottom: var(--sp-2); }
.ip-switch-picker-area > .field { width: 100%; }
.ip-port-area { padding: var(--sp-5); }
.ip-field-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  margin-bottom: var(--sp-2);
}
.ip-field-count {
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
.ip-settings-card .field {
  min-height: 39px;
  background: var(--deep);
}
.ip-settings-card #port-warning { margin: var(--sp-2) 0 0; }

.setting-section {
  padding: var(--sp-5);
  border-top: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.ip-sub-head { margin-bottom: var(--sp-1); }
.ip-sub-head p {
  margin: var(--sp-1) 0 0;
  color: var(--text-mid);
  font-size: var(--fs-sm);
  line-height: 1.45;
}
.setting-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--sp-4);
  min-height: 45px;
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--line-soft);
  background: var(--sunk-1);
}
.setting-row:hover { border-color: var(--line); }
.setting-row .label {
  margin: 0;
  color: var(--text-mid);
  line-height: 1.4;
}
.setting-row select.field { width: auto; min-width: 138px; max-width: 180px; }
.ip-medium-field { width: 148px; }
.ip-field-error {
  margin: -2px 0 var(--sp-0);
  padding: 0 var(--sp-3);
  color: var(--danger-text);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  line-height: 1.45;
}

.setting-summary {
  margin: 0;
  padding: var(--sp-5);
  border-top: 1px solid var(--line);
  background: var(--sunk-1);
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  line-height: 1.55;
}
.ip-ready-badge {
  border-color: var(--ok-line);
  color: var(--ok);
}
.ip-waiting-badge { border-color: var(--auth-line); color: var(--auth); }
.ip-error-badge { border-color: var(--failed-line); color: var(--danger-text); }
.ip-run-error {
  margin: 0 0 var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  border-left: 2px solid var(--failed);
  background: var(--failed-sheen);
  color: var(--danger-text);
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  line-height: 1.45;
}
.setting-summary .row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--sp-4);
  padding: var(--sp-1) 0;
  border-bottom: 1px solid var(--line-soft);
}
.setting-summary .row:last-child { border-bottom: 0; }
.setting-summary .row.protected { color: var(--auth); }

.setting-summary b {
  max-width: 65%;
  font-weight: 400;
  color: var(--text-bright);
  text-align: right;
  overflow-wrap: anywhere;
}
.setting-summary b.accent-text { color: var(--accent); }

/* Panels sit side by side where there is room and stack when there is not. */
/* The panels always stack: putting two switches side by side narrowed both
   and made the port map unreadable. */
.panel-stack {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--sp-5);
}

.front-panel {
  min-width: 0;
  /* The column width is tuned to the port map (see .ip-grid) and the card
     fills it. Leaving it narrow squeezed the map, and in a wide column the
     28 ports floated in the middle of the box. */
  width: auto;
  max-width: 100%;
  padding: 0;
  background:
    linear-gradient(180deg, var(--raise-1), transparent 40%),
    var(--panel);
  transition: border-color .14s ease, background .14s ease, transform .14s ease;
}
/* The two panels look equal. Marking the active switch with a border colour,
   an inner strip and a badge on top of that weakened the cards; which switch
   the run is on is already readable from the run summary and the blue marks
   on the selected ports. */
.front-panel:hover { border-color: var(--line-strong); }
.ip-switch-head {
  min-height: 67px;
  padding: var(--sp-4) var(--sp-5);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-4);
  border-bottom: 1px solid var(--line-soft);
}
.ip-switch-identity { min-width: 0; }
.ip-switch-name { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
.ip-switch-name i {
  width: 7px; height: 7px;
  flex: none;
  background: var(--text-faint);
}
.front-panel[data-active="1"] .ip-switch-name i {
  background: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-wash);
}
.ip-switch-name h3 {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ip-switch-identity > .mono {
  display: block;
  margin: var(--sp-1) 0 0 var(--sp-5);
  color: var(--text-mid);
  font-size: var(--fs-xs);
}
.ip-switch-badges {
  display: flex;
  justify-content: flex-end;
  gap: var(--sp-1);
  flex-wrap: wrap;
}
.ip-source-badge { color: var(--text-mid); }
.ip-source-badge.live { border-color: var(--ok-line); color: var(--ok); }

/* How many seconds ago the data was read; past 15 s it counts as stale. */
.ip-freshness {
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
  align-self: center;
}
.ip-freshness[data-stale="1"] { color: var(--auth); }

/* The automatic refresh of the front panels — it can be paused. */
.ip-section-action { display: flex; align-items: center; gap: var(--sp-3); flex: none; }
.ip-refresh-btn {
  padding: var(--sp-1) var(--sp-3);
  font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 400;
  letter-spacing: .04em; text-transform: none;
  border-color: var(--line); color: var(--text-mid);
}
.ip-refresh-btn[aria-pressed="true"] {
  border-color: var(--ok-line); color: var(--ok);
}
/* Why the panel could not be read: a one-line note, not a box. Two boxes
   with the same sentence for two switches overwhelmed the panel. */
.ip-panel-note {
  margin: var(--sp-3) var(--sp-5) 0;
  padding-left: var(--sp-3);
  border-left: 2px solid var(--line-strong);
  color: var(--text-mid);
  font-family: var(--font-mono); font-size: var(--fs-xs); line-height: 1.5;
}
.ip-credential-btn {
  padding: var(--sp-1) var(--sp-3);
  font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 400;
  letter-spacing: .04em; text-transform: none;
  border-color: var(--auth-line); color: var(--auth);
}
.ip-credential-btn:hover:not(:disabled) {
  background: var(--auth-wash); border-color: var(--auth);
}

/* The plan below is scanned by state badges rather than by fading rows. */
.ip-plan-section {
  margin-top: var(--sp-6);
  padding-top: var(--sp-6);
  border-top: 1px solid var(--line);
}
.ip-plan-metrics {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex-wrap: wrap;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-mid);
}
.ip-plan-metrics span {
  padding: var(--sp-1) var(--sp-2);
  border: 1px solid var(--line);
}
.ip-plan-metrics b { color: var(--text); font-weight: 500; }
.ip-plan-table { margin-top: 0; }
.ip-plan-table .table-head { background: var(--lift-1); }
.ip-plan-row { min-height: 43px; }
/* The gutter strip the device list and the verification list are both read
   by, at the same three pixels. Here it says the port is in the run. */
.ip-plan-row[data-actionable="1"] {
  box-shadow: inset 3px 0 0 var(--accent);
}
.ip-plan-row[data-actionable="0"] { background: var(--sunk-3); }
.ip-plan-row[data-actionable="0"] .ip-device-name,
.ip-plan-row[data-actionable="0"] .ip-address { color: var(--text-dim); }
.ip-port-badge {
  width: fit-content;
  padding: var(--sp-1) var(--sp-2);
  border: 1px solid var(--line);
  color: var(--text-bright);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
.ip-device-name { font-size: var(--fs-sm); }
.ip-group-name { font-size: var(--fs-sm); color: var(--text-mid); }
.ip-address { font-size: var(--fs-sm); }
.ip-target-ip { color: var(--accent); }
/* THE WORD, QUIETLY. It was a bordered chip with a coloured dot in it, one
   per row, in the accent — so a port's place in the run was said four times
   over: the strip in the gutter, the row's own ground, the chip's border and
   colour, and the dot inside it. The strip is what the table is scanned by
   and the ground is what dims the rows nobody asked about; this only has to
   name which of the three cases a row is, because "outside the target group"
   and "matched automatically" are not the same answer and no colour could
   tell them apart. */
.ip-state-badge {
  width: fit-content;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  white-space: nowrap;
}
.ip-state-badge.included { color: var(--text-mid); }

@media (max-width: 900px) {
  .ip-grid { grid-template-columns: minmax(0, 1fr); gap: var(--sp-5); margin-top: var(--sp-5); }
  .ip-settings-card { position: static; }
  /* When it falls to one column the panel must not stretch the page; the map
     is already drawn for 480px. */
  .ip-panel-area { max-width: 480px; }
  /* And the two faceplates stack, for the same reason: side by side inside a
     480px cap each one is half a drawing. */
  .panel-stack { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 620px) {
  .ip-action-bar { flex-direction: column; align-items: stretch; }
  .ip-action-bar .ip-start-btn { width: 100%; }
  .ip-readiness { align-self: flex-end; }
  .ip-start-btn { width: 100%; }
  .ip-section-head { gap: var(--sp-3); }
  .ip-section-count { display: none; }
  .ip-plan-section { margin-top: var(--sp-6); padding-top: var(--sp-5); }
  .ip-card-head,
  .ip-port-area,
  .setting-section,
  .setting-summary { padding-left: var(--sp-5); padding-right: var(--sp-5); }
  .setting-row { grid-template-columns: minmax(0, 1fr); gap: var(--sp-2); }
  .setting-row select.field,
  .ip-medium-field { width: 100%; max-width: none; }
  .ip-switch-head { flex-direction: column; }
  .ip-switch-badges { justify-content: flex-start; }
  .ip-plan-section > .ip-section-head { flex-direction: column; }
}

.legend {
  display: flex; gap: var(--sp-5); flex-wrap: wrap; margin-top: var(--sp-4);
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim);
}
.legend i {
  display: inline-block; width: 8px; height: 8px; margin-right: var(--sp-2);
}

/* ─────────────────────────────────────────────── disclosures ─ */
.ip-collapsible > summary {
  list-style: none;
  cursor: pointer;
}
.ip-collapsible > summary::-webkit-details-marker { display: none; }
.ip-collapsible-summary::after {
  content: "+";
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 23px;
  height: 23px;
  flex: none;
  margin-left: auto;
  border: 1px solid var(--line);
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-md);
  font-weight: 400;
}
.ip-collapsible[open] > .ip-collapsible-summary::after { content: "−"; }
.ip-collapsible-summary:hover::after {
  border-color: var(--accent);
  color: var(--accent);
}
.ip-panel-tools {
  justify-content: flex-end;
  padding: 0 0 var(--sp-3);
}
/* Factory-IP reset is intentionally separate from the primary assignment
   settings. It is rendered only for a plan whose backend declares support;
   the destructive button sits at the far end of a labelled maintenance card. */
.ip-factory-reset-card {
  margin-top: var(--sp-5);
  padding: var(--sp-5);
  border-color: var(--failed-edge);
  background:
    linear-gradient(145deg, var(--failed-sheen), transparent 45%),
    var(--panel);
}
.ip-factory-reset-head p,
.ip-factory-reset-actions p {
  margin: var(--sp-1) 0 0;
  color: var(--text-mid);
  font-size: var(--fs-sm);
  line-height: 1.5;
}
.ip-factory-reset-address {
  flex: none;
  padding: var(--sp-1) var(--sp-3);
  border: 1px solid var(--failed-edge);
  color: var(--danger-text);
  font-size: var(--fs-sm);
}
.ip-reset-scope {
  min-width: 0;
  margin: var(--sp-5) 0 0;
  padding: var(--sp-4);
  border: 1px solid var(--line-soft);
}
.ip-reset-scope > legend { padding: 0 var(--sp-2); }
.ip-reset-scope-options {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
}
.ip-reset-scope-option {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 38px;
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid var(--line);
  color: var(--text-mid);
  font-size: var(--fs-sm);
  cursor: pointer;
}
.ip-reset-scope-option[data-active="1"] {
  border-color: var(--accent-line);
  color: var(--text-bright);
  background: var(--accent-sheen);
}
.ip-reset-scope-option input { accent-color: var(--accent); }
.ip-reset-external-set {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 150px;
  align-items: center;
  gap: var(--sp-4);
  margin-top: var(--sp-4);
}
.ip-reset-set-field { width: 150px; }
.ip-reset-scope > .ip-field-error { margin-top: var(--sp-2); padding-left: 0; }
.ip-factory-reset-actions {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--sp-5);
  margin-top: var(--sp-4);
}
.ip-factory-reset-actions p { max-width: 700px; }
.ip-factory-reset-actions .btn { flex: none; }

/* The bench flow shares the maintenance card's shape but not its tone: it
   writes one address to one display, so it is ordinary work rather than a
   destructive step. */
.ip-manual-card {
  margin-top: var(--sp-5);
  padding: var(--sp-5);
}
.ip-manual-card .setting-row { padding-left: 0; padding-right: 0; }

@media (max-width: 620px) {
  .ip-factory-reset-head,
  .ip-factory-reset-actions { align-items: stretch; flex-direction: column; }
  .ip-factory-reset-address { align-self: flex-start; }
  .ip-reset-external-set { grid-template-columns: minmax(0, 1fr); }
  .ip-reset-set-field { width: 100%; }
  .ip-factory-reset-actions .btn { width: 100%; }
}

/* The file behind "install software before assigning". The name can be long
   and the two buttons must stay reachable, so it wraps rather than pushing
   them off the row. */
.ip-preflash-file {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--sp-3);
  flex-wrap: wrap;
  min-width: 0;
  font-size: var(--fs-sm);
}
.ip-preflash-file .mono { overflow-wrap: anywhere; }

/* Compartment LCD: every selected port has its own 10.1.1.x source and its own
   server-side APK selection. The compact list makes a missing file visible
   without turning the primary IP card into a second firmware table. */
.ip-lcd-source {
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid var(--line-soft);
  background: var(--accent-sheen);
}
.ip-lcd-source .row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-4);
  color: var(--text-mid);
  font-size: var(--fs-sm);
}
.ip-lcd-source .row b {
  color: var(--accent);
  font-size: var(--fs-xs);
  font-weight: 400;
  text-align: right;
}
.ip-apk-block {
  margin-top: var(--sp-0);
  padding: var(--sp-4);
  border: 1px solid var(--line);
  background: var(--sunk-2);
}
.ip-apk-head,
.ip-apk-controls,
.ip-apk-actions {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
.ip-apk-head { justify-content: space-between; }
.ip-apk-controls {
  align-items: flex-end;
  justify-content: space-between;
  margin-top: var(--sp-4);
}
.ip-apk-version {
  display: grid;
  gap: var(--sp-1);
}
.ip-apk-version .label { margin: 0; }
.ip-apk-list {
  display: grid;
  gap: var(--sp-1);
  margin-top: var(--sp-4);
}
.ip-apk-row {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(115px, 1fr) minmax(145px, 1.3fr) auto;
  align-items: center;
  gap: var(--sp-3);
  min-height: 35px;
  padding: var(--sp-2) var(--sp-3);
  border-left: 2px solid var(--line);
  background: var(--raise-1);
  font-size: var(--fs-xs);
}
.ip-apk-row[data-selected="1"] { border-left-color: var(--ok); }
.ip-apk-row > :last-child {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  white-space: nowrap;
}
.ip-apk-error { margin: var(--sp-3) 0 0; padding: 0; }

@media (max-width: 620px) {
  .ip-apk-controls { align-items: stretch; flex-direction: column; }
  .ip-apk-version,
  .ip-apk-version .field { width: 100%; }
  .ip-apk-actions { width: 100%; }
  .ip-apk-actions .btn { flex: 1; }
  .ip-apk-row { grid-template-columns: minmax(0, 1fr); gap: var(--sp-1); }
  .ip-apk-row > :last-child { white-space: normal; }
  .ip-lcd-source .row { align-items: flex-start; flex-direction: column; gap: var(--sp-1); }
  .ip-lcd-source .row b { text-align: left; }
}

/* static/css/switch.css */
/* The switch screen, and the faceplate both switch screens draw.
 *
 * THE .pm-* BLOCK BELOW USED TO LIVE IN ip.css. It moved here when the
 * drawing became shared (see static/js/components/front_panel.js): the IP
 * assignment screen and this one show the front of the same SICOM3028GPT, and
 * one of them owning the stylesheet for both was how the two drifted apart in
 * the first place. ip.css does NOT pull this file in — the desktop bundle
 * inlines every stylesheet anyway (tools/build_desktop_bundle.py), and a
 * cross-file include would only add a second load order to reason about.
 * (It would also not survive the bundler, which refuses one outright.)
 *
 * Colours come from base.css tokens throughout; nothing here hard-codes a
 * palette value that is not already a token tint of one.
 */

/* The front panel sits in a dark chassis and keeps the physical port order. */
.pm-case {
  margin: var(--sp-4) var(--sp-5) 0;
  padding: var(--sp-4) var(--sp-4) var(--sp-3);
  border: 1px solid var(--line);
  background: var(--deep);
  box-shadow: inset 0 1px 12px var(--drop-soft);
}
.pm-wrap { overflow-x: auto; padding-bottom: var(--sp-0); }
/* The grid is as wide as its content and sits centred in the chassis. It used
   to fill the chassis edge to edge with `min-width:100%`, leaving the ports
   floating in the middle of a 500-pixel box. */
.pm-grid {
  width: max-content;
  margin: 0 auto;
  display: grid;
  /* The cell and connector sizes come from the caller — see PANEL_SIZES in
     components/front_panel.js. The IP screen stands two faceplates in a
     column and takes the compact one; the Switch screen has the full width
     and takes the large one. */
  grid-template-columns:
    repeat(var(--pm-columns, 6), var(--pm-cell, 52px))
    var(--pm-gap, 12px) var(--pm-cell, 52px);
  gap: var(--sp-1);
  align-items: center;
}
/* A FLUID faceplate: the tracks share the chassis instead of huddling in the
   middle of it, and the connector grows with its track rather than staying a
   fixed dot in a widening cell — which is how this looked the first time the
   grid was stretched on its own. `--pm-cell` is the floor, so a narrow window
   scrolls `.pm-wrap` rather than squashing the ports. */
.pm-grid-fluid {
  width: 100%;
  grid-template-columns:
    repeat(var(--pm-columns, 6), minmax(var(--pm-cell, 52px), 1fr))
    var(--pm-gap, 12px) minmax(var(--pm-cell, 52px), 1fr);
}
.pm-grid-fluid .pm-port svg {
  width: 72%;
  height: auto;
  max-width: var(--pm-svg-max, 96px);
}
/* The number under the connector grows with it. At the panel-wide 11px beside
   a connector this size it read as a footnote, which is the wrong way round —
   the number is what the operator is looking for. */
.pm-grid-fluid .pm-port {
  gap: var(--sp-1);
  color: var(--text);
  font-size: var(--pm-label, var(--fs-xs));
}

.pm-divider { height: 100%; border-left: 1px dashed var(--line-strong); }
.pm-empty { min-height: 12px; }

.pm-port {
  min-height: 49px;
  width: 100%;
  padding: var(--sp-1) var(--sp-0) var(--sp-0);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-0);
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-mid);
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  transition: border-color .12s ease, background .12s ease, color .12s ease;
}
.pm-port svg {
  display: block;
  width: var(--pm-svg, 36px);
  height: var(--pm-svg, 36px);
}
.pm-port .shell { fill: transparent; stroke: var(--glyph); stroke-width: 1.3; }
.pm-port .inner { fill: none; stroke: var(--glyph-soft); stroke-width: 1; }
/* The X on an uplink's face. Its rules were lost when this block moved out of
   ip.css and the mark went with them; it is drawn again and it is coloured by
   the port's state like every other part of the connector. */
.pm-port .cross {
  fill: none; stroke: var(--glyph-soft); stroke-width: .9;
  stroke-linecap: round;
}
.pm-port .key { fill: var(--glyph); }
.pm-port .pin { fill: var(--glyph); }
.pm-port:hover:not(:disabled):not([aria-disabled="true"]) {
  border-color: var(--line-strong);
  background: var(--raise-2);
  color: var(--text);
}
.pm-port:focus-visible { outline-offset: -2px; }
.pm-port[aria-disabled="true"] { cursor: not-allowed; }

/* No device defined: normally not selectable, kept so its place is not a
   hole.  The LCD bench flow marks empty physical PoE ports separately because
   a test display may deliberately be patched into any of them. */
.pm-port.empty { opacity: .38; cursor: not-allowed; }
.pm-port.physical-target { opacity: .72; cursor: pointer; }
.pm-port.physical-target:hover:not([aria-disabled="true"]),
.pm-port.physical-target.selected { opacity: 1; }
.pm-port.physical-target[aria-disabled="true"] { cursor: not-allowed; }

/* ── the connector's COLOUR: the port's present state ──
   The distinction and the colours match the Switch Management Panel, so
   whoever looks at the same switch from two applications sees one thing. */
.pm-port.feed .shell { stroke: var(--ok); fill: var(--ok-wash); }
.pm-port.feed .inner, .pm-port.feed .cross { stroke: var(--ok); }
.pm-port.feed .key, .pm-port.feed .pin { fill: var(--ok); }

.pm-port.link .shell { stroke: var(--accent); fill: var(--accent-wash); }
.pm-port.link .inner, .pm-port.link .cross { stroke: var(--accent); }
.pm-port.link .key, .pm-port.link .pin { fill: var(--accent); }

.pm-port.off .shell { stroke: var(--failed-glyph); fill: var(--failed-sheen); }
.pm-port.off .inner, .pm-port.off .cross { stroke: var(--failed-glyph); }
.pm-port.off .key { fill: var(--failed-glyph); }
.pm-port.off .pin { fill: var(--pin-off); }

/* Port up but PoE off: the line works, there is just no power — red pins. */
.pm-port.unpowered .pin { fill: var(--pin-unpowered); }

/* ── the BORDER: the port's role in the run ──
   The colour already says what state the port is in, so the role is shown
   with a border; folding both into one colour made "is it up, or is it
   selected?" impossible to tell. */
.pm-port.selected {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
  background: var(--accent-sheen);
  color: var(--accent);
}

/* The port the computer is on: if the run touches it, the link is cut. */
.pm-port.pc {
  border-color: var(--auth);
  box-shadow: inset 0 0 0 1px var(--auth);
  color: var(--auth); cursor: not-allowed;
}

/* The port linking the two switches is out of the run; dashed border. */
.pm-port.link-port {
  border: 1px dashed var(--glyph-strong);
  color: var(--text-bright); cursor: not-allowed;
}

.pm-footer {
  display: flex;
  gap: var(--sp-3);
  margin-top: var(--sp-3);
  padding-top: var(--sp-3);
  border-top: 1px solid var(--line-soft);
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}

.pm-sample {
  display: block;
  width: 9px; height: 9px;
  flex: none;
  border: 1px solid var(--glyph);
  border-radius: 50%;
}
/* The role samples explain the border and the state samples the colour —
   the same split as on the panel. */
.pm-sample.selected {
  border-radius: 2px; border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.pm-sample.pc {
  border-radius: 2px; border-color: var(--auth);
  box-shadow: inset 0 0 0 1px var(--auth);
}
.pm-sample.link-port {
  border-radius: 2px; border-style: dashed;
  border-color: var(--glyph-strong);
}
.pm-sample.feed { border-color: var(--ok); background: var(--ok-edge); }
.pm-sample.link { border-color: var(--accent); background: var(--accent-edge); }
.pm-sample.off { border-color: var(--failed); background: var(--failed-edge); }
.pm-sample.empty { opacity: .38; }
/* Linked, with the power switched off: on the panel the shell keeps its state
   colour and only the PINS go red, so the sample keeps its plain edge and
   carries the red inside it. Same name as the counter above the faceplate. */
.pm-sample.nopwr { box-shadow: inset 0 0 0 2px var(--pin-unpowered); }


/* The legend sits once below the section, not inside the panel cards. */
.panel-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2) var(--sp-4);
  margin: var(--sp-4) 0 0;
  padding: var(--sp-4) var(--sp-0) 0;
  border-top: 1px solid var(--line);
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
.panel-legend span { display: flex; align-items: center; gap: var(--sp-2); }


/* ── the screen ─────────────────────────────────────────────────────── */
.switch-discovery { margin-top: var(--sp-5); }
.switch-panel,
.switch-ports,
.switch-network { margin-top: var(--sp-5); }

.switch-scan-form {
  display: flex;
  gap: var(--sp-3);
  margin-top: var(--sp-4);
  flex-wrap: wrap;
  align-items: flex-end;
}
/* The scan form: a range, a mask and the two buttons, each labelled. They
   wrap together rather than each on its own line — on a narrow window the
   range keeps the room and the mask stays beside it. */
.switch-scan-label {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  min-width: 0;
}
.switch-scan-label:first-child { flex: 1 1 220px; }
.switch-range-field {
  width: 100%;
  min-width: 0;
  font-family: var(--font-mono);
}
.switch-prefix-field {
  width: 92px;
  font-family: var(--font-mono);
}
/* Aligned with the fields' boxes, not with their labels. */
.switch-scan-actions {
  display: flex;
  gap: var(--sp-3);
  align-self: flex-end;
}

.switch-row[data-selected="1"] { background: var(--accent-wash); }
.switch-row .btn-small { justify-self: start; }
.switch-row .muted { color: var(--text-dim); }
/* The boxes on the row. Narrower than a form field: they sit in a table
   column, and the whole row has to stay readable beside them. */
.switch-credential {
  width: 100%;
  min-width: 0;
  padding: var(--sp-1) var(--sp-2);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
/* A switch still waiting for an account: the amber the rest of the panel
   uses for "needs credentials", carried on the row rather than on a badge
   crowded in beside the name. */
.switch-row[data-locked="1"] .switch-credential { border-color: var(--auth-line); }
.switch-row[data-locked="1"] .switch-credential:focus { border-color: var(--auth); }

.switch-identity { display: flex; align-items: baseline; gap: var(--sp-3); min-width: 0; }
.switch-identity h3 {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.switch-identity .mono { color: var(--text-mid); font-size: var(--fs-xs); }

/* ── the faceplate's counters and selection bar ──────────────────────── */
.stat {
  display: flex;
  align-items: baseline;
  gap: var(--sp-1);
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
.stat b { color: var(--text); font-weight: 600; }
.stat.link b { color: var(--accent); }
.stat.feed b { color: var(--ok-text); }
.stat.nopwr b { color: var(--failed-text); }

.switch-selection {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  flex-wrap: wrap;
  margin: var(--sp-4) var(--sp-5) 0;
  padding-top: var(--sp-3);
  border-top: 1px solid var(--line-soft);
}
.switch-selection-info {
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
.switch-selection[data-empty="0"] .switch-selection-info { color: var(--accent); }

/* ── the port tables ─────────────────────────────────────────────────── */
.switch-table-block { margin-top: var(--sp-4); }
.switch-table-block h4 {
  margin: 0 0 var(--sp-3);
  color: var(--text-mid);
  font-size: var(--fs-sm);
}
.switch-port-row { cursor: pointer; }
/* The link column: square, then the word beside it. */
.switch-link-cell {
  display: flex; align-items: center; gap: var(--sp-2);
  min-width: 0;
}
.switch-port-row[aria-selected="true"] { background: var(--accent-wash); }
.switch-port-row .muted { color: var(--text-dim); }
/* An uplink has no PoE and no wattage. The cells stay, empty, so the four
   columns it does have line up with the same four in the PoE table above. */
.switch-port-row .muted:empty { min-height: 1px; }

/* The port's on/off button is a `.pill` — see components.css. It says what
   the port IS, not what pressing it does; the title attribute carries that. */

select.poe {
  width: 100%;
  min-width: 0;
  padding: var(--sp-1) var(--sp-2);
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
select.poe.off { border-color: var(--failed-line); color: var(--failed-text); }


/* ── the switch's own network, and the operations that end a session ─── */
.switch-network-current {
  display: flex;
  gap: var(--sp-6);
  flex-wrap: wrap;
  margin-top: var(--sp-4);
}
.switch-field { display: flex; flex-direction: column; gap: var(--sp-1); }
.switch-field b { color: var(--text); font-size: var(--fs-sm); }

.switch-network-form { margin-top: var(--sp-4); }
.switch-network-fields {
  display: flex;
  gap: var(--sp-3);
  flex-wrap: wrap;
  margin-bottom: var(--sp-3);
}
.switch-network-fields .field { flex: 1 1 140px; min-width: 0; }
.switch-network-fields .field:first-child { font-family: var(--font-mono); }

.switch-lifecycle {
  display: flex;
  gap: var(--sp-3);
  flex-wrap: wrap;
  margin-top: var(--sp-5);
  padding-top: var(--sp-4);
  border-top: 1px solid var(--line-soft);
}

/* ── the sign-in dialog ──────────────────────────────────────────────── */
.switch-auth-fields {
  display: flex;
  gap: var(--sp-3);
  flex-wrap: wrap;
  margin: var(--sp-4) 0 var(--sp-3);
}
.switch-auth-fields .field { flex: 1 1 150px; min-width: 0; }



@media (max-width: 900px) {
  .pm-case { margin-left: var(--sp-4); margin-right: var(--sp-4); }
  .panel-legend { padding-left: var(--sp-4); padding-right: var(--sp-4); }
  .switch-selection { margin-left: var(--sp-4); margin-right: var(--sp-4); }
  .switch-network-current { gap: var(--sp-4); }
}
</style>
</head>

    <!-- Project identity. The train set is changed here without admin mode:

         itself opens a menu — see js/app.js. -->

      <button type="button" id="project-btn" data-i18n-title="topbar.projectDetails"
              title="Project details">
        <span class="dot" style="background:var(--accent)" aria-hidden="true"></span>
        <span id="project-name">—</span>
      </button>
      <span class="text-dim" aria-hidden="true">/</span>

        <span aria-hidden="true">SET</span>
